// Detailed budget build-up modal: hours/category + materials + consumables +
// vehicle trips×distance + margin% + a free +/- adjustment. Computes a final
// quote (budgetAmount) that plugs straight into computeJobFinancials.
function BudgetBuilderModal({ job, categories, vehicles, onClose, onSave }) {
  const seedHours = job.budgetHours || {};
  const [hours, setHours] = useState(() => categories.reduce((acc, c) => ({ ...acc, [c.code]: seedHours[c.code] || "" }), {}));
  const [materials, setMaterials] = useState(job.budgetMaterials || "");
  const [consumables, setConsumables] = useState(job.budgetConsumables || "");
  const [trips, setTrips] = useState(job.budgetVehicleTrips || "");
  const [distance, setDistance] = useState(job.budgetVehicleDistance || job.avgOneWayKm || "");
  const assignedVehicle = vehicles.find((v) => v.id === job.vehicleId);
  const [rate, setRate] = useState(job.budgetVehicleRate || assignedVehicle?.ratePerKm || "");
  const [marginPercent, setMarginPercent] = useState(job.marginPercent || "");
  const [adjustment, setAdjustment] = useState(job.budgetOtherAdjustment || "");
  const [reason, setReason] = useState("");
  const [estimatedDays, setEstimatedDays] = useState(job.estimatedDays || "1");

  const isReestimate = Boolean(job.budgetAmount && job.budgetAmount > 0);
  const currentRev = Number(job.estimationRevision) || 1;
  const nextRev = isReestimate ? currentRev + 1 : 1;

  const setHour = (code, v) => setHours((h) => ({ ...h, [code]: v }));

  const calc = computeBudgetBuildUp({
    budgetHours: hours, budgetMaterials: materials, budgetConsumables: consumables,
    budgetVehicleTrips: trips, budgetVehicleDistance: distance, budgetVehicleRate: rate,
    marginPercent, budgetOtherAdjustment: adjustment,
  }, categories);

  const save = () => {
    const historyEntry = {
      revision: nextRev,
      date: todayISO(),
      previousQuote: job.budgetAmount || 0,
      newQuote: Number(calc.budgetAmount.toFixed(2)),
      previousCostCeiling: job.budgetOtherAdjustment != null ? computeBudgetBuildUp(job, categories).adjustedCost : 0,
      newCostCeiling: Number(calc.adjustedCost.toFixed(2)),
      reason: reason.trim() || (isReestimate ? "Re-estimation revision update" : "Initial budget estimation"),
    };

    onSave({
      budgetHours: hours, budgetMaterials: materials, budgetConsumables: consumables,
      budgetVehicleTrips: trips, budgetVehicleDistance: distance, budgetVehicleRate: rate,
      marginPercent, budgetOtherAdjustment: adjustment,
      budgetAmount: Number(calc.budgetAmount.toFixed(2)),
      estimatedDays,
      estimationRevision: nextRev,
      estimationHistory: [...(job.estimationHistory || []), historyEntry],
      lastReestimatedAt: todayISO(),
      lastReestimatedReason: reason.trim() || (isReestimate ? "Re-estimation revision update" : "Initial budget estimation"),
    });
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(20,25,20,0.45)" }} onClick={onClose}>
      <div className="w-full max-w-lg rounded-lg overflow-hidden max-h-[92vh] overflow-y-auto" style={{ background: COLORS.paper, fontFamily: "'Inter',sans-serif" }} onClick={(e) => e.stopPropagation()}>
        <div className="px-5 py-4 flex items-center justify-between" style={{ background: COLORS.steelDark }}>
          <div className="disp text-white font-bold tracking-wide flex items-center gap-2">
            <Zap size={16} color={COLORS.safety} /> {isReestimate ? `RE-ESTIMATE / REVISE QUOTE — #${job.jobOrderNo} (Rev #${nextRev})` : `DETAILED BUDGET — #${job.jobOrderNo}`}
          </div>
          <button onClick={onClose}><X size={18} color="#fff" /></button>
        </div>
        <div className="p-5">
          <div className="text-[10px] font-semibold uppercase tracking-wide mb-1" style={{ color: COLORS.steelLight }}>Labor Hours by Type</div>
          <div className="grid grid-cols-3 gap-2 mb-3">
            {categories.map((c) => (
              <Field key={c.code} label={`${c.label} (${fmtMoney(c.rate)}/day)`}>
                <input type="number" min="0" step="0.5" className={inputCls} style={{ ...inputStyle, padding: "6px 8px" }}
                  value={hours[c.code]} onChange={(e) => setHour(c.code, e.target.value)} placeholder="hrs" />
              </Field>
            ))}
          </div>

          <div className="text-[10px] font-semibold uppercase tracking-wide mb-1 mt-1" style={{ color: COLORS.steelLight }}>Materials, Consumables &amp; Vehicle</div>
          <div className="grid grid-cols-2 gap-x-3">
            <Field label="Materials Budget (AED)"><input type="number" min="0" className={inputCls} style={inputStyle} value={materials} onChange={(e) => setMaterials(e.target.value)} /></Field>
            <Field label="Consumables Budget (AED)"><input type="number" min="0" className={inputCls} style={inputStyle} value={consumables} onChange={(e) => setConsumables(e.target.value)} /></Field>
          </div>
          <div className="grid grid-cols-4 gap-x-2">
            <Field label="Vehicle Trips"><input type="number" min="0" className={inputCls} style={inputStyle} value={trips} onChange={(e) => setTrips(e.target.value)} placeholder="e.g. 5" /></Field>
            <Field label="One-Way Distance"><input type="number" min="0" step="0.1" className={inputCls} style={inputStyle} value={distance} onChange={(e) => setDistance(e.target.value)} /></Field>
            <Field label="Rate (AED/km)"><input type="number" min="0" step="0.1" className={inputCls} style={inputStyle} value={rate} onChange={(e) => setRate(e.target.value)} /></Field>
            <Field label="Est. Days Work"><input type="number" min="1" step="1" className={inputCls} style={inputStyle} value={estimatedDays} onChange={(e) => setEstimatedDays(e.target.value)} placeholder="1" /></Field>
          </div>

          <div className="text-[10px] font-semibold uppercase tracking-wide mb-1 mt-1" style={{ color: COLORS.steelLight }}>Margin &amp; Adjustments</div>
          <div className="grid grid-cols-2 gap-x-3">
            <Field label="Expected Margin %"><input type="number" min="0" max="99" step="0.5" className={inputCls} style={inputStyle} value={marginPercent} onChange={(e) => setMarginPercent(e.target.value)} placeholder="e.g. 20" /></Field>
            <Field label="Other Charges Adjustment (+/-)" hint="Negotiated extras or discounts."><input type="number" step="1" className={inputCls} style={inputStyle} value={adjustment} onChange={(e) => setAdjustment(e.target.value)} placeholder="e.g. -200" /></Field>
          </div>

          <div className="mt-2">
            <Field label="Re-Estimation / Scope Update Reason" hint="Optional reason for revision log (e.g. Scope change, extra trips).">
              <input type="text" className={inputCls} style={inputStyle} value={reason} onChange={(e) => setReason(e.target.value)} placeholder="e.g. Added extra technician hours &amp; 2 vehicle trips" />
            </Field>
          </div>

          <div className="rounded-lg p-3 mt-2" style={{ background: "#fff", border: `1.5px solid ${COLORS.line}` }}>
            <div className="grid grid-cols-2 gap-y-1 text-[12px] mono">
              <span style={{ color: "#8A8F84" }}>Labor</span><span className="text-right">{fmtMoney(calc.laborCost)}</span>
              <span style={{ color: "#8A8F84" }}>Materials</span><span className="text-right">{fmtMoney(calc.materials)}</span>
              <span style={{ color: "#8A8F84" }}>Consumables</span><span className="text-right">{fmtMoney(calc.consumables)}</span>
              <span style={{ color: "#8A8F84" }}>Vehicle</span><span className="text-right">{fmtMoney(calc.vehicleCost)}</span>
              <span className="font-semibold" style={{ color: COLORS.ink }}>Base Cost</span><span className="text-right font-semibold">{fmtMoney(calc.baseCost)}</span>
              <span style={{ color: "#8A8F84" }}>Adjustment</span><span className="text-right">{calc.adjustment >= 0 ? "+" : ""}{fmtMoney(calc.adjustment)}</span>
              <span className="font-semibold" style={{ color: COLORS.ink }}>Target Cost Ceiling</span><span className="text-right font-semibold">{fmtMoney(calc.adjustedCost)}</span>
              <span style={{ color: "#8A8F84" }}>Margin ({calc.marginPercent || 0}%)</span><span className="text-right">{fmtMoney(calc.marginAmount)}</span>
            </div>
            <div className="flex items-center justify-between pt-2 mt-2" style={{ borderTop: `1.5px dashed ${COLORS.line}` }}>
              <span className="disp font-bold" style={{ color: COLORS.steel }}>QUOTE / BUDGET</span>
              <span className="disp text-xl font-bold" style={{ color: COLORS.steel }}>{fmtMoney(calc.budgetAmount)}</span>
            </div>
          </div>

          <div className="flex gap-2 mt-4">
            <button onClick={onClose} className="flex-1 py-2 rounded-md text-sm font-semibold" style={{ background: COLORS.paperDark, color: COLORS.steel }}>Cancel</button>
            <button onClick={save} className="flex-1 py-2 rounded-md text-sm font-bold disp tracking-wide" style={{ background: COLORS.safety, color: COLORS.steelDark }}>
              {isReestimate ? `SAVE RE-ESTIMATION (Rev #${nextRev})` : "SAVE BUDGET"}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------
   JOB COSTING — dashboard + detailed per-job cost breakdown
--------------------------------------------------------------------- */
// Thin horizontal cost gauge for each job card. The full bar represents the
// quoted Budget; a marker shows where the Target Cost sits (the cost/margin
// boundary), and a dark fill shows how far actual spend has moved along it.
// The track itself is banded into 4 quarters, green → red, as a simple
// at-a-glance "how deep into the budget are we" risk gradient.
function CostProgressBar({ actualCost, targetCost, budgetAmount }) {
  if (!budgetAmount || budgetAmount <= 0) {
    return <div className="text-[10px] italic mt-1" style={{ color: "#8A8F84" }}>No budget set</div>;
  }
  const targetPct = Math.min((targetCost / budgetAmount) * 100, 100);
  const actualPct = Math.min((actualCost / budgetAmount) * 100, 100);
  const isOver = actualCost > budgetAmount;
  const overAmount = actualCost - budgetAmount;

  return (
    <div className="mt-1.5" onClick={(e) => e.stopPropagation()}>
      <div className="relative w-full rounded-full overflow-hidden" style={{ height: 7, background: COLORS.paper }}>
        <div className="absolute inset-0 flex">
          <div style={{ width: "25%", background: `${COLORS.go}30` }} />
          <div style={{ width: "25%", background: `${COLORS.go}66` }} />
          <div style={{ width: "25%", background: `${COLORS.amber}66` }} />
          <div style={{ width: "25%", background: `${COLORS.urgent}66` }} />
        </div>
        <div className="absolute inset-y-0 left-0 rounded-full" style={{ width: `${actualPct}%`, background: COLORS.steelDark, opacity: 0.88, transition: "width 0.3s ease" }} />
        <div className="absolute inset-y-0" style={{ left: `calc(${targetPct}% - 1px)`, width: 2, background: "#fff", boxShadow: `0 0 0 1px ${COLORS.steel}` }} title="Target cost / margin boundary" />
      </div>
      <div className="flex justify-between text-[9.5px] mono mt-0.5" style={{ color: "#8A8F84" }}>
        <span>Spent {fmtMoney(actualCost)}</span>
        <span>Target {fmtMoney(targetCost)}</span>
        {isOver
          ? <span style={{ color: COLORS.urgent, fontWeight: 600 }}>+{fmtMoney(overAmount)} over</span>
          : <span>Budget {fmtMoney(budgetAmount)}</span>}
      </div>
    </div>
  );
}

function JobCostingPanel({ jobOrders, workers, vehicles, categories, entries, cash, otherExpenses, onUpdateJob, onAddOtherExpense, onDeleteOtherExpense }) {
  const [budgetJob, setBudgetJob] = useState(null);
  const [expenseJob, setExpenseJob] = useState(null);
  const [expandedId, setExpandedId] = useState(null);

  const rows = useMemo(() => jobOrders.map((j) => ({
    job: j, f: computeJobFinancials(j, vehicles, entries, cash.entries, otherExpenses.entries),
  })).sort((a, b) => {
    // surface the most at-risk jobs first
    const order = { "overrun": 0, "nearing": 1, "on-track": 2, "no-budget": 3 };
    return order[a.f.budgetStatus] - order[b.f.budgetStatus] || b.job.createdAt - a.job.createdAt;
  }), [jobOrders, vehicles, entries, cash, otherExpenses]);

  const withBudget = rows.filter((r) => r.f.targetCost > 0);
  const totalBudget = withBudget.reduce((s, r) => s + r.f.budget, 0);
  const totalTarget = withBudget.reduce((s, r) => s + r.f.targetCost, 0);
  const totalActual = rows.reduce((s, r) => s + r.f.actualCost, 0);
  const overrunJobs = withBudget.filter((r) => r.f.budgetStatus === "overrun");
  const nearingJobs = withBudget.filter((r) => r.f.budgetStatus === "nearing");
  const onTrackJobs = withBudget.filter((r) => r.f.budgetStatus === "on-track");

  return (
    <div>
      {/* --- dashboard summary --- */}
      <div className="grid gap-3 mb-5" style={{ gridTemplateColumns: "repeat(auto-fit, minmax(160px, 1fr))" }}>
        <div className="rounded-lg p-3" style={{ background: COLORS.steelDark }}>
          <div className="text-[10px] uppercase tracking-widest text-white/50">Total Budget</div>
          <div className="disp text-xl font-bold text-white">{fmtMoney(totalBudget)}</div>
        </div>
        <div className="rounded-lg p-3" style={{ background: COLORS.steelDark }}>
          <div className="text-[10px] uppercase tracking-widest text-white/50">Total Target Cost</div>
          <div className="disp text-xl font-bold text-white">{fmtMoney(totalTarget)}</div>
        </div>
        <div className="rounded-lg p-3" style={{ background: COLORS.steelDark }}>
          <div className="text-[10px] uppercase tracking-widest text-white/50">Total Actual Cost</div>
          <div className="disp text-xl font-bold" style={{ color: totalActual > totalTarget && totalTarget > 0 ? COLORS.urgent : COLORS.safety }}>{fmtMoney(totalActual)}</div>
        </div>
        <div className="rounded-lg p-3" style={{ background: "#fff", border: `1.5px solid ${COLORS.urgent}` }}>
          <div className="text-[10px] uppercase tracking-widest" style={{ color: COLORS.urgent }}>Over Budget</div>
          <div className="disp text-xl font-bold" style={{ color: COLORS.urgent }}>{overrunJobs.length} job{overrunJobs.length === 1 ? "" : "s"}</div>
        </div>
        <div className="rounded-lg p-3" style={{ background: "#fff", border: `1.5px solid ${COLORS.amber}` }}>
          <div className="text-[10px] uppercase tracking-widest" style={{ color: COLORS.amber }}>Nearing Target</div>
          <div className="disp text-xl font-bold" style={{ color: COLORS.amber }}>{nearingJobs.length} job{nearingJobs.length === 1 ? "" : "s"}</div>
        </div>
        <div className="rounded-lg p-3" style={{ background: "#fff", border: `1.5px solid ${COLORS.go}` }}>
          <div className="text-[10px] uppercase tracking-widest" style={{ color: COLORS.go }}>On Track</div>
          <div className="disp text-xl font-bold" style={{ color: COLORS.go }}>{onTrackJobs.length} job{onTrackJobs.length === 1 ? "" : "s"}</div>
        </div>
      </div>

      {(overrunJobs.length > 0 || nearingJobs.length > 0) && (
        <div className="mb-5 rounded-lg p-3" style={{ background: "#FBEAEA", border: `1.5px solid ${COLORS.urgent}` }}>
          <div className="text-[11px] font-bold uppercase tracking-wide mb-1.5 flex items-center gap-1.5" style={{ color: COLORS.urgent }}>
            <AlertTriangle size={13} /> Needs Attention
          </div>
          <div className="grid gap-1">
            {[...overrunJobs, ...nearingJobs].map(({ job, f }) => (
              <div key={job.id} className="flex items-center justify-between text-[12px]">

                <span className="mono font-semibold" style={{ color: BUDGET_STATUS_META[f.budgetStatus].color }}>{f.percentOfTarget.toFixed(0)}% of target</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* --- detailed per-job costing --- */}
      <div className="grid gap-2">
        {rows.length === 0 && <EmptyState text="No job orders yet." />}
        {rows.map(({ job, f }) => {
          const open = expandedId === job.id;
          const meta = BUDGET_STATUS_META[f.budgetStatus];
          const pct = f.percentOfTarget != null ? Math.min(f.percentOfTarget, 999) : 0;
          return (
            <div key={job.id} className="rounded-lg" style={{ background: "#fff", border: `1.5px solid ${COLORS.line}` }}>

                <div className="text-left">
                  <div className="text-sm font-semibold flex items-center gap-2">

                      <span className="text-[10px] font-semibold px-2 py-0.5 rounded-full flex items-center gap-1" style={{ color: meta.color, background: `${meta.color}1A` }}>
                        {f.budgetStatus !== "on-track" && f.budgetStatus !== "no-budget" && <AlertTriangle size={10} />} {meta.label}
                      </span>
                    )}
                  </div>
                  <div className="text-[11px]" style={{ color: "#8A8F84" }}>{job.projectNo} · {job.status}</div>
                </div>
                <div className="flex items-center gap-3">
                  <span className="mono text-sm font-bold">{fmtMoney(f.actualCost)}</span>

              {open && (
                <div className="px-3 pb-3">
                  {f.targetCost > 0 && (
                    <div className="w-full h-1.5 rounded-full overflow-hidden mb-2" style={{ background: COLORS.paper }}>
                      <div className="h-full rounded-full" style={{ width: `${Math.min(pct, 100)}%`, background: meta.color }} />
                    </div>
                  )}
                  <div className="grid grid-cols-4 gap-2 mb-3 text-[12px]">
                    <div><div className="text-[10px] uppercase" style={{ color: "#8A8F84" }}>Labor</div><div className="mono font-semibold">{fmtMoney(f.laborCost)}</div></div>
                    <div><div className="text-[10px] uppercase" style={{ color: "#8A8F84" }}>Vehicle</div><div className="mono font-semibold">{fmtMoney(f.vehicleCost)}</div></div>
                    <div><div className="text-[10px] uppercase" style={{ color: "#8A8F84" }}>Material</div><div className="mono font-semibold">{fmtMoney(f.materialCost)}</div></div>
                    <div><div className="text-[10px] uppercase" style={{ color: "#8A8F84" }}>Other</div><div className="mono font-semibold">{fmtMoney(f.otherCost)}</div></div>
                  </div>
                  {f.targetCost > 0 && (
                    <div className="grid grid-cols-3 gap-2 mb-3 text-[12px]">
                      <div><div className="text-[10px] uppercase" style={{ color: "#8A8F84" }}>Budget</div><div className="mono font-semibold">{fmtMoney(f.budget)}</div></div>
                      <div><div className="text-[10px] uppercase" style={{ color: "#8A8F84" }}>Target Cost</div><div className="mono font-semibold">{fmtMoney(f.targetCost)}</div></div>
                      <div><div className="text-[10px] uppercase" style={{ color: "#8A8F84" }}>Variance</div><div className="mono font-semibold" style={{ color: f.targetCost - f.actualCost < 0 ? COLORS.urgent : COLORS.go }}>{fmtMoney(f.targetCost - f.actualCost)}</div></div>
                    </div>
                  )}
                  {f.otherExpenseEntries.length > 0 && (
                    <div className="mb-3">
                      <div className="text-[10px] font-semibold uppercase tracking-wide mb-1" style={{ color: COLORS.steelLight }}>Other Expenses</div>
                      <div className="grid gap-1">
                        {f.otherExpenseEntries.map((e) => (
                          <div key={e.id} className="flex items-center justify-between text-[11px] py-1" style={{ borderBottom: `1px solid ${COLORS.paper}` }}>
                            <span><span className="mono opacity-60 mr-1.5">{e.ref}</span>{e.description} · {e.date}</span>
                            <span className="flex items-center gap-2">
                              <span className="mono font-semibold">{fmtMoney(e.amount)}</span>
                              <button onClick={() => onDeleteOtherExpense(e.id)} title="Remove"><X size={12} color={COLORS.urgent} /></button>
                            </span>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                  <div className="flex gap-2">
                    <button onClick={() => setBudgetJob(job)} className="text-[11px] font-semibold px-2.5 py-1.5 rounded-md flex items-center gap-1" style={{ background: COLORS.paperDark, color: COLORS.steel }}>
                      <Zap size={12} /> {f.targetCost > 0 ? "Edit Detailed Budget" : "Set Detailed Budget"}
                    </button>
                    <button onClick={() => setExpenseJob(job)} className="text-[11px] font-semibold px-2.5 py-1.5 rounded-md flex items-center gap-1" style={{ background: COLORS.paperDark, color: COLORS.steel }}>
                      <Receipt size={12} /> Add Other Expense
                    </button>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {budgetJob && (
        <BudgetBuilderModal job={budgetJob} categories={categories} vehicles={vehicles}
          onClose={() => setBudgetJob(null)}
          onSave={(patch) => { onUpdateJob(budgetJob.id, patch); setBudgetJob(null); }} />
      )}
      {expenseJob && (
        <OtherExpenseModal job={expenseJob} onClose={() => setExpenseJob(null)}
          onSubmit={(expense) => { onAddOtherExpense(expense); setExpenseJob(null); }} />
      )}
    </div>
  );
}

/* ---------------------------------------------------------------------
   ESTIMATION MANAGEMENT PANEL
--------------------------------------------------------------------- */
function EstimationsPanel({ jobOrders, workers, vehicles, categories, entries, cash, otherExpenses, onUpdateJob }) {
  const [search, setSearch] = useState("");
  const [statusFilter, setStatusFilter] = useState("all");
  const [editingJob, setEditingJob] = useState(null);
  const [expandedId, setExpandedId] = useState(null);

  const estimations = useMemo(() => {
    return jobOrders.map((job) => {
      const calc = computeBudgetBuildUp(job, categories);
      const f = computeJobFinancials(job, vehicles, entries, cash?.entries || [], otherExpenses?.entries || []);
      const assignedVeh = vehicles.find((v) => v.id === job.vehicleId);
      const hours = job.budgetHours || {};
      const totalEstHours = categories.reduce((sum, c) => sum + (Number(hours[c.code]) || 0), 0);
      const trips = Number(job.budgetVehicleTrips || job.trips) || 0;
      const distance = Number(job.budgetVehicleDistance || job.avgOneWayKm) || 0;
      const totalKms = trips * distance * 2;
      const hasEstimation = calc.budgetAmount > 0 || totalEstHours > 0 || trips > 0;

      return {
        job,
        calc,
        f,
        assignedVeh,
        hours,
        totalEstHours,
        trips,
        distance,
        totalKms,
        hasEstimation
      };
    });
  }, [jobOrders, categories, vehicles, entries, cash, otherExpenses]);

  const totals = useMemo(() => {
    let totalHours = 0;
    const catHours = { M: 0, T: 0, L: 0, E: 0 };
    let totalTrips = 0;
    let totalKms = 0;
    let totalVehicleCost = 0;
    let totalMaterials = 0;
    let totalConsumables = 0;
    let totalTargetCost = 0;
    let totalQuotedPrice = 0;
    let totalActualCost = 0;
    let estimatedJobsCount = 0;

    estimations.forEach((item) => {
      if (item.hasEstimation) {
        estimatedJobsCount++;
        totalHours += item.totalEstHours;
        categories.forEach((c) => {
          catHours[c.code] = (catHours[c.code] || 0) + (Number(item.hours[c.code]) || 0);
        });
        totalTrips += item.trips;
        totalKms += item.totalKms;
        totalVehicleCost += item.calc.vehicleCost;
        totalMaterials += item.calc.materials;
        totalConsumables += item.calc.consumables;
        totalTargetCost += item.calc.adjustedCost;
        totalQuotedPrice += item.calc.budgetAmount;
        totalActualCost += item.f.actualCost;
      }
    });

    const overallVariance = totalQuotedPrice - totalActualCost;
    const overallTargetVariance = totalTargetCost - totalActualCost;
    const avgMargin = totalQuotedPrice > 0 ? ((totalQuotedPrice - totalTargetCost) / totalQuotedPrice) * 100 : 0;

    return {
      totalHours,
      catHours,
      totalTrips,
      totalKms,
      totalVehicleCost,
      totalMaterials,
      totalConsumables,
      totalTargetCost,
      totalQuotedPrice,
      totalActualCost,
      overallVariance,
      overallTargetVariance,
      avgMargin,
      estimatedJobsCount
    };
  }, [estimations, categories]);

  const filteredEstimations = estimations.filter(({ job, f, hasEstimation }) => {
    const q = search.toLowerCase().trim();
    if (q) {
      const matchText = `${job.jobOrderNo} ${job.clientName} ${job.projectNo} ${job.scope} ${job.area} ${job.emirates}`.toLowerCase();
      if (!matchText.includes(q)) return false;
    }
    if (statusFilter === "overrun") return f.budgetStatus === "overrun";
    if (statusFilter === "on-track") return f.budgetStatus === "on-track" || f.budgetStatus === "nearing";
    if (statusFilter === "unestimated") return !hasEstimation;
    return true;
  });

  return (
    <div>
      {/* Top Summary Banner KPIs */}
      <div className="grid gap-3 mb-5" style={{ gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))" }}>
        <div className="rounded-lg p-3.5 flex flex-col justify-between" style={{ background: COLORS.steelDark, color: "#fff" }}>
          <div>
            <div className="text-[10px] uppercase tracking-widest text-white/50 flex items-center gap-1.5">
              <Clock size={12} color={COLORS.safety} /> Total Estimated Labor
            </div>
            <div className="disp text-2xl font-bold mt-1 text-white">{totals.totalHours.toLocaleString()} <span className="text-xs font-normal text-white/60">hrs</span></div>
          </div>
          <div className="mt-2 pt-2 border-t border-white/10 flex flex-wrap gap-1.5 text-[10px]">
            {categories.map((c) => (
              <span key={c.code} className="px-1.5 py-0.5 rounded bg-white/10 font-mono">
                {c.code}: {totals.catHours[c.code] || 0}h
              </span>
            ))}
          </div>
        </div>

        <div className="rounded-lg p-3.5 flex flex-col justify-between" style={{ background: COLORS.steelDark, color: "#fff" }}>
          <div>
            <div className="text-[10px] uppercase tracking-widest text-white/50 flex items-center gap-1.5">
              <Truck size={12} color={COLORS.safety} /> Fleet &amp; Distance
            </div>
            <div className="disp text-2xl font-bold mt-1 text-white">
              {totals.totalTrips} <span className="text-xs font-normal text-white/60">trips</span> · {totals.totalKms.toLocaleString()} <span className="text-xs font-normal text-white/60">kms</span>
            </div>
          </div>
          <div className="mt-2 pt-2 border-t border-white/10 text-[11px] flex justify-between">
            <span className="text-white/60">Est Travel Cost:</span>
            <span className="font-mono font-bold text-white">{fmtMoney(totals.totalVehicleCost)}</span>
          </div>
        </div>

        <div className="rounded-lg p-3.5 flex flex-col justify-between" style={{ background: COLORS.steelDark, color: "#fff" }}>
          <div>
            <div className="text-[10px] uppercase tracking-widest text-white/50 flex items-center gap-1.5">
              <ShieldAlert size={12} color={COLORS.safety} /> Target Cost Ceiling
            </div>
            <div className="disp text-2xl font-bold mt-1 text-white">{fmtMoney(totals.totalTargetCost)}</div>
          </div>
          <div className="mt-2 pt-2 border-t border-white/10 text-[11px] flex justify-between">
            <span className="text-white/60">Quoted Price:</span>
            <span className="font-mono font-bold text-white">{fmtMoney(totals.totalQuotedPrice)}</span>
          </div>
        </div>

        <div className="rounded-lg p-3.5 flex flex-col justify-between" style={{ background: "#fff", border: `1.5px solid ${COLORS.line}` }}>
          <div>
            <div className="text-[10px] uppercase tracking-widest flex items-center gap-1.5" style={{ color: COLORS.steelLight }}>
              <TrendingUp size={12} color={COLORS.steel} /> Live Spend vs Ceiling
            </div>
            <div className="disp text-2xl font-bold mt-1" style={{ color: COLORS.steelDark }}>{fmtMoney(totals.totalActualCost)}</div>
          </div>
          <div className="mt-2 pt-2 border-t border-gray-200 text-[11px] flex justify-between items-center">
            <span style={{ color: COLORS.steelLight }}>Variance:</span>
            <span className={`font-mono font-bold ${totals.overallTargetVariance >= 0 ? "text-emerald-600" : "text-rose-600"}`}>
              {totals.overallTargetVariance >= 0 ? "+" : ""}{fmtMoney(totals.overallTargetVariance)}
            </span>
          </div>
        </div>
      </div>

      {/* Toolbar & Filters */}
      <div className="flex flex-wrap items-center justify-between gap-3 mb-4 p-3 rounded-lg" style={{ background: "#fff", border: `1.5px solid ${COLORS.line}` }}>
        <div className="flex items-center gap-2 flex-1 min-w-[240px]">
          <div className="relative flex-1">
            <Search size={14} className="absolute left-2.5 top-1/2 -translate-y-1/2" style={{ color: COLORS.steelLight }} />
            <input
              type="text"
              placeholder="Search estimations (Job #, client, scope...)..."
              value={search}
              onChange={(e) => setSearch(e.target.value)}
              className="w-full pl-8 pr-3 py-1.5 text-xs rounded border outline-none"
              style={{ borderColor: COLORS.line, background: COLORS.paper }}
            />
          </div>
          <select
            value={statusFilter}
            onChange={(e) => setStatusFilter(e.target.value)}
            className="text-xs px-2.5 py-1.5 rounded border outline-none font-semibold"
            style={{ borderColor: COLORS.line, background: COLORS.paper, color: COLORS.steel }}
          >
            <option value="all">All Jobs ({estimations.length})</option>
            <option value="on-track">On Track / Nearing</option>
            <option value="overrun">Cost Overrun Alert</option>
            <option value="unestimated">Unestimated Jobs</option>
          </select>
        </div>

        <div className="flex items-center gap-2">
          <button
            onClick={() => exportEstimationsReport(jobOrders, categories, vehicles, entries, cash.entries || cash || [], otherExpenses.entries || otherExpenses || [])}
            className="px-3 py-1.5 rounded text-xs font-bold flex items-center gap-1.5 tracking-wide uppercase transition-colors"
            style={{ background: COLORS.steel, color: "#fff" }}
          >
            <FileSpreadsheet size={14} /> Export Excel
          </button>
        </div>
      </div>

      {/* Estimations Table */}
      <div className="rounded-lg overflow-hidden border border-gray-200 shadow-sm" style={{ background: "#fff" }}>
        <div className="overflow-x-auto">
          <table className="w-full text-left text-xs border-collapse">
            <thead>
              <tr style={{ background: COLORS.steelDark, color: "#fff" }} className="text-[10px] uppercase tracking-wider font-semibold">
                <th className="p-3">Job &amp; Client</th>
                <th className="p-3">Est. Labor Hours</th>
                <th className="p-3">Vehicle &amp; Distance</th>
                <th className="p-3">Materials / Consumables</th>
                <th className="p-3 text-right">Target Cost Ceiling</th>
                <th className="p-3 text-right">Quoted Budget</th>
                <th className="p-3 text-right">Live Actual Cost</th>
                <th className="p-3 text-center">Variance / Status</th>
                <th className="p-3 text-center">Action</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-gray-200">
              {filteredEstimations.length === 0 && (
                <tr>
                  <td colSpan={9} className="p-6 text-center text-gray-500 italic">
                    No matching job estimations found.
                  </td>
                </tr>
              )}
              {filteredEstimations.map(({ job, calc, f, assignedVeh, hours, totalEstHours, trips, distance, totalKms, hasEstimation }) => {
                const open = expandedId === job.id;
                const statusMeta = BUDGET_STATUS_META[f.budgetStatus || "on-track"];
                const isOver = f.actualCost > (calc.adjustedCost || f.targetCost) && (calc.adjustedCost || f.targetCost) > 0;

                return (
                  <React.Fragment key={job.id}>
                    <tr
                      className="hover:bg-slate-50 transition-colors cursor-pointer"
                      onClick={() => setExpandedId(open ? null : job.id)}
                    >
                      <td className="p-3 font-medium">
                        <div className="flex items-center gap-1.5">
                          <ChevronRight size={14} style={{ transform: open ? "rotate(90deg)" : "none", transition: "transform 0.15s", color: COLORS.steelLight }} />
                          <span className="disp font-bold text-sm" style={{ color: COLORS.steelDark }}>#{job.jobOrderNo}</span>
                          {job.estimationRevision > 1 && (
                            <span className="px-1.5 py-0.5 rounded text-[9px] font-bold bg-amber-100 text-amber-800 border border-amber-300">
                              Rev #{job.estimationRevision}
                            </span>
                          )}
                        </div>
                        <div className="text-gray-900 font-semibold mt-0.5 flex items-center gap-1.5 flex-wrap">
                          <span>{job.clientName || "Unknown Client"}</span>
                          <span className="px-1.5 py-0.5 rounded text-[9.5px] font-semibold bg-slate-100 text-slate-700 border border-slate-200 flex items-center gap-1">
                            <Calendar size={10} /> {job.estimatedDays || 1} Day{Number(job.estimatedDays) > 1 ? "s" : ""} Work
                          </span>
                        </div>
                        <div className="text-[10px] text-gray-500">{job.emirates || "Dubai"} · {job.projectNo || "No Proj Ref"}</div>
                      </td>

                      <td className="p-3">
                        <div className="font-mono font-bold text-sm text-gray-900">{totalEstHours} <span className="text-[10px] font-normal text-gray-500">hrs</span></div>
                        <div className="flex flex-wrap gap-1 mt-1">
                          {categories.map((c) => {
                            const val = Number(hours[c.code]) || 0;
                            if (!val) return null;
                            return (
                              <span key={c.code} className="text-[9px] px-1 py-0.5 rounded font-mono bg-slate-100 text-slate-700 border border-slate-200">
                                {c.code}:{val}h
                              </span>
                            );
                          })}
                        </div>
                        <div className="text-[10px] text-gray-500 mt-1">Cost: {fmtMoney(calc.laborCost)}</div>
                      </td>

                      <td className="p-3">
                        <div className="font-semibold text-gray-800">{assignedVeh ? assignedVeh.name : "No Vehicle"}</div>
                        <div className="text-[11px] text-gray-600 mt-0.5">
                          <span className="font-mono font-bold">{trips}</span> trips × <span className="font-mono">{distance}</span> km ({totalKms} total km)
                        </div>
                        <div className="text-[10px] text-gray-500 mt-0.5">Travel Cost: {fmtMoney(calc.vehicleCost)}</div>
                      </td>

                      <td className="p-3">
                        <div className="text-[11px] text-gray-700">Mat: <span className="font-mono font-semibold">{fmtMoney(calc.materials)}</span></div>
                        <div className="text-[11px] text-gray-700">Cons: <span className="font-mono font-semibold">{fmtMoney(calc.consumables)}</span></div>
                        {calc.adjustment !== 0 && (
                          <div className="text-[10px] text-amber-700">Adj: {calc.adjustment > 0 ? "+" : ""}{fmtMoney(calc.adjustment)}</div>
                        )}
                      </td>

                      <td className="p-3 text-right font-mono font-bold text-gray-900 text-sm">
                        {fmtMoney(calc.adjustedCost)}
                      </td>

                      <td className="p-3 text-right font-mono font-bold text-sm" style={{ color: COLORS.steel }}>
                        {fmtMoney(calc.budgetAmount)}
                        {calc.marginPercent > 0 && (
                          <div className="text-[10px] font-normal text-emerald-600">{calc.marginPercent}% margin</div>
                        )}
                      </td>

                      <td className="p-3 text-right font-mono font-bold text-sm" style={{ color: isOver ? COLORS.urgent : COLORS.ink }}>
                        {fmtMoney(f.actualCost)}
                      </td>

                      <td className="p-3 text-center">
                        {!hasEstimation ? (
                          <span className="inline-block px-2 py-0.5 text-[10px] font-semibold rounded bg-gray-100 text-gray-600 border border-gray-200">
                            UNESTIMATED
                          </span>
                        ) : (
                          <span className={`inline-block px-2.5 py-1 text-[10px] font-bold rounded-full uppercase tracking-wide border`} style={{ color: statusMeta.color, background: `${statusMeta.color}15`, borderColor: `${statusMeta.color}30` }}>
                            {statusMeta.label}
                          </span>
                        )}
                      </td>

                      <td className="p-3 text-center" onClick={(e) => e.stopPropagation()}>
                        <div className="flex items-center justify-center gap-1">
                          <button
                            onClick={() => setEditingJob(job)}
                            className="px-2 py-1 rounded text-[10px] font-bold tracking-wide disp transition-colors border"
                            style={{ background: COLORS.paperDark, color: COLORS.steel, borderColor: COLORS.line }}
                          >
                            EDIT
                          </button>
                          <button
                            onClick={() => setEditingJob(job)}
                            className="px-2.5 py-1 rounded text-[10px] font-bold tracking-wide disp transition-colors border flex items-center gap-1"
                            style={{ background: COLORS.safety, color: COLORS.steelDark, borderColor: `${COLORS.steelDark}30` }}
                          >
                            <Zap size={11} /> RE-ESTIMATE
                          </button>
                        </div>
                      </td>
                    </tr>

                    {open && (
                      <tr className="bg-slate-50/70 border-b border-gray-200">
                        <td colSpan={9} className="p-4">
                          <div className="rounded-lg p-4 bg-white border border-gray-200 shadow-inner">
                            <div className="text-xs font-bold uppercase tracking-wider mb-2" style={{ color: COLORS.steelDark }}>
                              DETAILED ESTIMATION &amp; LIVE WORK BREAKDOWN — JOB #{job.jobOrderNo}
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs">
                              <div className="p-3 rounded bg-slate-50 border border-slate-200">
                                <div className="font-semibold text-slate-700 mb-2 border-b pb-1">Labor Hours &amp; Cost Breakdown</div>
                                {categories.map((c) => {
                                  const estH = Number(hours[c.code]) || 0;
                                  const estDays = estH / 8;
                                  const cost = estDays * c.rate;
                                  return (
                                    <div key={c.code} className="flex justify-between py-1 border-b border-slate-100 text-[11px]">
                                      <span>{c.label} ({c.code}) @ AED {c.rate}/day:</span>
                                      <span className="font-mono font-semibold">{estH}h ({estDays.toFixed(1)}d) = AED {cost.toFixed(0)}</span>
                                    </div>
                                  );
                                })}
                                <div className="flex justify-between pt-1.5 font-bold text-slate-800 text-[11px]">
                                  <span>Total Estimated Labor:</span>
                                  <span className="font-mono">{totalEstHours} hrs ({fmtMoney(calc.laborCost)})</span>
                                </div>
                              </div>

                              <div className="p-3 rounded bg-slate-50 border border-slate-200">
                                <div className="font-semibold text-slate-700 mb-2 border-b pb-1">Vehicle Travel &amp; Distance</div>
                                <div className="space-y-1 text-[11px]">
                                  <div className="flex justify-between"><span>Assigned Fleet:</span><span className="font-medium">{assignedVeh ? assignedVeh.name : "Unassigned"}</span></div>
                                  <div className="flex justify-between"><span>Expected Trips:</span><span className="font-mono font-semibold">{trips}</span></div>
                                  <div className="flex justify-between"><span>One-Way Distance:</span><span className="font-mono font-semibold">{distance} km</span></div>
                                  <div className="flex justify-between"><span>Round-Trip Total Distance:</span><span className="font-mono font-semibold">{totalKms} kms</span></div>
                                  <div className="flex justify-between"><span>Rate per Km:</span><span className="font-mono font-semibold">AED {calc.vehicleRate || assignedVeh?.ratePerKm || 0}/km</span></div>
                                  <div className="flex justify-between pt-1.5 font-bold text-slate-800 border-t">
                                    <span>Total Travel Estimated Cost:</span>
                                    <span className="font-mono">{fmtMoney(calc.vehicleCost)}</span>
                                  </div>
                                </div>
                              </div>

                              <div className="p-3 rounded bg-slate-50 border border-slate-200">
                                <div className="font-semibold text-slate-700 mb-2 border-b pb-1">Cost Ceiling &amp; Budget Quote</div>
                                <div className="space-y-1 text-[11px]">
                                  <div className="flex justify-between"><span>Materials Estimated:</span><span className="font-mono">{fmtMoney(calc.materials)}</span></div>
                                  <div className="flex justify-between"><span>Consumables Estimated:</span><span className="font-mono">{fmtMoney(calc.consumables)}</span></div>
                                  <div className="flex justify-between"><span>Adjustments:</span><span className="font-mono">{calc.adjustment >= 0 ? "+" : ""}{fmtMoney(calc.adjustment)}</span></div>
                                  <div className="flex justify-between font-semibold border-t pt-1"><span>Target Cost Ceiling:</span><span className="font-mono">{fmtMoney(calc.adjustedCost)}</span></div>
                                  <div className="flex justify-between text-emerald-700 font-semibold"><span>Target Margin ({calc.marginPercent}%):</span><span className="font-mono">{fmtMoney(calc.marginAmount)}</span></div>
                                  <div className="flex justify-between font-bold text-sm text-slate-900 border-t pt-1.5"><span>Final Quoted Price:</span><span className="font-mono">{fmtMoney(calc.budgetAmount)}</span></div>
                                </div>
                              </div>
                            </div>

                            {job.estimationHistory && job.estimationHistory.length > 0 && (
                              <div className="mt-3 pt-3 border-t border-gray-200">
                                <div className="text-xs font-bold uppercase tracking-wider mb-2 flex items-center gap-1.5" style={{ color: COLORS.steelDark }}>
                                  <Clock size={12} color={COLORS.steel} /> RE-ESTIMATION REVISION HISTORY ({job.estimationHistory.length} revisions)
                                </div>
                                <div className="grid gap-1.5">
                                  {job.estimationHistory.map((h, idx) => (
                                    <div key={idx} className="p-2 rounded bg-slate-50 border border-slate-200 flex items-center justify-between text-[11px]">
                                      <div>
                                        <span className="font-bold text-slate-800">Rev #{h.revision}</span> ({h.date}) — <span className="font-semibold text-slate-700">{h.reason}</span>
                                      </div>
                                      <div className="font-mono text-slate-700">
                                        Target Cost: <span className="line-through text-slate-400">{fmtMoney(h.previousCostCeiling)}</span> &rarr; <span className="font-bold">{fmtMoney(h.newCostCeiling)}</span> | 
                                        Quote: <span className="line-through text-slate-400">{fmtMoney(h.previousQuote)}</span> &rarr; <span className="font-bold text-emerald-700">{fmtMoney(h.newQuote)}</span>
                                      </div>
                                    </div>
                                  ))}
                                </div>
                              </div>
                            )}
                          </div>
                        </td>
                      </tr>
                    )}
                  </React.Fragment>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      {editingJob && (
        <BudgetBuilderModal
          job={editingJob}
          categories={categories}
          vehicles={vehicles}
          onClose={() => setEditingJob(null)}
          onSave={(updatedBudget) => {
            onUpdateJob(editingJob.id, {
              ...updatedBudget,
              avgOneWayKm: updatedBudget.budgetVehicleDistance || editingJob.avgOneWayKm,
              trips: updatedBudget.budgetVehicleTrips || editingJob.trips,
            });
            setEditingJob(null);
          }}
        />
      )}
    </div>
  );
}

/* ---------------------------------------------------------------------

function FleetPanel({ vehicles, jobOrders, workers, onAddVehicle, onUpdateVehicle }) {
  const [search, setSearch] = useState("");
  const [statusFilter, setStatusFilter] = useState("all");
  const [showAddModal, setShowAddModal] = useState(false);
  const [editingVeh, setEditingVeh] = useState(null);
  const [expandedVehId, setExpandedVehId] = useState(null);

  const [newVehName, setNewVehName] = useState("");
  const [newVehRate, setNewVehRate] = useState("2.5");

  const [editVehName, setEditVehName] = useState("");
  const [editVehRate, setEditVehRate] = useState("");
  const [editVehStatus, setEditVehStatus] = useState("");

  const fleetMetrics = useMemo(() => {
    let availableCount = 0;
    let inUseCount = 0;
    let scheduledCount = 0;
    let maintenanceCount = 0;
    let totalTrips = 0;
    let totalKms = 0;
    let totalFleetCost = 0;

    const items = vehicles.map((v) => {
      const assignedJobs = jobOrders.filter((j) => j.vehicleId === v.id);
      const activeJob = assignedJobs.find((j) => j.status !== "Completed");
      const status = computeVehicleStatus(v, jobOrders);

      if (status === "Available") availableCount++;
      else if (status === "In Use") inUseCount++;
      else if (status === "Scheduled") scheduledCount++;
      else if (status === "Maintenance" || status === "Out of Service") maintenanceCount++;

      let vehTrips = 0;
      let vehKms = 0;
      let vehCost = 0;

      assignedJobs.forEach((j) => {
        const trips = Number(j.trips || j.budgetVehicleTrips) || 0;
        const dist = Number(j.avgOneWayKm || j.budgetVehicleDistance) || 0;
        const roundKms = trips * dist * 2;
        const cost = roundKms * (v.ratePerKm || 0);

        vehTrips += trips;
        vehKms += roundKms;
        vehCost += cost;
      });

      totalTrips += vehTrips;
      totalKms += vehKms;
      totalFleetCost += vehCost;

      const activeCrew = activeJob ? workers.filter((w) => activeJob.workerIds.includes(w.id)) : [];

      return {
        vehicle: v,
        status,
        assignedJobs,
        activeJob,
        activeCrew,
        vehTrips,
        vehKms,
        vehCost
      };
    });

    return {
      items,
      totalCount: vehicles.length,
      availableCount,
      inUseCount,
      scheduledCount,
      maintenanceCount,
      totalTrips,
      totalKms,
      totalFleetCost
    };
  }, [vehicles, jobOrders, workers]);

  const filteredVehicles = fleetMetrics.items.filter(({ vehicle, status }) => {
    const q = search.toLowerCase().trim();
    if (q) {
      if (!vehicle.name.toLowerCase().includes(q)) return false;
    }
    if (statusFilter === "available") return status === "Available";
    if (statusFilter === "in-use") return status === "In Use" || status === "Scheduled";
    if (statusFilter === "maintenance") return status === "Maintenance" || status === "Out of Service";
    return true;
  });

  const submitAddVehicle = () => {
    if (!newVehName.trim()) return;
    onAddVehicle({
      id: genId("v"),
      name: newVehName.trim(),
      ratePerKm: Number(newVehRate) || 2.5,
      active: true,
      status: "Available"
    });
    setNewVehName("");
    setNewVehRate("2.5");
    setShowAddModal(false);
  };

  const startEditing = (v) => {
    setEditingVeh(v);
    setEditVehName(v.name || "");
    setEditVehRate(String(v.ratePerKm || 2.5));
    setEditVehStatus(v.status || "Available");
  };

  const saveEditing = () => {
    if (!editingVeh) return;
    onUpdateVehicle(editingVeh.id, {
      name: editVehName.trim(),
      ratePerKm: Number(editVehRate) || 0,
      status: editVehStatus
    });
    setEditingVeh(null);

  return (
    <div>
      {/* Fleet KPI Banner */}

        <div className="rounded-lg p-3.5 flex flex-col justify-between" style={{ background: COLORS.steelDark, color: "#fff" }}>
          <div>
            <div className="text-[10px] uppercase tracking-widest text-white/50 flex items-center gap-1.5">
              <Truck size={12} color={COLORS.safety} /> Total Registered Fleet
            </div>
            <div className="disp text-2xl font-bold mt-1 text-white">{fleetMetrics.totalCount} <span className="text-xs font-normal text-white/60">vehicles</span></div>
          </div>
          <div className="mt-2 pt-2 border-t border-white/10 text-[11px] text-white/70">
            {fleetMetrics.availableCount} Ready · {fleetMetrics.inUseCount + fleetMetrics.scheduledCount} Assigned
          </div>
        </div>

        <div className="rounded-lg p-3.5 flex flex-col justify-between" style={{ background: "#fff", border: `1.5px solid ${COLORS.go}` }}>

              <Field label="Rate per Km (AED/km)">
                <input

                  value={editVehRate}
                  onChange={(e) => setEditVehRate(e.target.value)}

              <div className="flex gap-2 pt-3">
                <button onClick={() => setEditingVeh(null)} className="flex-1 py-2 rounded-md text-sm font-semibold" style={{ background: COLORS.paperDark, color: COLORS.steel }}>Cancel</button>
                <button onClick={saveEditing} className="flex-1 py-2 rounded-md text-sm font-bold disp tracking-wide" style={{ background: COLORS.safety, color: COLORS.steelDark }}>

              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

                  defaultValue={w.name}
                  onBlur={(e) => { const v = e.target.value.trim(); if (v && v !== w.name) onUpdateWorker(w.id, { name: v }); }}
                  className="flex-1 min-w-0 rounded px-1.5 py-0.5 text-sm"
                  style={{ border: `1.5px solid transparent`, background: "transparent" }}
                  onFocus={(e) => { e.target.style.border = `1.5px solid ${COLORS.line}`; e.target.style.background = "#fff"; }}
                />
                <span className="text-[11px] whitespace-nowrap" style={{ color: "#8A8F84" }}>{catLabel(categories, w.category)}</span>
                <span className="mono text-[12px] font-semibold whitespace-nowrap">{fmtMoney(w.rate)}/day</span>
                <button
                  onClick={() => onUpdateWorker(w.id, { active: !isActive })}
                  className="text-[10px] font-semibold px-2 py-0.5 rounded-full whitespace-nowrap"
                  style={{ background: isActive ? "#E4F1E9" : "#F3E3E3", color: isActive ? COLORS.go : COLORS.urgent }}
                >
                  {isActive ? "Active" : "Inactive"}
                </button>
                <input
                  defaultValue={w.pin || ""}
                  placeholder="PIN"
                  maxLength={6}
                  onBlur={(e) => { const v = e.target.value.trim(); if (v !== (w.pin || "")) onUpdateWorker(w.id, { pin: v }); }}
                  className="mono text-center text-[12px] rounded px-1.5 py-0.5"
                  style={{ width: 56, border: `1.5px solid ${COLORS.line}`, color: COLORS.steel }}
                />
              </div>
            );
          })}
        </div>

        {/* worker types (categories) management */}
        <div className="mb-3 p-2.5 rounded-md" style={{ background: COLORS.paper }}>
          <div className="flex items-center justify-between mb-1.5">
            <span className="text-[11px] font-semibold uppercase tracking-wide" style={{ color: COLORS.steelLight }}>Worker Types</span>
            <button onClick={() => setShowNewCat((s) => !s)} className="text-[11px] font-semibold flex items-center gap-0.5" style={{ color: COLORS.steel }}>
              <Plus size={12} /> {showNewCat ? "Cancel" : "New type"}
            </button>
          </div>
          <div className="flex flex-wrap gap-1.5 mb-2">
            {categories.map((c) => (
              <span key={c.code} className="text-[11px] px-2 py-0.5 rounded-full" style={{ background: "#E7ECEF", color: COLORS.steel }}>
                {c.label} <span className="mono opacity-60">{c.code}</span> · {fmtMoney(c.rate)}
              </span>
            ))}
          </div>
          {showNewCat && (
            <div className="flex gap-1.5 flex-wrap">
              <input placeholder="Type name (e.g. Driver)" value={ncLabel} onChange={(e) => setNcLabel(e.target.value)} className={inputCls} style={{ ...inputStyle, padding: "6px 8px", flex: "1 1 120px" }} />
              <input placeholder="Code" value={ncCode} onChange={(e) => setNcCode(e.target.value)} maxLength={3} className={inputCls} style={{ ...inputStyle, padding: "6px 8px", width: 60 }} />
              <input placeholder="Daily rate" value={ncRate} onChange={(e) => setNcRate(e.target.value)} className={inputCls} style={{ ...inputStyle, padding: "6px 8px", width: 80 }} />
              <button onClick={submitCategory} className="px-3 rounded-md" style={{ background: COLORS.steel, color: "#fff" }}><Plus size={15} /></button>
            </div>
          )}
        </div>

        <div className="flex gap-1.5 flex-wrap">
          <input placeholder="Name" value={wName} onChange={(e) => setWName(e.target.value)} className={inputCls} style={{ ...inputStyle, padding: "6px 8px", flex: "1 1 100px" }} />
          <select value={wCat} onChange={(e) => { setWCat(e.target.value); const c = categories.find((x) => x.code === e.target.value); if (c && !wRate) setWRate(String(c.rate)); }}
            className={inputCls} style={{ ...inputStyle, padding: "6px 8px", width: 110 }}>
            {categories.map((c) => <option key={c.code} value={c.code}>{c.label}</option>)}
          </select>
          <input placeholder="Rate" value={wRate} onChange={(e) => setWRate(e.target.value)} className={inputCls} style={{ ...inputStyle, padding: "6px 8px", width: 70 }} />
          <input placeholder="PIN" value={wPin} onChange={(e) => setWPin(e.target.value)} className={inputCls} style={{ ...inputStyle, padding: "6px 8px", width: 60 }} />
          <button onClick={() => { if (!wName || !wRate || !wCat) return; onAddWorker({ id: genId("w"), name: wName, category: wCat, rate: Number(wRate), pin: wPin || String(Math.floor(1000 + Math.random() * 9000)), availability: null, active: true }); setWName(""); setWRate(""); setWPin(""); }}
            className="px-3 rounded-md" style={{ background: COLORS.steel, color: "#fff" }}><Plus size={15} /></button>
        </div>
      </div>

      <div className="rounded-lg p-4" style={{ background: "#fff", border: `1.5px solid ${COLORS.line}` }}>
        <div className="disp font-bold text-base mb-3 flex items-center justify-between gap-2">
          <span className="flex items-center gap-2"><Truck size={16} /> VEHICLE ROSTER</span>
          <span className="text-[10px] font-normal normal-case" style={{ color: "#8A8F84" }}>Priced per km, used with a job's avg one-way km</span>
        </div>
        <div className="max-h-56 overflow-y-auto mb-3">
          {vehicles.map((v) => {
            const computed = computeVehicleStatus(v, jobOrders);
            const isOverride = v.status && VEHICLE_OVERRIDES.includes(v.status);
            const isActive = v.active !== false;
            return (
              <div key={v.id} className="flex items-center justify-between gap-2 py-1.5 text-sm flex-wrap" style={{ borderBottom: `1px solid ${COLORS.paper}`, opacity: isActive ? 1 : 0.55 }}>
                <span className="flex items-center gap-1.5 flex-1 min-w-[90px]">
                  <span className="w-1.5 h-1.5 rounded-full flex-shrink-0" style={{ background: vehicleStatusMeta(computed).color }} />
                  <input
                    defaultValue={v.name}
                    onBlur={(e) => { const val = e.target.value.trim(); if (val && val !== v.name) onUpdateVehicle(v.id, { name: val }); }}
                    className="flex-1 min-w-0 rounded px-1 py-0.5 text-sm"
                    style={{ border: `1.5px solid transparent`, background: "transparent" }}
                    onFocus={(e) => { e.target.style.border = `1.5px solid ${COLORS.line}`; e.target.style.background = "#fff"; }}
                  />
                  <span className="text-[10px]" style={{ color: "#8A8F84" }}>{computed}</span>
                </span>
                <button
                  onClick={() => onUpdateVehicle(v.id, { active: !isActive })}
                  className="text-[10px] font-semibold px-2 py-0.5 rounded-full whitespace-nowrap"
                  style={{ background: isActive ? "#E4F1E9" : "#F3E3E3", color: isActive ? COLORS.go : COLORS.urgent }}
                >
                  {isActive ? "Active" : "Inactive"}
                </button>
                <select
                  value={isOverride ? v.status : ""}
                  onChange={(e) => onUpdateVehicle(v.id, { status: e.target.value || null })}
                  className="text-[11px] rounded px-1 py-0.5"
                  style={{ border: `1.5px solid ${COLORS.line}`, color: COLORS.steel, width: 118 }}
                >
                  <option value="">Auto (from jobs)</option>
                  {VEHICLE_OVERRIDES.map((s) => <option key={s} value={s}>{s}</option>)}
                </select>
                <span className="flex items-center gap-1 text-[12px]">
                  <input
                    defaultValue={v.ratePerKm}
                    onBlur={(e) => { const n = Number(e.target.value); if (!isNaN(n) && n !== v.ratePerKm) onUpdateVehicle(v.id, { ratePerKm: n }); }}
                    className="mono text-right rounded px-1.5 py-0.5"
                    style={{ width: 56, border: `1.5px solid ${COLORS.line}`, color: COLORS.steel }}
                  />
                  <span className="mono" style={{ color: "#8A8F84" }}>/km</span>
                </span>
              </div>
            );
          })}
        </div>
        <div className="flex gap-1.5">
          <input placeholder="Vehicle name / plate" value={vName} onChange={(e) => setVName(e.target.value)} className={inputCls} style={{ ...inputStyle, padding: "6px 8px" }} />
          <input placeholder="Rate/km" value={vRate} onChange={(e) => setVRate(e.target.value)} className={inputCls} style={{ ...inputStyle, padding: "6px 8px", width: 80 }} />
          <button onClick={() => { if (!vName) return; onAddVehicle({ id: genId("v"), name: vName, ratePerKm: Number(vRate) || 0, status: null, active: true }); setVName(""); }}
            className="px-3 rounded-md" style={{ background: COLORS.steel, color: "#fff" }}><Plus size={15} /></button>
        </div>
      </div>
      </div>
    </div>
  );
}
