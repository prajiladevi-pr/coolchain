              <span className="disp font-bold" style={{ color: COLORS.steel }}>QUOTE / BUDGET</span>
              <span className="disp text-xl font-bold" style={{ color: COLORS.steel }}>{fmtMoney(calc.budgetAmount)}</span>
            </div>
          </div>

          <div className="flex gap-2 mt-4">
            <button onClick={onClose} className="flex-1 py-2 rounded-md text-sm font-semibold" style={{ background: COLORS.paperDark, color: COLORS.steel }}>Cancel</button>
            <button onClick={save} className="flex-1 py-2 rounded-md text-sm font-bold disp tracking-wide" style={{ background: COLORS.safety, color: COLORS.steelDark }}>
              SAVE BUDGET
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------
   JOB COSTING — dashboard + detailed per-job cost breakdown
--------------------------------------------------------------------- */
// Thin horizontal cost gauge for each job card. The full bar represents the
// quoted Budget; a marker shows where the Target Cost sits (the cost/margin
// boundary), and a dark fill shows how far actual spend has moved along it.
// The track itself is banded into 4 quarters, green → red, as a simple
// at-a-glance "how deep into the budget are we" risk gradient.
function CostProgressBar({ actualCost, targetCost, budgetAmount }) {
  if (!budgetAmount || budgetAmount <= 0) {
    return <div className="text-[10px] italic mt-1" style={{ color: "#8A8F84" }}>No budget set</div>;
  }
  const targetPct = Math.min((targetCost / budgetAmount) * 100, 100);
  const actualPct = Math.min((actualCost / budgetAmount) * 100, 100);
  const isOver = actualCost > budgetAmount;
  const overAmount = actualCost - budgetAmount;

  return (
    <div className="mt-1.5" onClick={(e) => e.stopPropagation()}>
      <div className="relative w-full rounded-full overflow-hidden" style={{ height: 7, background: COLORS.paper }}>
        <div className="absolute inset-0 flex">
          <div style={{ width: "25%", background: `${COLORS.go}30` }} />
          <div style={{ width: "25%", background: `${COLORS.go}66` }} />
          <div style={{ width: "25%", background: `${COLORS.amber}66` }} />
          <div style={{ width: "25%", background: `${COLORS.urgent}66` }} />
        </div>
        <div className="absolute inset-y-0 left-0 rounded-full" style={{ width: `${actualPct}%`, background: COLORS.steelDark, opacity: 0.88, transition: "width 0.3s ease" }} />
        <div className="absolute inset-y-0" style={{ left: `calc(${targetPct}% - 1px)`, width: 2, background: "#fff", boxShadow: `0 0 0 1px ${COLORS.steel}` }} title="Target cost / margin boundary" />
      </div>
      <div className="flex justify-between text-[9.5px] mono mt-0.5" style={{ color: "#8A8F84" }}>
        <span>Spent {fmtMoney(actualCost)}</span>
        <span>Target {fmtMoney(targetCost)}</span>
        {isOver
          ? <span style={{ color: COLORS.urgent, fontWeight: 600 }}>+{fmtMoney(overAmount)} over</span>
          : <span>Budget {fmtMoney(budgetAmount)}</span>}
      </div>
    </div>
  );
}

function JobCostingPanel({ jobOrders, workers, vehicles, categories, entries, cash, otherExpenses, onUpdateJob, onAddOtherExpense, onDeleteOtherExpense }) {
  const [budgetJob, setBudgetJob] = useState(null);
  const [expenseJob, setExpenseJob] = useState(null);
  const [expandedId, setExpandedId] = useState(null);

  const rows = useMemo(() => jobOrders.map((j) => ({
    job: j, f: computeJobFinancials(j, vehicles, entries, cash.entries, otherExpenses.entries),
  })).sort((a, b) => {
    // surface the most at-risk jobs first
    const order = { "overrun": 0, "nearing": 1, "on-track": 2, "no-budget": 3 };
    return order[a.f.budgetStatus] - order[b.f.budgetStatus] || b.job.createdAt - a.job.createdAt;
  }), [jobOrders, vehicles, entries, cash, otherExpenses]);

  const withBudget = rows.filter((r) => r.f.targetCost > 0);
  const totalBudget = withBudget.reduce((s, r) => s + r.f.budget, 0);
  const totalTarget = withBudget.reduce((s, r) => s + r.f.targetCost, 0);
  const totalActual = rows.reduce((s, r) => s + r.f.actualCost, 0);
  const overrunJobs = withBudget.filter((r) => r.f.budgetStatus === "overrun");
  const nearingJobs = withBudget.filter((r) => r.f.budgetStatus === "nearing");
  const onTrackJobs = withBudget.filter((r) => r.f.budgetStatus === "on-track");

  return (
    <div>
      {/* --- dashboard summary --- */}
      <div className="grid gap-3 mb-5" style={{ gridTemplateColumns: "repeat(auto-fit, minmax(160px, 1fr))" }}>
        <div className="rounded-lg p-3" style={{ background: COLORS.steelDark }}>
          <div className="text-[10px] uppercase tracking-widest text-white/50">Total Budget</div>
          <div className="disp text-xl font-bold text-white">{fmtMoney(totalBudget)}</div>
        </div>
        <div className="rounded-lg p-3" style={{ background: COLORS.steelDark }}>
          <div className="text-[10px] uppercase tracking-widest text-white/50">Total Target Cost</div>
          <div className="disp text-xl font-bold text-white">{fmtMoney(totalTarget)}</div>
        </div>
        <div className="rounded-lg p-3" style={{ background: COLORS.steelDark }}>
          <div className="text-[10px] uppercase tracking-widest text-white/50">Total Actual Cost</div>
          <div className="disp text-xl font-bold" style={{ color: totalActual > totalTarget && totalTarget > 0 ? COLORS.urgent : COLORS.safety }}>{fmtMoney(totalActual)}</div>
        </div>
        <div className="rounded-lg p-3" style={{ background: "#fff", border: `1.5px solid ${COLORS.urgent}` }}>
          <div className="text-[10px] uppercase tracking-widest" style={{ color: COLORS.urgent }}>Over Budget</div>
          <div className="disp text-xl font-bold" style={{ color: COLORS.urgent }}>{overrunJobs.length} job{overrunJobs.length === 1 ? "" : "s"}</div>
        </div>
        <div className="rounded-lg p-3" style={{ background: "#fff", border: `1.5px solid ${COLORS.amber}` }}>
          <div className="text-[10px] uppercase tracking-widest" style={{ color: COLORS.amber }}>Nearing Target</div>
          <div className="disp text-xl font-bold" style={{ color: COLORS.amber }}>{nearingJobs.length} job{nearingJobs.length === 1 ? "" : "s"}</div>
        </div>
        <div className="rounded-lg p-3" style={{ background: "#fff", border: `1.5px solid ${COLORS.go}` }}>
          <div className="text-[10px] uppercase tracking-widest" style={{ color: COLORS.go }}>On Track</div>
          <div className="disp text-xl font-bold" style={{ color: COLORS.go }}>{onTrackJobs.length} job{onTrackJobs.length === 1 ? "" : "s"}</div>
        </div>
      </div>

      {(overrunJobs.length > 0 || nearingJobs.length > 0) && (
        <div className="mb-5 rounded-lg p-3" style={{ background: "#FBEAEA", border: `1.5px solid ${COLORS.urgent}` }}>
          <div className="text-[11px] font-bold uppercase tracking-wide mb-1.5 flex items-center gap-1.5" style={{ color: COLORS.urgent }}>
            <AlertTriangle size={13} /> Needs Attention
          </div>
          <div className="grid gap-1">
            {[...overrunJobs, ...nearingJobs].map(({ job, f }) => (
              <div key={job.id} className="flex items-center justify-between text-[12px]">
                <span>#{job.jobOrderNo} — {job.clientName}</span>

              </div>
            ))}
          </div>
        </div>
      )}

      {/* --- detailed per-job costing --- */}
      <div className="grid gap-2">
        {rows.length === 0 && <EmptyState text="No job orders yet." />}
        {rows.map(({ job, f }) => {
          const open = expandedId === job.id;
          const meta = BUDGET_STATUS_META[f.budgetStatus];
          const pct = f.percentOfTarget != null ? Math.min(f.percentOfTarget, 999) : 0;
          return (
            <div key={job.id} className="rounded-lg" style={{ background: "#fff", border: `1.5px solid ${COLORS.line}` }}>

                  <div className="text-sm font-semibold flex items-center gap-2">
                    #{job.jobOrderNo} — {job.clientName}
                    {f.targetCost > 0 && (

                      </span>

                </div>
                <div className="flex items-center gap-3">
                  <span className="mono text-sm font-bold">{fmtMoney(f.actualCost)}</span>

                </div>

                  <div className="grid grid-cols-4 gap-2 mb-3 text-[12px]">
                    <div><div className="text-[10px] uppercase" style={{ color: "#8A8F84" }}>Labor</div><div className="mono font-semibold">{fmtMoney(f.laborCost)}</div></div>
                    <div><div className="text-[10px] uppercase" style={{ color: "#8A8F84" }}>Vehicle</div><div className="mono font-semibold">{fmtMoney(f.vehicleCost)}</div></div>
                    <div><div className="text-[10px] uppercase" style={{ color: "#8A8F84" }}>Material</div><div className="mono font-semibold">{fmtMoney(f.materialCost)}</div></div>
                    <div><div className="text-[10px] uppercase" style={{ color: "#8A8F84" }}>Other</div><div className="mono font-semibold">{fmtMoney(f.otherCost)}</div></div>
                  </div>
                  {f.targetCost > 0 && (
                    <div className="grid grid-cols-3 gap-2 mb-3 text-[12px]">
                      <div><div className="text-[10px] uppercase" style={{ color: "#8A8F84" }}>Budget</div><div className="mono font-semibold">{fmtMoney(f.budget)}</div></div>
                      <div><div className="text-[10px] uppercase" style={{ color: "#8A8F84" }}>Target Cost</div><div className="mono font-semibold">{fmtMoney(f.targetCost)}</div></div>
                      <div><div className="text-[10px] uppercase" style={{ color: "#8A8F84" }}>Variance</div><div className="mono font-semibold" style={{ color: f.targetCost - f.actualCost < 0 ? COLORS.urgent : COLORS.go }}>{fmtMoney(f.targetCost - f.actualCost)}</div></div>
                    </div>

                    <div className="mb-3">
                      <div className="text-[10px] font-semibold uppercase tracking-wide mb-1" style={{ color: COLORS.steelLight }}>Other Expenses</div>
                      <div className="grid gap-1">
                        {f.otherExpenseEntries.map((e) => (
                          <div key={e.id} className="flex items-center justify-between text-[11px] py-1" style={{ borderBottom: `1px solid ${COLORS.paper}` }}>
                            <span><span className="mono opacity-60 mr-1.5">{e.ref}</span>{e.description} · {e.date}</span>
                            <span className="flex items-center gap-2">
                              <span className="mono font-semibold">{fmtMoney(e.amount)}</span>
                              <button onClick={() => onDeleteOtherExpense(e.id)} title="Remove"><X size={12} color={COLORS.urgent} /></button>
                            </span>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                  <div className="flex gap-2">
                    <button onClick={() => setBudgetJob(job)} className="text-[11px] font-semibold px-2.5 py-1.5 rounded-md flex items-center gap-1" style={{ background: COLORS.paperDark, color: COLORS.steel }}>
                      <Zap size={12} /> {f.targetCost > 0 ? "Edit Detailed Budget" : "Set Detailed Budget"}
                    </button>
                    <button onClick={() => setExpenseJob(job)} className="text-[11px] font-semibold px-2.5 py-1.5 rounded-md flex items-center gap-1" style={{ background: COLORS.paperDark, color: COLORS.steel }}>
                      <Receipt size={12} /> Add Other Expense
                    </button>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {budgetJob && (
        <BudgetBuilderModal job={budgetJob} categories={categories} vehicles={vehicles}
          onClose={() => setBudgetJob(null)}
          onSave={(patch) => { onUpdateJob(budgetJob.id, patch); setBudgetJob(null); }} />
      )}
      {expenseJob && (
        <OtherExpenseModal job={expenseJob} onClose={() => setExpenseJob(null)}
          onSubmit={(expense) => { onAddOtherExpense(expense); setExpenseJob(null); }} />
      )}
    </div>
  );
}

function RosterPanel({ workers, vehicles, categories, jobOrders, onAddWorker, onAddVehicle, onUpdateWorker, onUpdateVehicle, onAddCategory }) {
  const [wName, setWName] = useState(""); const [wCat, setWCat] = useState(categories[0]?.code || ""); const [wRate, setWRate] = useState(""); const [wPin, setWPin] = useState("");
  const [vName, setVName] = useState(""); const [vRate, setVRate] = useState("2.5");
  const [showNewCat, setShowNewCat] = useState(false);
  const [ncCode, setNcCode] = useState(""); const [ncLabel, setNcLabel] = useState(""); const [ncRate, setNcRate] = useState("");

  const selectedCat = categories.find((c) => c.code === wCat);

  const submitCategory = () => {
    const code = ncCode.trim().toUpperCase();
    if (!code || !ncLabel.trim() || categories.some((c) => c.code === code)) return;
    onAddCategory({ code, label: ncLabel.trim(), rate: Number(ncRate) || 0 });

    setNcCode(""); setNcLabel(""); setNcRate(""); setShowNewCat(false);
  };

  return (
    <div>
      <div className="flex justify-end mb-3">
        <button onClick={() => exportRosterReport(workers, vehicles, categories)}

          <Receipt size={14} /> EXPORT ROSTER
        </button>
      </div>
      <div className="grid md:grid-cols-2 gap-4">
      <div className="rounded-lg p-4" style={{ background: "#fff", border: `1.5px solid ${COLORS.line}` }}>
        <div className="disp font-bold text-base mb-3 flex items-center justify-between gap-2">
          <span className="flex items-center gap-2"><Users size={16} /> WORKER ROSTER</span>
          <span className="text-[10px] font-normal normal-case" style={{ color: "#8A8F84" }}>PINs let workers sign in on Field</span>
        </div>
        <div className="max-h-56 overflow-y-auto mb-3">
          {workers.map((w) => {
            const isActive = w.active !== false;
            return (
              <div key={w.id} className="flex items-center justify-between gap-2 py-1.5 text-sm" style={{ borderBottom: `1px solid ${COLORS.paper}`, opacity: isActive ? 1 : 0.55 }}>
                <input
                  defaultValue={w.name}
                  onBlur={(e) => { const v = e.target.value.trim(); if (v && v !== w.name) onUpdateWorker(w.id, { name: v }); }}
                  className="flex-1 min-w-0 rounded px-1.5 py-0.5 text-sm"
                  style={{ border: `1.5px solid transparent`, background: "transparent" }}
                  onFocus={(e) => { e.target.style.border = `1.5px solid ${COLORS.line}`; e.target.style.background = "#fff"; }}
                />
                <span className="text-[11px] whitespace-nowrap" style={{ color: "#8A8F84" }}>{catLabel(categories, w.category)}</span>
                <span className="mono text-[12px] font-semibold whitespace-nowrap">{fmtMoney(w.rate)}/day</span>
                <button
                  onClick={() => onUpdateWorker(w.id, { active: !isActive })}
                  className="text-[10px] font-semibold px-2 py-0.5 rounded-full whitespace-nowrap"
                  style={{ background: isActive ? "#E4F1E9" : "#F3E3E3", color: isActive ? COLORS.go : COLORS.urgent }}
                >
                  {isActive ? "Active" : "Inactive"}
                </button>
                <input
                  defaultValue={w.pin || ""}
                  placeholder="PIN"
                  maxLength={6}
                  onBlur={(e) => { const v = e.target.value.trim(); if (v !== (w.pin || "")) onUpdateWorker(w.id, { pin: v }); }}
                  className="mono text-center text-[12px] rounded px-1.5 py-0.5"
                  style={{ width: 56, border: `1.5px solid ${COLORS.line}`, color: COLORS.steel }}
                />
              </div>
            );
          })}
        </div>

        {/* worker types (categories) management */}
        <div className="mb-3 p-2.5 rounded-md" style={{ background: COLORS.paper }}>
          <div className="flex items-center justify-between mb-1.5">
            <span className="text-[11px] font-semibold uppercase tracking-wide" style={{ color: COLORS.steelLight }}>Worker Types</span>
            <button onClick={() => setShowNewCat((s) => !s)} className="text-[11px] font-semibold flex items-center gap-0.5" style={{ color: COLORS.steel }}>
              <Plus size={12} /> {showNewCat ? "Cancel" : "New type"}
            </button>
          </div>
          <div className="flex flex-wrap gap-1.5 mb-2">
            {categories.map((c) => (
              <span key={c.code} className="text-[11px] px-2 py-0.5 rounded-full" style={{ background: "#E7ECEF", color: COLORS.steel }}>
                {c.label} <span className="mono opacity-60">{c.code}</span> · {fmtMoney(c.rate)}
              </span>
            ))}
          </div>
          {showNewCat && (
            <div className="flex gap-1.5 flex-wrap">
              <input placeholder="Type name (e.g. Driver)" value={ncLabel} onChange={(e) => setNcLabel(e.target.value)} className={inputCls} style={{ ...inputStyle, padding: "6px 8px", flex: "1 1 120px" }} />
              <input placeholder="Code" value={ncCode} onChange={(e) => setNcCode(e.target.value)} maxLength={3} className={inputCls} style={{ ...inputStyle, padding: "6px 8px", width: 60 }} />
              <input placeholder="Daily rate" value={ncRate} onChange={(e) => setNcRate(e.target.value)} className={inputCls} style={{ ...inputStyle, padding: "6px 8px", width: 80 }} />

        <div className="flex gap-1.5 flex-wrap">

          <select value={wCat} onChange={(e) => { setWCat(e.target.value); const c = categories.find((x) => x.code === e.target.value); if (c && !wRate) setWRate(String(c.rate)); }}
            className={inputCls} style={{ ...inputStyle, padding: "6px 8px", width: 110 }}>
            {categories.map((c) => <option key={c.code} value={c.code}>{c.label}</option>)}
          </select>
          <input placeholder="Rate" value={wRate} onChange={(e) => setWRate(e.target.value)} className={inputCls} style={{ ...inputStyle, padding: "6px 8px", width: 70 }} />
          <input placeholder="PIN" value={wPin} onChange={(e) => setWPin(e.target.value)} className={inputCls} style={{ ...inputStyle, padding: "6px 8px", width: 60 }} />
          <button onClick={() => { if (!wName || !wRate || !wCat) return; onAddWorker({ id: genId("w"), name: wName, category: wCat, rate: Number(wRate), pin: wPin || String(Math.floor(1000 + Math.random() * 9000)), availability: null, active: true }); setWName(""); setWRate(""); setWPin(""); }}
            className="px-3 rounded-md" style={{ background: COLORS.steel, color: "#fff" }}><Plus size={15} /></button>
        </div>
      </div>

      <div className="rounded-lg p-4" style={{ background: "#fff", border: `1.5px solid ${COLORS.line}` }}>
        <div className="disp font-bold text-base mb-3 flex items-center justify-between gap-2">
          <span className="flex items-center gap-2"><Truck size={16} /> VEHICLE ROSTER</span>
          <span className="text-[10px] font-normal normal-case" style={{ color: "#8A8F84" }}>Priced per km, used with a job's avg one-way km</span>
        </div>
        <div className="max-h-56 overflow-y-auto mb-3">
          {vehicles.map((v) => {
            const computed = computeVehicleStatus(v, jobOrders);
            const isOverride = v.status && VEHICLE_OVERRIDES.includes(v.status);
            const isActive = v.active !== false;
            return (
              <div key={v.id} className="flex items-center justify-between gap-2 py-1.5 text-sm flex-wrap" style={{ borderBottom: `1px solid ${COLORS.paper}`, opacity: isActive ? 1 : 0.55 }}>
                <span className="flex items-center gap-1.5 flex-1 min-w-[90px]">
                  <span className="w-1.5 h-1.5 rounded-full flex-shrink-0" style={{ background: vehicleStatusMeta(computed).color }} />
                  <input
                    defaultValue={v.name}
                    onBlur={(e) => { const val = e.target.value.trim(); if (val && val !== v.name) onUpdateVehicle(v.id, { name: val }); }}
                    className="flex-1 min-w-0 rounded px-1 py-0.5 text-sm"
                    style={{ border: `1.5px solid transparent`, background: "transparent" }}
                    onFocus={(e) => { e.target.style.border = `1.5px solid ${COLORS.line}`; e.target.style.background = "#fff"; }}
                  />
                  <span className="text-[10px]" style={{ color: "#8A8F84" }}>{computed}</span>
                </span>
                <button
                  onClick={() => onUpdateVehicle(v.id, { active: !isActive })}
                  className="text-[10px] font-semibold px-2 py-0.5 rounded-full whitespace-nowrap"
                  style={{ background: isActive ? "#E4F1E9" : "#F3E3E3", color: isActive ? COLORS.go : COLORS.urgent }}
                >
                  {isActive ? "Active" : "Inactive"}
                </button>
                <select
                  value={isOverride ? v.status : ""}
                  onChange={(e) => onUpdateVehicle(v.id, { status: e.target.value || null })}
                  className="text-[11px] rounded px-1 py-0.5"
                  style={{ border: `1.5px solid ${COLORS.line}`, color: COLORS.steel, width: 118 }}
                >
                  <option value="">Auto (from jobs)</option>
                  {VEHICLE_OVERRIDES.map((s) => <option key={s} value={s}>{s}</option>)}
                </select>
                <span className="flex items-center gap-1 text-[12px]">
                  <input
                    defaultValue={v.ratePerKm}
                    onBlur={(e) => { const n = Number(e.target.value); if (!isNaN(n) && n !== v.ratePerKm) onUpdateVehicle(v.id, { ratePerKm: n }); }}
                    className="mono text-right rounded px-1.5 py-0.5"
                    style={{ width: 56, border: `1.5px solid ${COLORS.line}`, color: COLORS.steel }}
                  />
                  <span className="mono" style={{ color: "#8A8F84" }}>/km</span>
                </span>
              </div>

          })}
        </div>
        <div className="flex gap-1.5">
          <input placeholder="Vehicle name / plate" value={vName} onChange={(e) => setVName(e.target.value)} className={inputCls} style={{ ...inputStyle, padding: "6px 8px" }} />

          <button onClick={() => { if (!vName) return; onAddVehicle({ id: genId("v"), name: vName, ratePerKm: Number(vRate) || 0, status: null, active: true }); setVName(""); }}
            className="px-3 rounded-md" style={{ background: COLORS.steel, color: "#fff" }}><Plus size={15} /></button>
        </div>
      </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------
   ATTENDANCE — shift clock log, editable targets, and a workload
   shortfall report by day/week/month.
--------------------------------------------------------------------- */
function AttendancePanel({ workers, attendance, entries, onUpdateTargets, onDeleteEntry }) {
  const targets = attendance.targets || { daily: 8, weekly: 48, monthly: 200 };
  const [daily, setDaily] = useState(targets.daily);
  const [weekly, setWeekly] = useState(targets.weekly);
  const [monthly, setMonthly] = useState(targets.monthly);
  const [periodType, setPeriodType] = useState("week");
  const [refDate, setRefDate] = useState(todayISO());

  const targetsDirty = Number(daily) !== targets.daily || Number(weekly) !== targets.weekly || Number(monthly) !== targets.monthly;
  const { start, end } = periodRange(periodType, refDate);
  const periodTarget = periodType === "day" ? targets.daily : periodType === "week" ? targets.weekly : targets.monthly;

  const rows = workers.map((w) => ({
    worker: w,
    hours: hoursInPeriod(w.id, attendance.entries, entries, start, end),
    active: attendance.entries.some((a) => a.workerId === w.id && a.status === "open"),
  })).sort((a, b) => a.hours - b.hours);
  const shortfall = rows.filter((r) => r.worker.active !== false && r.hours < periodTarget);

  const sortedLog = [...attendance.entries].sort((a, b) => b.createdAt - a.createdAt);

  return (
    <div>
      <div className="text-[11px] mb-3" style={{ color: "#8A8F84" }}>
        Hours below use clock-in/out data where it exists, and fall back to that day's logged Time Log hours on days with no clock record — so a forgotten clock-in doesn't show up as a false shortfall.
      </div>

      {/* target settings */}
      <div className="rounded-lg p-3 mb-4" style={{ background: "#fff", border: `1.5px solid ${COLORS.line}` }}>
        <div className="text-[10px] font-semibold uppercase tracking-wide mb-2" style={{ color: COLORS.steelLight }}>Workload Targets</div>
        <div className="flex flex-wrap items-end gap-3">
          <Field label="Daily (h)"><input type="number" min="0" step="0.5" className={inputCls} style={{ ...inputStyle, width: 90, padding: "6px 8px" }} value={daily} onChange={(e) => setDaily(e.target.value)} /></Field>
          <Field label="Weekly (h)"><input type="number" min="0" step="0.5" className={inputCls} style={{ ...inputStyle, width: 90, padding: "6px 8px" }} value={weekly} onChange={(e) => setWeekly(e.target.value)} /></Field>
          <Field label="Monthly (h)"><input type="number" min="0" step="0.5" className={inputCls} style={{ ...inputStyle, width: 90, padding: "6px 8px" }} value={monthly} onChange={(e) => setMonthly(e.target.value)} /></Field>
          {targetsDirty && (
            <button onClick={() => onUpdateTargets({ daily: Number(daily), weekly: Number(weekly), monthly: Number(monthly) })}
              className="disp px-3 py-2 rounded-md text-sm font-bold tracking-wide mb-3" style={{ background: COLORS.safety, color: COLORS.steelDark }}>
              SAVE TARGETS
            </button>
          )}
          <button onClick={() => exportAttendanceReport(workers, attendance, entries)}
            className="disp flex items-center gap-1.5 px-3 py-2 rounded-md text-sm font-bold tracking-wide ml-auto mb-3"
            style={{ background: COLORS.paperDark, color: COLORS.steel }}>
            <Receipt size={14} /> EXPORT
          </button>
        </div>
      </div>

      {/* period shortfall report */}
      <div className="flex flex-wrap items-center gap-2 mb-3">
        {["day", "week", "month"].map((p) => (
          <button key={p} onClick={() => setPeriodType(p)}
            className="text-[11px] font-semibold px-2.5 py-1 rounded-full capitalize"
            style={{ background: periodType === p ? COLORS.steel : "#fff", color: periodType === p ? "#fff" : COLORS.steel, border: `1.5px solid ${COLORS.steel}` }}>
            {p}
          </button>
        ))}
        <input type="date" value={refDate} onChange={(e) => setRefDate(e.target.value)}
          className="text-[11px] rounded px-2 py-1" style={{ border: `1.5px solid ${COLORS.line}`, color: COLORS.steel, background: "#fff" }} />
        <span className="text-[11px]" style={{ color: "#8A8F84" }}>Target: {periodTarget}h for this {periodType}</span>
      </div>

      {shortfall.length > 0 && (
        <div className="mb-5 rounded-lg p-3" style={{ background: "#FBEAEA", border: `1.5px solid ${COLORS.urgent}` }}>
          <div className="text-[11px] font-bold uppercase tracking-wide mb-1.5 flex items-center gap-1.5" style={{ color: COLORS.urgent }}>
            <AlertTriangle size={13} /> Under Target This {periodType.charAt(0).toUpperCase() + periodType.slice(1)}
          </div>
          <div className="grid gap-1">
            {shortfall.map(({ worker, hours, active }) => (
              <div key={worker.id} className="flex items-center justify-between text-[12px]">
                <span>{worker.name} {active && <span className="text-[10px] font-semibold ml-1" style={{ color: COLORS.go }}>● on shift</span>}</span>
                <span className="mono font-semibold" style={{ color: COLORS.urgent }}>{hours.toFixed(1)}h of {periodTarget}h</span>
              </div>
            ))}
          </div>
        </div>
      )}

      <div className="grid gap-1.5 mb-6" style={{ gridTemplateColumns: "repeat(auto-fill, minmax(200px, 1fr))" }}>
        {rows.map(({ worker, hours, active }) => {
          const short = worker.active !== false && hours < periodTarget;
          return (
            <div key={worker.id} className="rounded-lg p-2.5" style={{ background: "#fff", border: `1.5px solid ${short ? COLORS.urgent : COLORS.line}` }}>
              <div className="text-[12px] font-semibold flex items-center gap-1">{worker.name} {active && <span className="w-1.5 h-1.5 rounded-full" style={{ background: COLORS.go }} />}</div>
              <div className="mono text-sm font-bold" style={{ color: short ? COLORS.urgent : COLORS.ink }}>{hours.toFixed(1)}h</div>
            </div>
          );
        })}
      </div>

      {/* raw shift log — admin can delete a bad/duplicate entry */}
      <div className="text-[10px] font-semibold uppercase tracking-wide mb-2" style={{ color: COLORS.steelLight }}>Shift Log</div>
      <div className="rounded-lg overflow-hidden" style={{ border: `1.5px solid ${COLORS.line}` }}>
        <div className="overflow-x-auto">
          <table className="w-full text-[12.5px]">
            <thead>
              <tr style={{ background: COLORS.steelDark, color: "#fff" }} className="disp tracking-wide">
                {["Worker", "Clock In", "Clock Out", "Hours", "Status", ""].map((h) => (
                  <th key={h} className="text-left px-3 py-2 font-semibold whitespace-nowrap">{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {sortedLog.length === 0 && (
                <tr><td colSpan={6} className="text-center py-8" style={{ color: "#8A8F84" }}>No shifts recorded yet.</td></tr>
              )}
              {sortedLog.map((a, i) => (
                <tr key={a.id} style={{ background: i % 2 ? "#fff" : COLORS.paper, borderTop: `1px solid ${COLORS.line}` }}>
                  <td className="px-3 py-2 font-medium">{a.workerName}</td>
                  <td className="px-3 py-2 mono whitespace-nowrap">{a.clockInDate} {a.clockInTime}</td>
                  <td className="px-3 py-2 mono whitespace-nowrap">{a.clockOutTime ? `${a.clockOutDate !== a.clockInDate ? `${a.clockOutDate} ` : ""}${a.clockOutTime}` : "—"}</td>
                  <td className="px-3 py-2 mono">{a.hours != null ? a.hours.toFixed(2) : "—"}</td>
                  <td className="px-3 py-2">
                    {a.status === "open"
                      ? <span className="text-[11px] font-semibold" style={{ color: COLORS.go }}>In Progress</span>
                      : <span className="text-[11px]" style={{ color: "#8A8F84" }}>Closed</span>}
                  </td>
                  <td className="px-3 py-2">
                    <button onClick={() => { if (window.confirm(`Delete this shift for ${a.workerName}?`)) onDeleteEntry(a.id); }} title="Delete"><X size={13} color={COLORS.urgent} /></button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

function StaffPanel({ workers, categories, vehicles, jobOrders, onUpdateWorker, onUpdateVehicle }) {
  const counts = AVAILABILITY.reduce((acc, a) => { acc[a.id] = 0; return acc; }, {});
  workers.forEach((w) => { const s = computeWorkerStatus(w, jobOrders); counts[s] = (counts[s] || 0) + 1; });
  const vCounts = VEHICLE_STATUS.reduce((acc, s) => { acc[s.id] = 0; return acc; }, {});
  vehicles.forEach((v) => { const s = computeVehicleStatus(v, jobOrders); vCounts[s] = (vCounts[s] || 0) + 1; });

  return (
    <div>
      <div className="flex items-center justify-between mb-1">
        <div className="disp text-sm font-bold tracking-wide flex items-center gap-1.5" style={{ color: COLORS.steelLight }}><User size={14} /> STAFF</div>
        <button onClick={() => exportAvailabilityReport(workers, vehicles, categories, jobOrders)}
          className="disp flex items-center gap-1.5 px-3 py-1.5 rounded-md text-sm font-bold tracking-wide"
          style={{ background: COLORS.safety, color: COLORS.steelDark }}>
          <Receipt size={14} /> EXPORT AVAILABILITY
        </button>
      </div>
      <div className="text-[11px] mb-2" style={{ color: "#8A8F84" }}>"Available" / "On Job" are automatic, based on active job cards. Set Busy / On Leave / Unavailable by hand when it's not job-related.</div>
      <div className="flex flex-wrap gap-2 mb-4">
        {AVAILABILITY.map((a) => (
          <span key={a.id} className="text-[11px] font-semibold px-2.5 py-1 rounded-full flex items-center gap-1.5" style={{ background: "#fff", border: `1.5px solid ${a.color}`, color: a.color }}>
            <span className="w-1.5 h-1.5 rounded-full" style={{ background: a.color }} /> {counts[a.id] || 0} {a.id}
          </span>
        ))}
      </div>
      <div className="grid gap-2 mb-6" style={{ gridTemplateColumns: "repeat(auto-fill, minmax(250px, 1fr))" }}>
        {workers.length === 0 && <EmptyState text="No workers in the roster yet." />}
        {workers.map((w) => {
          const status = computeWorkerStatus(w, jobOrders);
          const isOverride = w.availability && WORKER_OVERRIDES.includes(w.availability);
          const inactive = w.active === false;
          return (
            <div key={w.id} className="rounded-lg p-3" style={{ background: "#fff", border: `1.5px solid ${COLORS.line}`, opacity: inactive ? 0.55 : 1 }}>
              <div className="flex items-center justify-between mb-2">
                <div>
                  <div className="text-sm font-semibold">{w.name}{inactive && <span className="text-[10px] font-semibold ml-1.5 px-1.5 py-0.5 rounded" style={{ color: COLORS.urgent, background: "#F3E3E3" }}>Inactive</span>}</div>
                  <div className="text-[11px]" style={{ color: "#8A8F84" }}>{catLabel(categories, w.category)}</div>
                </div>
                <span className="text-[10px] font-semibold px-2 py-0.5 rounded-full flex items-center gap-1" style={{ color: availabilityMeta(status).color, background: `${availabilityMeta(status).color}1A` }}>
                  <span className="w-1.5 h-1.5 rounded-full" style={{ background: availabilityMeta(status).color }} /> {status}
                </span>
              </div>
              <div className="flex flex-wrap gap-1">
                <button onClick={() => onUpdateWorker(w.id, { availability: null })}
                  className="text-[10px] font-semibold px-2 py-1 rounded-md"
                  style={{ background: !isOverride ? COLORS.steel : COLORS.paper, color: !isOverride ? "#fff" : "#5C665C" }}>
                  Auto

                    {id}

      <div className="disp text-sm font-bold tracking-wide mb-1 flex items-center gap-1.5" style={{ color: COLORS.steelLight }}><Truck size={14} /> FLEET</div>
      <div className="text-[11px] mb-2" style={{ color: "#8A8F84" }}>"Scheduled" / "In Use" are automatic, based on the job card a vehicle is assigned to. Set Maintenance / Out of Service by hand.</div>
      <div className="flex flex-wrap gap-2 mb-4">
        {VEHICLE_STATUS.map((s) => (
          <span key={s.id} className="text-[11px] font-semibold px-2.5 py-1 rounded-full flex items-center gap-1.5" style={{ background: "#fff", border: `1.5px solid ${s.color}`, color: s.color }}>
            <span className="w-1.5 h-1.5 rounded-full" style={{ background: s.color }} /> {vCounts[s.id] || 0} {s.id}

          const status = computeVehicleStatus(v, jobOrders);

          const job = jobOrders.find((j) => j.vehicleId === v.id && j.status !== "Completed");
          const inactive = v.active === false;
          return (
            <div key={v.id} className="rounded-lg p-3" style={{ background: "#fff", border: `1.5px solid ${COLORS.line}`, opacity: inactive ? 0.55 : 1 }}>

                <div className="text-sm font-semibold flex items-center gap-1.5">

                <span className="text-[10px] font-semibold px-2 py-0.5 rounded-full flex items-center gap-1" style={{ color: vehicleStatusMeta(status).color, background: `${vehicleStatusMeta(status).color}1A` }}>
                  <span className="w-1.5 h-1.5 rounded-full" style={{ background: vehicleStatusMeta(status).color }} /> {status}
                </span>
              </div>
              {job && <div className="text-[11px] mb-2" style={{ color: "#8A8F84" }}>#{job.jobOrderNo} — {job.clientName}</div>}
              <div className="flex flex-wrap gap-1">
                <button onClick={() => onUpdateVehicle(v.id, { status: null })}
                  className="text-[10px] font-semibold px-2 py-1 rounded-md"
                  style={{ background: !isOverride ? COLORS.steel : COLORS.paper, color: !isOverride ? "#fff" : "#5C665C" }}>
                  Auto

/* ---------------------------------------------------------------------
   PETTY CASH
--------------------------------------------------------------------- */
function PettyCashPanel({ workers, categories, jobOrders, cash, onAddCashEntry, onAddTransfer, onUpdateCashEntry, onDeleteCashEntry }) {
  const [expandedId, setExpandedId] = useState(null);
  const [modal, setModal] = useState(null); // { type, workerId }
  const [editEntry, setEditEntry] = useState(null);
  const [dateFrom, setDateFrom] = useState("");
  const [dateTo, setDateTo] = useState("");
  const [postedFilter, setPostedFilter] = useState("all"); // all | posted | unposted
  const dateFilterActive = !!dateFrom || !!dateTo || postedFilter !== "all";

  const totalBalance = workers.reduce((s, w) => s + workerCashBalance(w.id, cash.entries), 0);
  const sumByType = (type) => cash.entries.filter((e) => e.type === type).reduce((s, e) => s + Number(e.amount || 0), 0);
  const totalTopups = sumByType("topup");
  const totalIncome = sumByType("income");
  const totalExpenses = sumByType("expense");

  const passesFilter = (e) => {
    if (dateFrom && (e.date || "") < dateFrom) return false;
    if (dateTo && (e.date || "") > dateTo) return false;
    if (postedFilter === "posted" && !e.postedToFinance) return false;
    if (postedFilter === "unposted" && e.postedToFinance) return false;
    return true;
  };
  const filteredEntries = cash.entries.filter(passesFilter);

  return (
    <div>
      {/* filter bar — also drives what "Download Report" exports */}
      <div className="flex flex-wrap items-center gap-2 mb-4 p-2.5 rounded-lg" style={{ background: COLORS.paperDark }}>
        <span className="text-[10px] font-semibold uppercase tracking-wide mr-1" style={{ color: COLORS.steelLight }}>Filter:</span>
        <input type="date" value={dateFrom} onChange={(e) => setDateFrom(e.target.value)}
          className="text-[11px] rounded px-2 py-1" style={{ border: `1.5px solid ${COLORS.line}`, color: COLORS.steel, background: "#fff" }} />
        <span className="text-[11px]" style={{ color: "#8A8F84" }}>to</span>
        <input type="date" value={dateTo} onChange={(e) => setDateTo(e.target.value)}
          className="text-[11px] rounded px-2 py-1" style={{ border: `1.5px solid ${COLORS.line}`, color: COLORS.steel, background: "#fff" }} />
        {["all", "posted", "unposted"].map((f) => (
          <button key={f} onClick={() => setPostedFilter(f)}
            className="text-[11px] font-semibold px-2.5 py-1 rounded-full capitalize"
            style={{ background: postedFilter === f ? COLORS.steel : "#fff", color: postedFilter === f ? "#fff" : COLORS.steel, border: `1.5px solid ${COLORS.steel}` }}>
            {f}
          </button>
        ))}
        {dateFilterActive && (
          <button onClick={() => { setDateFrom(""); setDateTo(""); setPostedFilter("all"); }}
            className="text-[11px] font-semibold px-2.5 py-1 rounded-full" style={{ color: COLORS.urgent, border: `1.5px solid ${COLORS.urgent}` }}>
            Clear
          </button>
        )}
        <span className="text-[11px] ml-auto" style={{ color: "#8A8F84" }}>{filteredEntries.length} of {cash.entries.length} entries</span>
        <button onClick={() => exportPettyCashReport(workers, cash, dateFilterActive ? filteredEntries : undefined)}
          className="disp flex items-center gap-1.5 px-3 py-1.5 rounded-md text-sm font-bold tracking-wide"
          style={{ background: COLORS.safety, color: COLORS.steelDark }}>
          <Receipt size={14} /> DOWNLOAD REPORT
        </button>
      </div>

      {workers.length === 0 && <EmptyState text="No workers in the roster yet." />}

      {/* company-wide total, same balance-card treatment as each individual gets in Field */}
      <div className="rounded-lg p-4 mb-4" style={{ background: COLORS.steelDark }}>
        <div className="text-center mb-3">
          <div className="text-[11px] uppercase tracking-widest text-white/50 mb-1">Total Petty Cash Held (All Workers)</div>
          <div className="disp text-3xl font-bold" style={{ color: totalBalance < 0 ? COLORS.urgent : COLORS.safety }}>{fmtMoney(totalBalance)}</div>
        </div>
        <div className="grid grid-cols-3 gap-2 pt-3" style={{ borderTop: "1px solid rgba(255,255,255,0.15)" }}>
          <div className="text-center">
            <div className="mono text-sm font-bold" style={{ color: COLORS.go }}>+{fmtMoney(totalTopups)}</div>
            <div className="text-[10px] text-white/50 uppercase tracking-wide">Top-ups</div>
          </div>
          <div className="text-center">
            <div className="mono text-sm font-bold" style={{ color: COLORS.go }}>+{fmtMoney(totalIncome)}</div>
            <div className="text-[10px] text-white/50 uppercase tracking-wide">Income</div>
          </div>
          <div className="text-center">
            <div className="mono text-sm font-bold" style={{ color: COLORS.urgent }}>−{fmtMoney(totalExpenses)}</div>
            <div className="text-[10px] text-white/50 uppercase tracking-wide">Expenses</div>
          </div>
        </div>
      </div>

      <div className="grid gap-2">
        {workers.map((w) => {
          const balance = workerCashBalance(w.id, cash.entries); // always the TRUE balance, never affected by the filter above
          const myEntries = filteredEntries.filter((e) => e.workerId === w.id).sort((a, b) => b.createdAt - a.createdAt);
          const open = expandedId === w.id;
          return (
            <div key={w.id} className="rounded-lg" style={{ background: "#fff", border: `1.5px solid ${COLORS.line}` }}>
              <button onClick={() => setExpandedId(open ? null : w.id)} className="w-full flex items-center justify-between p-3">
                <div className="text-left">
                  <div className="text-sm font-semibold">{w.name} <span className="text-[11px] font-normal" style={{ color: "#8A8F84" }}>{catLabel(categories, w.category)}</span></div>
                  <div className="text-[11px]" style={{ color: "#8A8F84" }}>{myEntries.length} shown{dateFilterActive ? ` (filtered)` : ""}</div>
                </div>
                <div className="flex items-center gap-3">
                  <span className="mono text-sm font-bold" style={{ color: balance < 0 ? COLORS.urgent : COLORS.ink }}>{fmtMoney(balance)}</span>
                  <ChevronRight size={14} style={{ transform: open ? "rotate(90deg)" : "none", transition: "transform 0.15s" }} />
                </div>
              </button>
              {open && (
                <div className="px-3 pb-3">
                  <div className="grid gap-1.5 mb-2">
                    {myEntries.length === 0 && <div className="text-[12px] py-2" style={{ color: "#8A8F84" }}>No transactions match this filter.</div>}
                    {myEntries.map((e) => {
                      const meta = CASH_TYPES[e.type];
                      return (
                        <div key={e.id} className="flex items-center justify-between gap-2 text-[12px] py-2 flex-wrap perf">
                          <div className="min-w-[130px]">
                            <div>
                              <span className="mono opacity-60 mr-1.5">{e.ref}</span>
                              {meta.label}{e.projectNo ? ` · ${e.projectNo}` : ""}
                              {e.receipt && <Paperclip size={10} className="inline ml-1 -mt-0.5" color={COLORS.steel} />}
                            </div>
                            <div className="text-[10px]" style={{ color: "#8A8F84" }}>{e.date}</div>
                          </div>
                          <Switch checked={!!e.postedToFinance} onChange={(v) => onUpdateCashEntry(e.id, { postedToFinance: v })} label={e.postedToFinance ? "Posted" : "Not posted"} />
                          <span className="mono font-semibold" style={{ color: meta.sign > 0 ? COLORS.go : COLORS.urgent }}>
                            {meta.sign > 0 ? "+" : "−"}{fmtMoney(e.amount)}
                          </span>
                          {/* Admin-only — this panel only renders on the Dispatch side */}
                          <div className="flex items-center gap-2">
                            <button onClick={() => setEditEntry(e)} title="Edit entry"><Settings2 size={13} color={COLORS.steel} /></button>
                            <button onClick={() => { if (window.confirm(`Delete entry ${e.ref}? This can't be undone.`)) onDeleteCashEntry(e.id); }} title="Delete entry"><X size={13} color={COLORS.urgent} /></button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                  <div className="flex flex-wrap gap-1.5">
                    <button onClick={() => setModal({ type: "topup", workerId: w.id })} className="text-[11px] font-semibold px-2.5 py-1 rounded-md" style={{ background: COLORS.paperDark, color: COLORS.steel }}>+ Top-up</button>
                    <button onClick={() => setModal({ type: "income", workerId: w.id })} className="text-[11px] font-semibold px-2.5 py-1 rounded-md" style={{ background: COLORS.paperDark, color: COLORS.steel }}>+ Income</button>
                    <button onClick={() => setModal({ type: "expense", workerId: w.id })} className="text-[11px] font-semibold px-2.5 py-1 rounded-md" style={{ background: COLORS.paperDark, color: COLORS.steel }}>+ Expense</button>
                    <button onClick={() => setModal({ type: "transfer", workerId: w.id })} className="text-[11px] font-semibold px-2.5 py-1 rounded-md" style={{ background: COLORS.paperDark, color: COLORS.steel }}>+ Transfer</button>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {modal && (
        <CashActionModal
          type={modal.type}
          worker={workers.find((w) => w.id === modal.workerId) || workers[0]}
          workers={workers} jobOrders={jobOrders}
          onWorkerChange={(id) => setModal((m) => ({ ...m, workerId: id }))}
          onClose={() => setModal(null)}
          onSubmitEntry={(entry) => onAddCashEntry(entry)}
          onSubmitTransfer={(t) => onAddTransfer(t)}
        />
      )}
      {editEntry && (
        <EditCashEntryModal entry={editEntry} jobOrders={jobOrders}
          onClose={() => setEditEntry(null)}
          onSave={(patch) => { onUpdateCashEntry(editEntry.id, patch); setEditEntry(null); }} />
      )}
    </div>
  );
}

        <div className="px-5 py-4 flex items-center justify-between" style={{ background: COLORS.steelDark }}>
          <div className="disp text-white font-bold tracking-wide flex items-center gap-2"><Settings2 size={16} color={COLORS.safety} /> EDIT ENTRY — {entry.ref}</div>
          <button onClick={onClose}><X size={18} color="#fff" /></button>

        <div className="p-5">

          <div className="flex items-center justify-between mb-3 mt-1">

            <button

              className="flex-1 py-2 rounded-md text-sm font-bold disp tracking-wide" style={{ background: COLORS.safety, color: COLORS.steelDark }}>
              SAVE
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function CashActionModal({ type, worker, workers, jobOrders, onWorkerChange, onClose, onSubmitEntry, onSubmitTransfer }) {
  const [amount, setAmount] = useState("");
  const [projectNo, setProjectNo] = useState("");
  const [description, setDescription] = useState("");
  const [date, setDate] = useState(todayISO());
  const [receipt, setReceipt] = useState(null);
  const [receiptName, setReceiptName] = useState("");
  const [uploading, setUploading] = useState(false);
  const [toWorkerId, setToWorkerId] = useState(workers.find((w) => w.id !== worker.id)?.id || "");

  useEffect(() => {
    setToWorkerId(workers.find((w) => w.id !== worker.id)?.id || "");
  }, [worker.id]); // eslint-disable-line react-hooks/exhaustive-deps

  const META = {
    expense: { title: "Log Expense", icon: Receipt, color: COLORS.urgent },
    income: { title: "Income Collected", icon: Banknote, color: COLORS.go },
    topup: { title: "Bank Top-up", icon: Landmark, color: COLORS.steel },
    transfer: { title: "Transfer Petty Cash", icon: ArrowLeftRight, color: COLORS.amber },
  };
  const meta = META[type];
  const Icon = meta.icon;

  const handleFile = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (file.size > 3 * 1024 * 1024) { alert("Please choose a file under 3MB."); return; }
    setUploading(true);
    try {
      const dataUrl = await fileToDataUrl(file);
      setReceipt(dataUrl); setReceiptName(file.name);
    } finally { setUploading(false); }
  };

  const canSubmit = Number(amount) > 0
    && (type !== "expense" || projectNo.trim())
    && (type !== "transfer" || (toWorkerId && toWorkerId !== worker.id));

  const submit = () => {
    if (!canSubmit) return;
    if (type === "transfer") {
      onSubmitTransfer({ fromWorkerId: worker.id, toWorkerId, amount: Number(amount), description, date });
    } else {
      onSubmitEntry({
        type, workerId: worker.id, workerName: worker.name, amount: Number(amount),
        projectNo: projectNo || null, description, date, receipt: receipt || null, receiptName: receiptName || null,
      });
    }
    onClose();
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" style={{ background: "rgba(20,25,20,0.5)" }}>
      <div className="w-full sm:max-w-md rounded-t-xl sm:rounded-xl overflow-hidden max-h-[92vh] overflow-y-auto" style={{ background: COLORS.paper }}>
        <div className="px-5 py-4 flex items-center justify-between" style={{ background: COLORS.steelDark }}>
          <div className="disp text-white font-bold tracking-wide flex items-center gap-2"><Icon size={16} color={COLORS.safety} /> {meta.title.toUpperCase()}</div>
          <button onClick={onClose}><X size={18} color="#fff" /></button>
        </div>
        <div className="p-5">
          {onWorkerChange && (
            <Field label={type === "transfer" ? "Transfer From" : "For Worker"}>
              <select className={inputCls} style={inputStyle} value={worker.id} onChange={(e) => onWorkerChange(e.target.value)}>
                {workers.map((w) => <option key={w.id} value={w.id}>{w.name}</option>)}
              </select>
            </Field>
          )}
          <Field label="Amount (AED)">
            <input type="number" min="0" step="0.01" className={inputCls} style={inputStyle} value={amount} onChange={(e) => setAmount(e.target.value)} placeholder="0.00" />
          </Field>
          {type === "expense" && (

                <option value="">No specific project</option>
                {jobOrders.map((j) => <option key={j.id} value={j.projectNo || j.jobOrderNo}>{j.projectNo || j.jobOrderNo} — {j.clientName}</option>)}

            </Field>

          {type === "transfer" && (
            <Field label="Transfer To">
              <select className={inputCls} style={inputStyle} value={toWorkerId} onChange={(e) => setToWorkerId(e.target.value)}>
                {workers.filter((w) => w.id !== worker.id).map((w) => <option key={w.id} value={w.id}>{w.name}</option>)}
              </select>

          <Field label="Date"><input type="date" className={inputCls} style={inputStyle} value={date} onChange={(e) => setDate(e.target.value)} /></Field>
          <Field label="Note"><textarea className={inputCls} style={{ ...inputStyle, minHeight: 50 }} value={description} onChange={(e) => setDescription(e.target.value)} placeholder="What's this for?" /></Field>

            <Field label="Receipt / Invoice (optional)">

              {uploading && <div className="text-[11px] mt-1" style={{ color: "#8A8F84" }}>Reading file…</div>}
              {receipt && receipt.startsWith("data:image") && (
                <img src={receipt} alt="receipt" className="mt-2 rounded-md max-h-32 border" style={{ borderColor: COLORS.line }} />
              )}
              {receipt && !receipt.startsWith("data:image") && (
                <div className="text-[11px] mt-1 flex items-center gap-1" style={{ color: COLORS.steel }}><Paperclip size={11} /> {receiptName}</div>

            <button onClick={onClose} className="flex-1 py-2 rounded-md text-sm font-semibold" style={{ background: COLORS.paperDark, color: COLORS.steel }}>Cancel</button>
            <button onClick={submit} disabled={!canSubmit}
              className="flex-1 py-2 rounded-md text-sm font-bold disp tracking-wide"
              style={{ background: canSubmit ? COLORS.safety : "#D8DACB", color: COLORS.steelDark }}>
              SUBMIT

          </div>
        </div>
      </div>
    </div>
  );
}

    { type: "expense", label: "Log Expense", icon: Receipt, color: COLORS.urgent },
    { type: "income", label: "Income Collected", icon: Banknote, color: COLORS.go },

        <div className="disp text-3xl font-bold" style={{ color: balance < 0 ? COLORS.urgent : COLORS.safety }}>{fmtMoney(balance)}</div>

                  <div className="text-[11px]" style={{ color: "#8A8F84" }}>

              </div>
              {e.type === "expense" && (
                <div className="flex items-center gap-2 mt-2 pt-2" style={{ borderTop: `1px solid ${COLORS.paper}` }}>
                  {e.receipt && e.receipt.startsWith("data:image") && (

// Field-side, worker-scoped: the only thing an employee can change on their own
// petty cash entry is the receipt image — amount/date/description stay
// admin-only (see EditCashEntryModal, Dispatch-only).
function EditAttachmentModal({ entry, onClose, onSave }) {
  const [receipt, setReceipt] = useState(entry.receipt || null);
  const [receiptName, setReceiptName] = useState(entry.receiptName || "");
  const [uploading, setUploading] = useState(false);

  const handleFile = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (file.size > 3 * 1024 * 1024) { alert("Please choose a file under 3MB."); return; }
    setUploading(true);
    try {
      const dataUrl = await fileToDataUrl(file);
      setReceipt(dataUrl); setReceiptName(file.name);
    } finally { setUploading(false); }
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" style={{ background: "rgba(20,25,20,0.5)" }}>
      <div className="w-full sm:max-w-sm rounded-t-xl sm:rounded-xl overflow-hidden" style={{ background: COLORS.paper }}>
        <div className="px-5 py-4 flex items-center justify-between" style={{ background: COLORS.steelDark }}>
          <div className="disp text-white font-bold tracking-wide flex items-center gap-2"><Paperclip size={16} color={COLORS.safety} /> {entry.ref} ATTACHMENT</div>
          <button onClick={onClose}><X size={18} color="#fff" /></button>
        </div>
        <div className="p-5">
          <div className="text-[11px] mb-3" style={{ color: "#8A8F84" }}>You can update the receipt photo for this expense. The amount, date, and note can only be changed by your dispatcher.</div>
          <Field label="Receipt / Invoice">
            <input type="file" accept="image/*,.pdf" onChange={handleFile} className="text-xs" />
            {uploading && <div className="text-[11px] mt-1" style={{ color: "#8A8F84" }}>Reading file…</div>}
            {receipt && receipt.startsWith("data:image") && (
              <img src={receipt} alt="receipt" className="mt-2 rounded-md max-h-40 border" style={{ borderColor: COLORS.line }} />
            )}
            {receipt && !receipt.startsWith("data:image") && (
              <div className="text-[11px] mt-1 flex items-center gap-1" style={{ color: COLORS.steel }}><Paperclip size={11} /> {receiptName}</div>
            )}
          </Field>
          <div className="flex gap-2 mt-2">
            <button onClick={onClose} className="flex-1 py-2 rounded-md text-sm font-semibold" style={{ background: COLORS.paperDark, color: COLORS.steel }}>Cancel</button>
            <button onClick={() => onSave({ receipt, receiptName })} disabled={uploading}
              className="flex-1 py-2 rounded-md text-sm font-bold disp tracking-wide" style={{ background: COLORS.safety, color: COLORS.steelDark }}>
              SAVE
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}
