// ---------------------------------------------------------------------
// STORAGE — this app was built to run inside Claude's artifact preview,
// which provides a `window.storage` API. Outside that preview there's no
// such thing, so this file backs it with the browser's localStorage
// instead. That means: works immediately, no setup — but data stays on
// THIS browser/device only. Two people opening this same file on two
// different computers will NOT see each other's data. For a real
// multi-device rollout (dispatcher + every worker's phone sharing live
// data) this localStorage adapter needs to be swapped for a real backend
// (Supabase, Firebase, your own small API).
// ---------------------------------------------------------------------
const STORAGE_PREFIX = "dispatch-app:";
const storage = {
  async get(key) {
    try {
      const raw = window.localStorage.getItem(STORAGE_PREFIX + key);
      return raw === null ? null : { key, value: raw };
    } catch (e) {
      console.error("storage.get failed", key, e);
      return null;
    }
  },
  async set(key, value) {
    try {
      window.localStorage.setItem(STORAGE_PREFIX + key, value);
      return { key, value };
    } catch (e) {
      console.error("storage.set failed", key, e);
      return null;
    }
  },
  async delete(key) {
    try {
      window.localStorage.removeItem(STORAGE_PREFIX + key);
      return { key, deleted: true };
    } catch (e) {
      console.error("storage.delete failed", key, e);
      return null;
    }
  },
};

// Statuses a dispatcher/worker sets by hand — these always win over job assignments
// (someone on leave or a vehicle in the shop shouldn't silently show as free).
// Everything else ("Available" / "On Job" / "Scheduled" / "In Use") is derived
// automatically from whether they're on an active (non-Completed) job order.
const WORKER_OVERRIDES = ["Busy", "On Leave", "Unavailable"];
const VEHICLE_OVERRIDES = ["Maintenance", "Out of Service"];

function computeWorkerStatus(worker, jobOrders) {
  if (worker.availability && WORKER_OVERRIDES.includes(worker.availability)) return worker.availability;
  const onActiveJob = jobOrders.some((j) => j.workerIds.includes(worker.id) && j.status !== "Completed");
  return onActiveJob ? "On Job" : "Available";
}
function computeVehicleStatus(vehicle, jobOrders) {
  if (vehicle.status && VEHICLE_OVERRIDES.includes(vehicle.status)) return vehicle.status;
  const job = jobOrders.find((j) => j.vehicleId === vehicle.id && j.status !== "Completed");
  if (!job) return "Available";
  return job.status === "In Progress" ? "In Use" : "Scheduled";
}

function workerCashBalance(workerId, cashEntries) {
  return (cashEntries || []).filter((e) => e.workerId === workerId)
    .reduce((s, e) => s + (CASH_TYPES[e.type]?.sign || 0) * Number(e.amount || 0), 0);
}

const toLocalDateStr = (d) => {
  const dt = d instanceof Date ? d : new Date(d);
  const y = dt.getFullYear();
  const m = String(dt.getMonth() + 1).padStart(2, "0");
  const day = String(dt.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
};

const fmtMoney = (n) => "AED " + (Math.round(n * 100) / 100).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function hoursBetween(timeIn, timeOut) {
  if (!timeIn || !timeOut) return 0;
  const [ih, im] = timeIn.split(":").map(Number);
  const [oh, om] = timeOut.split(":").map(Number);
  let mins = (oh * 60 + om) - (ih * 60 + im);
  if (mins < 0) mins += 24 * 60;
  return mins / 60;
}

function getJobContractTypeMeta(job) {
  if (!job) return { label: "Non-AMC", code: "non_amc", color: COLORS.steel, bg: "#E7ECEF" };
  const ct = job.contractType || (job.amc ? "amc" : "non_amc");
  if (ct === "amc") {
    return { label: "AMC", code: "amc", color: COLORS.go, bg: "#E4F1E9" };
  }
  if (ct === "non_amc_with_amc_ref") {
    const refStr = job.amcRefNo ? `Non-AMC (Ref: ${job.amcRefNo})` : "Non-AMC (with AMC Ref)";
    return { label: refStr, code: "non_amc_with_amc_ref", color: "#6B46C1", bg: "#F3E8FF", refNo: job.amcRefNo || "" };
  }
  return { label: "Non-AMC", code: "non_amc", color: COLORS.steel, bg: "#E7ECEF" };
}

// Vehicle cost is derived per job: round-trip km (avg one-way km * 2) x rate/km,
// applied once per distinct day the job was actually worked (so multiple workers
// logging the same day don't multiply the vehicle cost).
//
// Budget model mirrors the "Tracking" sheet in the client's template:
//   Quotation Amount (budget) - Margin (AED) = Quotation Cost (target cost ceiling)
//   Project Live cost (actual so far) / Quotation Cost = Cost %
// Here Margin is entered as a % of the budget rather than a flat AED figure,
// then converted the same way so the numbers land in the same place.
function computeJobFinancials(job, vehicles, entries, cashEntries, otherExpenses) {
  const jobEntries = entries.filter((e) => e.jobId === job.id);
  const laborCost = jobEntries.reduce((s, e) => s + e.cost, 0);
  const totalHours = jobEntries.reduce((s, e) => s + e.hours, 0);
  const travelDays = new Set(jobEntries.map((e) => e.date)).size;
  const vehicle = vehicles.find((v) => v.id === job.vehicleId);
  const roundTripKm = (Number(job.avgOneWayKm) || 0) * 2;
  const trips = Number(job.trips) > 0 ? Number(job.trips) : (travelDays > 0 ? travelDays : 1);
  const vehicleCost = vehicle ? (Number(vehicle.ratePerKm) || 0) * roundTripKm * trips : 0;
  const totalCost = laborCost + vehicleCost; // labor + vehicle only — used for invoicing display

  const jobKey = job.projectNo || job.jobOrderNo;
  const materialEntries = (cashEntries || []).filter((e) => e.type === "expense" && e.projectNo === jobKey);
  const materialCost = materialEntries.reduce((s, e) => s + Number(e.amount || 0), 0);
  const otherExpenseEntries = (otherExpenses || []).filter((e) => e.jobId === job.id);
  const otherCost = otherExpenseEntries.reduce((s, e) => s + Number(e.amount || 0), 0);
  const actualCost = totalCost + materialCost + otherCost; // labor + vehicle + material + other — used for budget tracking

  const budget = Number(job.budgetAmount) || 0;
  const marginPercent = Number(job.marginPercent) || 0;
  const marginAmount = budget * (marginPercent / 100);
  const targetCost = budget > 0 ? budget - marginAmount : 0;
  const percentOfTarget = targetCost > 0 ? (actualCost / targetCost) * 100 : null;
  let budgetStatus = "no-budget";
  if (targetCost > 0) {
    budgetStatus = percentOfTarget >= 100 ? "overrun" : percentOfTarget >= 80 ? "nearing" : "on-track";
  }

  return {
    jobEntries, laborCost, totalHours, travelDays, trips, vehicle, roundTripKm, vehicleCost, totalCost,
    materialCost, materialEntries, otherCost, otherExpenseEntries, actualCost,
    budget, marginPercent, marginAmount, targetCost, percentOfTarget, budgetStatus,
  };
}
const BUDGET_STATUS_META = {
  "on-track": { label: "On Track", color: COLORS.go },
  "nearing": { label: "Nearing Target", color: COLORS.amber },

// Detailed budget build-up: hours/category + materials + consumables + vehicle
// trips×distance + margin% (margin-on-price, matching the Tracking sheet's
// convention) + a free +/- adjustment for negotiated extras or discounts.
//   baseCost      = labor(from hours) + materials + consumables + vehicle
//   adjustedCost  = baseCost + otherAdjustment   → this becomes the target cost ceiling
//   budgetAmount  = adjustedCost / (1 - margin/100)   → the quote handed to the client
//   marginAmount  = budgetAmount - adjustedCost
function computeBudgetBuildUp(input, categories) {
  const hours = input.budgetHours || {};
  const laborCost = categories.reduce((s, c) => s + ((Number(hours[c.code]) || 0) / 8) * c.rate, 0);
  const materials = Number(input.budgetMaterials) || 0;
  const consumables = Number(input.budgetConsumables) || 0;
  const trips = Number(input.budgetVehicleTrips) || 0;
  const distance = Number(input.budgetVehicleDistance) || 0;
  const rate = Number(input.budgetVehicleRate) || 0;
  const vehicleCost = trips * distance * 2 * rate;
  const baseCost = laborCost + materials + consumables + vehicleCost;
  const adjustment = Number(input.budgetOtherAdjustment) || 0;
  const adjustedCost = baseCost + adjustment;
  const marginPercent = Number(input.marginPercent) || 0;
  const budgetAmount = marginPercent < 100 ? adjustedCost / (1 - marginPercent / 100) : adjustedCost;
  const marginAmount = budgetAmount - adjustedCost;
  return { laborCost, materials, consumables, vehicleCost, baseCost, adjustment, adjustedCost, marginPercent, marginAmount, budgetAmount };
}

// ---------------------------------------------------------------------
// EXCEL IMPORT / EXPORT — matches the client's "labor cost datasheet" and
// "Tracking" sheet layouts so round-tripping through their existing
// workbook works without reshaping anything by hand.
// ---------------------------------------------------------------------
function excelDateToISO(raw) {
  if (raw == null || raw === "") return "";
  if (raw instanceof Date) {
    // SheetJS builds this Date from the serial number as UTC — read it back
    // as UTC too, or a UAE-timezone browser would shift the calendar day.
    const y = raw.getUTCFullYear();
    const m = String(raw.getUTCMonth() + 1).padStart(2, "0");
    const d = String(raw.getUTCDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
  }
  if (typeof raw === "number") {
    const ms = Math.round((raw - 25569) * 86400 * 1000);
    const dt = new Date(ms);
    return `${dt.getUTCFullYear()}-${String(dt.getUTCMonth() + 1).padStart(2, "0")}-${String(dt.getUTCDate()).padStart(2, "0")}`;
  }
  const s = String(raw).trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const parts = s.split(/[\/\-]/);
  if (parts.length === 3) {
    let [d, m, y] = parts.map(Number);
    if (y < 100) y += 2000;
    if (!isNaN(d) && !isNaN(m) && !isNaN(y)) return `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
  }
  return s;
}
function excelTimeToHHMM(raw) {
  if (raw == null || raw === "") return "";
  if (raw instanceof Date) {
    // same UTC-vs-local reasoning as excelDateToISO — read UTC hours/minutes.
    const hh = raw.getUTCHours();
    const mm = raw.getUTCMinutes();
    return `${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}`;
  }
  if (typeof raw === "number") {
    const totalMin = Math.round(raw * 24 * 60);
    const hh = Math.floor(totalMin / 60) % 24;
    const mm = totalMin % 60;
    return `${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}`;
  }
  const s = String(raw).trim();
  const isPM = /pm/i.test(s);
  const isAM = /am/i.test(s);
  let [h, m] = s.replace(/\s*(am|pm)/i, "").split(":").map(Number);
  if (isNaN(h)) return "";
  if (isPM && h < 12) h += 12;
  if (isAM && h === 12) h = 0;
  return `${String(h).padStart(2, "0")}:${String(m || 0).padStart(2, "0")}`;
}
function rowField(row, ...names) {
  const keys = Object.keys(row);
  for (const n of names) {
    const hit = keys.find((k) => k.trim().toLowerCase() === n.toLowerCase());
    if (hit !== undefined && row[hit] !== "") return row[hit];
  }
  return "";
}
function downloadWorkbook(wb, filename) {
  const wbout = XLSX.write(wb, { bookType: "xlsx", type: "array" });
  const blob = new Blob([wbout], { type: "application/octet-stream" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

    row[isFiltered ? "Cumulative (in this export)" : "Running Balance"] = Number(running[e.workerId].toFixed(2));

    return row;

    const assignedJobs = jobOrders.filter((j) => j.vehicleId === v.id);
    const activeJob = assignedJobs.find((j) => j.status !== "Completed");
    const status = computeVehicleStatus(v, jobOrders);

    let totalTrips = 0;
    let totalKms = 0;
    let totalTravelCost = 0;

    assignedJobs.forEach((j) => {
      const trips = Number(j.trips || j.budgetVehicleTrips) || 0;
      const distance = Number(j.avgOneWayKm || j.budgetVehicleDistance) || 0;
      const kms = trips * distance * 2;
      const cost = kms * (v.ratePerKm || 0);
      totalTrips += trips;
      totalKms += kms;
      totalTravelCost += cost;
    });

    const activeCrewNames = activeJob
      ? workers.filter((w) => activeJob.workerIds.includes(w.id)).map((w) => w.name).join(", ")
      : "None";

    return {
      "Vehicle Name": v.name,
      "Rate per Km (AED)": v.ratePerKm || 0,
      "Operational Status": status,
      "Manual Override": v.status && VEHICLE_OVERRIDES.includes(v.status) ? v.status : "",
      "Active Assigned Job": activeJob ? `#${activeJob.jobOrderNo} (${activeJob.clientName})` : "Unassigned",
      "Assigned Crew": activeCrewNames,
      "Total Assigned Jobs": assignedJobs.length,
      "Total Trips Completed": totalTrips,
      "Total Round-Trip Kms": totalKms,
      "Accumulated Travel Cost (AED)": Number(totalTravelCost.toFixed(2)),
      "Active Status": v.active !== false ? "Active" : "Inactive",
    };
  });

  const ws = XLSX.utils.json_to_sheet(rows);
  XLSX.utils.book_append_sheet(wb, ws, "Fleet Master & Trip Log");
  downloadWorkbook(wb, `fleet-management-${todayISO()}.xlsx`);
}

// Day/Week/Month window used both by the shortfall report and its export.
// Weeks start Sunday; a night shift is attributed to the day it started.
function periodRange(type, refDateStr) {
  const ref = new Date(`${refDateStr}T00:00:00`);
  if (type === "day") return { start: ref, end: new Date(ref.getTime() + 24 * 60 * 60 * 1000) };
  if (type === "week") {
    const start = new Date(ref); start.setDate(ref.getDate() - ref.getDay());
    return { start, end: new Date(start.getTime() + 7 * 24 * 60 * 60 * 1000) };
  }
  return { start: new Date(ref.getFullYear(), ref.getMonth(), 1), end: new Date(ref.getFullYear(), ref.getMonth() + 1, 1) };
}

// Per worker, per calendar day: prefer actual clock-in/out hours where they
// exist; on any day with no clock record at all, fall back to that day's
// logged Time Log (job) hours instead of counting it as zero. This stops a
// forgotten clock-in/out from showing up as a false workload shortfall,
// while still using the more precise clock data whenever it's there.
function effectiveHoursByDate(workerId, attendanceEntries, jobEntries) {
  const jobHoursByDate = {};
  (jobEntries || []).filter((e) => e.workerId === workerId).forEach((e) => {
    jobHoursByDate[e.date] = (jobHoursByDate[e.date] || 0) + (e.hours || 0);
  });
  const attHoursByDate = {};
  const datesWithClockRecord = new Set();
  (attendanceEntries || []).filter((a) => a.workerId === workerId).forEach((a) => {
    datesWithClockRecord.add(a.clockInDate);
    if (a.hours != null) attHoursByDate[a.clockInDate] = (attHoursByDate[a.clockInDate] || 0) + a.hours;
  });
  const byDate = {};
  new Set([...Object.keys(jobHoursByDate), ...Object.keys(attHoursByDate)]).forEach((date) => {
    byDate[date] = datesWithClockRecord.has(date) ? (attHoursByDate[date] || 0) : jobHoursByDate[date];
  });
  return byDate;
}
function hoursInPeriod(workerId, attendanceEntries, jobEntries, start, end) {
  const byDate = effectiveHoursByDate(workerId, attendanceEntries, jobEntries);
  return Object.entries(byDate)
    .filter(([date]) => { const d = new Date(`${date}T00:00:00`); return d >= start && d < end; })
    .reduce((s, [, h]) => s + h, 0);
}

function exportAttendanceReport(workers, attendance, jobEntries) {
  const wb = XLSX.utils.book_new();
  const sorted = [...attendance.entries].sort((a, b) => b.createdAt - a.createdAt);
  const logRows = sorted.map((a) => ({
    "Worker": a.workerName,
    "Clock In Date": a.clockInDate,
    "Clock In Time": a.clockInTime,
    "Clock Out Date": a.clockOutDate || "",
    "Clock Out Time": a.clockOutTime || "",
    "Hours": a.hours != null ? Number(a.hours.toFixed(2)) : "",
    "Status": a.status === "open" ? "In Progress" : "Closed",
  }));
  const ws1 = XLSX.utils.json_to_sheet(logRows);
  XLSX.utils.book_append_sheet(wb, ws1, "Shift Log");

  const targets = attendance.targets || { daily: 8, weekly: 48, monthly: 200 };
  const today = todayISO();
  const day = periodRange("day", today), week = periodRange("week", today), month = periodRange("month", today);
  const summaryRows = workers.map((w) => ({
    "Worker": w.name,
    "Today (h)": Number(hoursInPeriod(w.id, attendance.entries, jobEntries, day.start, day.end).toFixed(2)),
    "Daily Target": targets.daily,
    "This Week (h)": Number(hoursInPeriod(w.id, attendance.entries, jobEntries, week.start, week.end).toFixed(2)),
    "Weekly Target": targets.weekly,
    "This Month (h)": Number(hoursInPeriod(w.id, attendance.entries, jobEntries, month.start, month.end).toFixed(2)),
    "Monthly Target": targets.monthly,
  }));
  const ws2 = XLSX.utils.json_to_sheet(summaryRows);
  XLSX.utils.book_append_sheet(wb, ws2, "Workload Summary");

  downloadWorkbook(wb, `attendance-${todayISO()}.xlsx`);
}

async function storageGet(key, shared) {
  try {
    const r = await storage.get(key, shared);
    return r ? JSON.parse(r.value) : null;
  } catch (e) {
    return null;
  }
}
async function storageSet(key, value, shared) {
  try {
    await storage.set(key, JSON.stringify(value), shared);
  } catch (e) {
    console.error("storage set failed", key, e);
  }
}
