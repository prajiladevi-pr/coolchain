// Daily start/end-of-day clock, independent of which job is worked. Stores
// both the clock-in AND clock-out calendar date explicitly, so a night shift
// (clock in 10pm, clock out 6am the next day) gets a correct duration instead
// of guessing at a same-day wraparound.
function ClockCard({ worker, attendance, onClockIn, onClockOut }) {
  const openShift = attendance.entries.find((a) => a.workerId === worker.id && a.status === "open");
  const isNightSoFar = openShift && openShift.clockInDate !== todayISO();

  return (
    <div className="mb-4 rounded-lg p-3 flex items-center justify-between" style={{ background: openShift ? COLORS.go : COLORS.steelDark }}>
      <div>
        <div className="text-[10px] uppercase tracking-widest text-white/60">
          {openShift ? `Clocked in ${openShift.clockInTime}${isNightSoFar ? ` · ${openShift.clockInDate}` : ""}` : "Not clocked in"}
        </div>
        <div className="disp text-lg font-bold text-white">{openShift ? "ON SHIFT" : "OFF SHIFT"}</div>
      </div>
      <button onClick={() => (openShift ? onClockOut(worker) : onClockIn(worker))}
        className="disp px-4 py-2 rounded-md text-sm font-bold tracking-wide flex items-center gap-1.5"
        style={{ background: COLORS.safety, color: COLORS.steelDark }}>
        <Clock size={14} /> {openShift ? "CLOCK OUT" : "CLOCK IN"}
      </button>
    </div>
  );
}

function ShiftStat({ label, value, target }) {
  const short = value < target;
  return (
    <div className="rounded-lg p-2.5 text-center" style={{ background: "#fff", border: `1.5px solid ${short ? COLORS.urgent : COLORS.line}` }}>
      <div className="text-[10px] uppercase" style={{ color: "#8A8F84" }}>{label}</div>
      <div className="mono text-base font-bold" style={{ color: short ? COLORS.urgent : COLORS.ink }}>{value.toFixed(1)}h</div>
      <div className="text-[9px]" style={{ color: "#8A8F84" }}>of {target}h target</div>
    </div>
  );
}

function MyShiftsPanel({ worker, attendance, entries }) {
  const myShifts = attendance.entries.filter((a) => a.workerId === worker.id).sort((a, b) => b.createdAt - a.createdAt);
  const targets = attendance.targets || { daily: 8, weekly: 48, monthly: 200 };
  const today = todayISO();
  const day = periodRange("day", today), week = periodRange("week", today), month = periodRange("month", today);
  const todayHours = hoursInPeriod(worker.id, attendance.entries, entries, day.start, day.end);
  const weekHours = hoursInPeriod(worker.id, attendance.entries, entries, week.start, week.end);
  const monthHours = hoursInPeriod(worker.id, attendance.entries, entries, month.start, month.end);

  return (
    <div>
      <div className="text-[11px] mb-3" style={{ color: "#8A8F84" }}>Totals include logged job time on any day you forgot to clock in/out.</div>
      <div className="grid grid-cols-3 gap-2 mb-4">
        <ShiftStat label="Today" value={todayHours} target={targets.daily} />
        <ShiftStat label="This Week" value={weekHours} target={targets.weekly} />
        <ShiftStat label="This Month" value={monthHours} target={targets.monthly} />
      </div>
      <div className="grid gap-2">
        {myShifts.length === 0 && <EmptyState text="No shifts recorded yet — clock in above to start one." />}
        {myShifts.map((a) => (
          <div key={a.id} className="p-3 rounded-lg flex items-center justify-between" style={{ background: "#fff", border: `1.5px solid ${COLORS.line}` }}>
            <div>
              <div className="text-sm font-semibold mono">
                {a.clockInDate} {a.clockInTime}
                {a.clockOutTime ? ` → ${a.clockOutDate !== a.clockInDate ? `${a.clockOutDate} ` : ""}${a.clockOutTime}` : ""}
              </div>
              <div className="text-[11px]" style={{ color: "#8A8F84" }}>{a.status === "open" ? "In progress" : `${a.hours.toFixed(2)}h shift`}</div>
            </div>
            {a.status === "open" && (
              <span className="text-[11px] font-semibold flex items-center gap-1" style={{ color: COLORS.go }}>
                <span className="w-1.5 h-1.5 rounded-full" style={{ background: COLORS.go }} /> ON SHIFT
              </span>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

// Lets the designated team lead log the same date/time in-out for every
// crew member on a job in one action, instead of each person doing it
// individually. Each worker's cost is still computed off their own rate.
function LogCrewTimeModal({ job, workers, categories, entries, onClose, onSubmit }) {
  const [mode, setMode] = useState("individual"); // "individual" | "batch"
  const [date, setDate] = useState(todayISO());

  // Batch Mode States
  const [batchTimeIn, setBatchTimeIn] = useState("08:00");
  const [batchTimeOut, setBatchTimeOut] = useState("16:00");
  const [batchNote, setBatchNote] = useState("");
  const [batchSelected, setBatchSelected] = useState(workers.map((w) => w.id));

  // Individual Mode States: workerId -> { timeIn, timeOut, hours, category, note, isExisting, existingId }
  const [individualLogs, setIndividualLogs] = useState({});

  useEffect(() => {
    const map = {};
    workers.forEach((w) => {
      const existing = entries?.find((e) => e.jobId === job.id && e.workerId === w.id && e.date === date);
      if (existing) {
        map[w.id] = {
          timeIn: existing.timeIn || "08:00",
          timeOut: existing.timeOut || "16:00",
          hours: String(existing.hours || 8),
          category: existing.category || w.category || "T",
          note: existing.note || "",
          active: true,
          isExisting: true,
          existingId: existing.id,
        };
      } else {
        map[w.id] = {
          timeIn: "08:00",
          timeOut: "16:00",
          hours: "8",
          category: w.category || "T",
          note: "",
          active: true,
          isExisting: false,
        };
      }
    });
    setIndividualLogs(map);
  }, [date, workers, job.id, entries]);

  const updateWorkerLog = (wId, field, val) => {
    setIndividualLogs((prev) => {
      const current = prev[wId] || {};
      const updated = { ...current, [field]: val };
      if (field === "timeIn" || field === "timeOut") {
        const hrs = hoursBetween(updated.timeIn, updated.timeOut);
        if (hrs > 0) updated.hours = hrs.toFixed(1);
      }
      return { ...prev, [wId]: updated };
    });
  };

  const batchHours = hoursBetween(batchTimeIn, batchTimeOut);
  const batchDays = batchHours / 8;
  const toggleBatch = (id) => setBatchSelected((s) => (s.includes(id) ? s.filter((x) => x !== id) : [...s, id]));

  const submitBatch = () => {
    if (batchHours <= 0 || batchSelected.length === 0) return;
    const selectedWorkers = workers.filter((w) => batchSelected.includes(w.id));
    const newEntries = selectedWorkers.map((w) => ({
      id: genId("e"), jobId: job.id, workerId: w.id, workerName: w.name, category: w.category,
      date, timeIn: batchTimeIn, timeOut: batchTimeOut, hours: batchHours, days: batchDays, cost: w.rate * batchDays, note: batchNote, createdAt: Date.now(),
    }));
    onSubmit(newEntries);
  };

  const submitIndividual = () => {
    const newEntries = [];
    workers.forEach((w) => {
      const log = individualLogs[w.id];
      if (log && log.active && Number(log.hours) > 0) {
        const hrs = Number(log.hours) || 8;
        const d = hrs / 8;
        const catObj = (categories || []).find((c) => c.code === log.category);
        const rate = catObj ? catObj.rate : w.rate || 150;
        newEntries.push({
          id: log.existingId || genId("e"),
          jobId: job.id,
          workerId: w.id,
          workerName: w.name,
          category: log.category,
          date,
          timeIn: log.timeIn || "08:00",
          timeOut: log.timeOut || "16:00",
          hours: hrs,
          days: d,
          cost: rate * d,
          note: log.note || "",
          createdAt: Date.now(),
        });
      }
    });
    if (newEntries.length === 0) {
      alert("Please enter hours for at least one crew member.");
      return;
    }
    onSubmit(newEntries);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4" style={{ background: "rgba(20,25,20,0.5)" }} onClick={onClose}>
      <div className="w-full max-w-xl rounded-xl overflow-hidden shadow-2xl max-h-[92vh] flex flex-col" style={{ background: COLORS.paper, fontFamily: "'Inter',sans-serif" }} onClick={(e) => e.stopPropagation()}>
        <div className="px-5 py-4 flex items-center justify-between flex-shrink-0" style={{ background: COLORS.steelDark }}>
          <div className="disp text-white font-bold text-base tracking-wide flex items-center gap-2">
            <Users size={18} color={COLORS.safety} /> MANAGE CREW DAILY LOGS — #{job.jobOrderNo}
          </div>
          <button onClick={onClose}><X size={18} color="#fff" /></button>
        </div>

        <div className="p-4 flex-1 overflow-y-auto">
          {/* Header Controls: Date & Mode Switcher */}
          <div className="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 mb-4 p-3 rounded-lg" style={{ background: "#fff", border: `1.5px solid ${COLORS.line}` }}>
            <div>
              <label className="text-[10px] font-bold uppercase tracking-wider text-gray-500 block mb-1">Select Work Date</label>
              <input type="date" className={inputCls} style={{ ...inputStyle, width: "160px" }} value={date} onChange={(e) => setDate(e.target.value)} />
            </div>

            <div className="flex rounded-lg overflow-hidden border border-gray-300 p-0.5 bg-gray-100">
              <button
                type="button"
                onClick={() => setMode("individual")}
                className="px-3 py-1.5 text-xs font-bold rounded-md transition-all cursor-pointer flex items-center gap-1.5"
                style={{
                  background: mode === "individual" ? COLORS.steel : "transparent",
                  color: mode === "individual" ? "#fff" : COLORS.steel,
                }}
              >
                <FileText size={13} /> Individual Worker Logs
              </button>
              <button
                type="button"
                onClick={() => setMode("batch")}
                className="px-3 py-1.5 text-xs font-bold rounded-md transition-all cursor-pointer flex items-center gap-1.5"
                style={{
                  background: mode === "batch" ? COLORS.steel : "transparent",
                  color: mode === "batch" ? "#fff" : COLORS.steel,
                }}
              >
                <Zap size={13} /> Batch All Crew
              </button>
            </div>
          </div>

          {mode === "batch" ? (
            <div>
              <div className="text-[11px] mb-3" style={{ color: "#8A8F84" }}>
                Applies identical date, time in/out, and work notes to all selected crew members for {date}. Each worker's cost uses their own rate.
              </div>
              <div className="grid grid-cols-2 gap-3 mb-3">
                <Field label="Time In"><input type="time" className={inputCls} style={inputStyle} value={batchTimeIn} onChange={(e) => setBatchTimeIn(e.target.value)} /></Field>
                <Field label="Time Out"><input type="time" className={inputCls} style={inputStyle} value={batchTimeOut} onChange={(e) => setBatchTimeOut(e.target.value)} /></Field>
              </div>
              <Field label="Batch Work Note"><textarea className={inputCls} style={{ ...inputStyle, minHeight: 50 }} value={batchNote} onChange={(e) => setBatchNote(e.target.value)} placeholder={job.scope} /></Field>

              <div className="text-[10px] font-semibold uppercase tracking-wide mb-1" style={{ color: COLORS.steelLight }}>Crew Included ({batchSelected.length} of {workers.length})</div>
              <div className="grid gap-1 max-h-40 overflow-y-auto p-1 rounded-md mb-3" style={{ border: `1.5px solid ${COLORS.line}` }}>
                {workers.map((w) => (
                  <button key={w.id} type="button" onClick={() => toggleBatch(w.id)}
                    className="flex items-center justify-between px-2 py-1.5 rounded text-xs font-medium"
                    style={{ background: batchSelected.includes(w.id) ? "#E7ECEF" : "transparent", color: COLORS.ink }}>
                    <span>{w.name} <span className="mono opacity-50">({w.category} · {fmtMoney(w.rate)}/day)</span></span>
                    {batchSelected.includes(w.id) && <Check size={13} color={COLORS.steel} />}
                  </button>
                ))}
              </div>
            </div>
          ) : (
            <div>
              <div className="text-[11px] mb-3 text-gray-600">
                Update daily labor hours, work category, and task notes for <strong>each crew member individually</strong> for {date}.
              </div>

              <div className="space-y-3 max-h-[380px] overflow-y-auto pr-1">
                {workers.map((w) => {
                  const log = individualLogs[w.id] || { timeIn: "08:00", timeOut: "16:00", hours: "8", category: w.category || "T", note: "", active: true };
                  const catObj = (categories || []).find((c) => c.code === log.category);
                  const rate = catObj ? catObj.rate : w.rate || 150;
                  const dayCost = (Number(log.hours) || 0) / 8 * rate;

                  return (
                    <div key={w.id} className="p-3.5 rounded-lg border transition-all" style={{ background: "#fff", borderColor: log.isExisting ? COLORS.amber : COLORS.line }}>
                      <div className="flex items-center justify-between mb-2">
                        <div className="flex items-center gap-2">
                          <span className="font-bold text-sm" style={{ color: COLORS.steelDark }}>{w.name}</span>
                          <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-700 border border-slate-200">
                            {catLabel(categories || [], log.category)}
                          </span>
                          {log.isExisting && (
                            <span className="text-[9.5px] font-bold px-2 py-0.5 rounded bg-amber-100 text-amber-800 border border-amber-300">
                              Logged Entry ({log.hours}h)
                            </span>
                          )}
                        </div>
                        <div className="mono font-bold text-xs" style={{ color: COLORS.steel }}>
                          {fmtMoney(dayCost)}
                        </div>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-2 mb-2">
                        <div>
                          <label className="text-[9.5px] font-semibold text-gray-500 uppercase">Category</label>
                          <select className={inputCls} style={{ ...inputStyle, padding: "4px 6px", fontSize: "11px" }}
                            value={log.category} onChange={(e) => updateWorkerLog(w.id, "category", e.target.value)}>
                            {(categories || []).map((c) => <option key={c.code} value={c.code}>{c.label} ({fmtMoney(c.rate)}/d)</option>)}
                          </select>
                        </div>
                        <div>
                          <label className="text-[9.5px] font-semibold text-gray-500 uppercase">Hours Worked</label>
                          <input type="number" min="0" max="24" step="0.5" className={inputCls} style={{ ...inputStyle, padding: "4px 6px", fontSize: "11px" }}
                            value={log.hours} onChange={(e) => updateWorkerLog(w.id, "hours", e.target.value)} placeholder="8" />
                        </div>
                        <div className="flex items-end gap-1">
                          <button type="button" onClick={() => updateWorkerLog(w.id, "hours", "8")}
                            className="text-[10px] font-semibold px-2 py-1 rounded bg-slate-100 text-slate-700 hover:bg-slate-200 border border-slate-200 cursor-pointer">
                            8h Full
                          </button>
                          <button type="button" onClick={() => updateWorkerLog(w.id, "hours", "4")}
                            className="text-[10px] font-semibold px-2 py-1 rounded bg-slate-100 text-slate-700 hover:bg-slate-200 border border-slate-200 cursor-pointer">
                            4h Half
                          </button>
                          <button type="button" onClick={() => updateWorkerLog(w.id, "hours", "0")}
                            className="text-[10px] font-semibold px-2 py-1 rounded bg-red-50 text-red-700 hover:bg-red-100 border border-red-200 cursor-pointer">
                            0h Off
                          </button>
                        </div>
                      </div>

                      <div>
                        <input type="text" className={inputCls} style={{ ...inputStyle, padding: "4px 8px", fontSize: "11px" }}
                          value={log.note} onChange={(e) => updateWorkerLog(w.id, "note", e.target.value)}
                          placeholder={`Work notes for ${w.name} on ${date}...`} />
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>

        {/* Modal Action Footer */}
        <div className="px-5 py-3.5 bg-slate-900 border-t border-slate-800 flex items-center justify-between flex-shrink-0">
          <button onClick={onClose} className="px-4 py-2 rounded-lg text-xs font-semibold cursor-pointer" style={{ background: COLORS.paperDark, color: COLORS.steel }}>
            Cancel
          </button>
          <button
            onClick={mode === "batch" ? submitBatch : submitIndividual}
            className="disp px-5 py-2 rounded-lg text-xs font-bold tracking-wider uppercase shadow-md flex items-center gap-1.5 cursor-pointer"
            style={{ background: COLORS.safety, color: COLORS.steelDark }}
          >
            <Check size={16} /> SAVE CREW DAILY LOGS ({date})
          </button>
        </div>
      </div>
    </div>
  );
}

function SupervisorJobModal({ job, vehicles, onSave, onClose }) {
  const [trips, setTrips] = useState(job.trips || "1");
  const [avgOneWayKm, setAvgOneWayKm] = useState(job.avgOneWayKm || "");
  const [vehicleId, setVehicleId] = useState(job.vehicleId || "");
  const [status, setStatus] = useState(job.status || "Assigned");
  const [scope, setScope] = useState(job.scope || "");
  const [estimatedDays, setEstimatedDays] = useState(job.estimatedDays || "1");

  const v = vehicles.find((x) => x.id === vehicleId);
  const oneWay = Number(avgOneWayKm) || 0;
  const roundTrip = oneWay * 2;
  const tripCount = Number(trips) > 0 ? Number(trips) : 1;
  const tripCost = v ? roundTrip * (Number(v.ratePerKm) || 0) * tripCount : 0;

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(20,25,20,0.5)" }} onClick={onClose}>
      <div className="w-full max-w-md rounded-xl overflow-hidden shadow-2xl" style={{ background: COLORS.paper, fontFamily: "'Inter',sans-serif" }} onClick={(e) => e.stopPropagation()}>
        <div className="px-5 py-4 flex items-center justify-between" style={{ background: COLORS.steelDark }}>
          <div className="disp text-white font-bold text-base tracking-wide flex items-center gap-2">
            <ShieldCheck size={18} color={COLORS.safety} /> SUPERVISOR EDIT — #{job.jobOrderNo}
          </div>
          <button onClick={onClose}><X size={18} color="#fff" /></button>
        </div>
        <div className="p-5">
          <div className="text-[11px] mb-3" style={{ color: "#8A8F84" }}>
            As the designated In-Charge for this job, you can update vehicle assignment, number of trips, one-way distance, estimated duration in days, and work scope directly from the field app.
          </div>

          <div className="grid grid-cols-2 gap-3">
            <Field label="Job Status">
              <select className={inputCls} style={inputStyle} value={status} onChange={(e) => setStatus(e.target.value)}>
                <option value="Assigned">Assigned</option>
                <option value="In Progress">In Progress</option>
                <option value="On Hold">On Hold</option>
                <option value="Completed">Completed</option>
              </select>
            </Field>
            <Field label="Estimated Days Work">
              <input type="number" min="1" step="1" className={inputCls} style={inputStyle}
                value={estimatedDays} onChange={(e) => setEstimatedDays(e.target.value)} placeholder="1" />
            </Field>
          </div>

          <Field label="Vehicle Assigned">
            <select className={inputCls} style={inputStyle} value={vehicleId} onChange={(e) => setVehicleId(e.target.value)}>
              <option value="">No vehicle</option>
              {vehicles.map((veh) => (
                <option key={veh.id} value={veh.id}>{veh.name} ({fmtMoney(veh.ratePerKm)}/km)</option>
              ))}
            </select>
          </Field>

          <div className="grid grid-cols-2 gap-3">
            <Field label="One-Way Distance (KM)">
              <input type="number" min="0" step="0.1" className={inputCls} style={inputStyle}
                value={avgOneWayKm} onChange={(e) => setAvgOneWayKm(e.target.value)} placeholder="e.g. 18" />
            </Field>
            <Field label="Number of Trips">
              <input type="number" min="1" step="1" className={inputCls} style={inputStyle}
                value={trips} onChange={(e) => setTrips(e.target.value)} placeholder="1" />
            </Field>
          </div>

          {vehicleId && avgOneWayKm && (
            <div className="p-3 rounded-lg text-xs font-semibold mb-4 flex items-center justify-between" style={{ background: "#FBF0DD", border: `1.5px solid ${COLORS.amber}`, color: COLORS.steelDark }}>
              <div className="flex items-center gap-2">
                <Truck size={16} color={COLORS.amber} />
                <div>
                  <div>{v ? v.name : "Vehicle"} · {oneWay} km one-way ({roundTrip} km round trip)</div>
                  <div className="text-[10px] text-gray-600">{tripCount} trip{tripCount === 1 ? "" : "s"} allocated</div>
                </div>
              </div>
              <div className="disp text-base font-bold" style={{ color: COLORS.steel }}>{fmtMoney(tripCost)}</div>
            </div>
          )}

          <Field label="Scope of Work / Field Notes">
            <textarea className={inputCls} style={{ ...inputStyle, minHeight: 60 }} value={scope} onChange={(e) => setScope(e.target.value)} />
          </Field>

          <div className="flex gap-2 pt-2">
            <button onClick={onClose} className="flex-1 py-2.5 rounded-lg text-xs font-semibold cursor-pointer" style={{ background: COLORS.paperDark, color: COLORS.steel }}>Cancel</button>
            <button
              onClick={() => {
                onSave({ trips, avgOneWayKm, vehicleId, status, scope, estimatedDays });
                onClose();
              }}
              className="flex-1 disp py-2.5 rounded-lg text-xs font-bold tracking-wider uppercase shadow-md flex items-center justify-center gap-1.5 cursor-pointer"
              style={{ background: COLORS.safety, color: COLORS.steelDark }}
            >
              <Check size={16} /> SAVE UPDATES
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function FieldView({ initialWorkerId, workers, vehicles, categories, jobOrders, entries, cash, attendance, onUpdateJob, onAddEntry, onAddEntries, onUpdateWorker, onAddCashEntry, onAddTransfer, onUpdateCashEntry, onClockIn, onClockOut }) {
  const [wrapUpTarget, setWrapUpTarget] = useState(null);
  const [workerId, setWorkerId] = useState(initialWorkerId || null); // authenticated worker id, session-only

  useEffect(() => {
    if (initialWorkerId) {
      setWorkerId(initialWorkerId);
    }
  }, [initialWorkerId]);
  const [tab, setTab] = useState("tickets");
  const [logJob, setLogJob] = useState(null);
  const [logCrewJob, setLogCrewJob] = useState(null);
  const [supervisorEditJob, setSupervisorEditJob] = useState(null);

  const me = workers.find((w) => w.id === workerId);
  const order = { High: 0, Medium: 1, Low: 2 };
  const myTickets = workerId ? jobOrders
    .filter((j) => j.workerIds.includes(workerId))
    .sort((a, b) => {
      const aDone = a.status === "Completed" ? 1 : 0;
      const bDone = b.status === "Completed" ? 1 : 0;
      if (aDone !== bDone) return aDone - bDone; // active jobs first, completed sink to the bottom
      return order[a.priority] - order[b.priority];
    }) : [];
  const myHistory = workerId ? entries.filter((e) => e.workerId === workerId).sort((a, b) => b.createdAt - a.createdAt) : [];

  if (workers.length === 0) return <div className="p-5 text-sm" style={{ color: "#8A8F84" }}>No workers in the roster yet — add one from the Dispatch → Roster tab.</div>;

  if (!me) {
    return <FieldLogin workers={workers} onLogin={(id) => { setWorkerId(id); setTab("tickets"); }} />;
  }

  return (
    <div className="p-4 max-w-lg mx-auto">
      {/* signed-in strip */}
      <div className="mb-4 p-3 rounded-lg flex items-center gap-3" style={{ background: COLORS.steelDark }}>
        <div className="w-10 h-10 rounded-full flex items-center justify-center disp font-bold text-lg" style={{ background: COLORS.safety, color: COLORS.steelDark }}>
          {me.name[0]}
        </div>
        <div className="flex-1">
          <div className="disp text-white font-bold text-base tracking-wide">{me.name}</div>
          <div className="text-[11px] text-white/50">{catLabel(categories, me.category)} · {fmtMoney(me.rate)}/day</div>
        </div>
        <button onClick={() => setWorkerId(null)} className="text-[11px] font-semibold px-2.5 py-1 rounded-md cursor-pointer" style={{ background: "rgba(255,255,255,0.12)", color: "#fff" }}>
          Sign out
        </button>
      </div>

      <ClockCard worker={me} attendance={attendance} onClockIn={onClockIn} onClockOut={onClockOut} />

      {/* self-reported availability — "On Job" is automatic from active assignments;
          these buttons only set the manual overrides */}
      <div className="mb-1 flex items-center gap-1.5">
        <span className="text-[11px]" style={{ color: "#8A8F84" }}>Status:</span>
        <span className="text-[11px] font-semibold px-2 py-0.5 rounded-full flex items-center gap-1" style={{ color: availabilityMeta(computeWorkerStatus(me, jobOrders)).color, background: `${availabilityMeta(computeWorkerStatus(me, jobOrders)).color}1A` }}>
          <span className="w-1.5 h-1.5 rounded-full" style={{ background: availabilityMeta(computeWorkerStatus(me, jobOrders)).color }} /> {computeWorkerStatus(me, jobOrders)}
        </span>
      </div>
      <div className="mb-4 flex flex-wrap gap-1.5">
        {(() => {
          const isOverride = me.availability && WORKER_OVERRIDES.includes(me.availability);
          return (
            <>
              <button onClick={() => onUpdateWorker(me.id, { availability: null })}
                className="text-[11px] font-semibold px-2.5 py-1 rounded-full cursor-pointer"
                style={{ background: !isOverride ? COLORS.steel : "#fff", color: !isOverride ? "#fff" : COLORS.steel, border: `1.5px solid ${COLORS.steel}` }}>
                Auto
              </button>
              {WORKER_OVERRIDES.map((id) => (
                <button key={id} onClick={() => onUpdateWorker(me.id, { availability: id })}
                  className="text-[11px] font-semibold px-2.5 py-1 rounded-full cursor-pointer"
                  style={{ background: me.availability === id ? availabilityMeta(id).color : "#fff", color: me.availability === id ? "#fff" : availabilityMeta(id).color, border: `1.5px solid ${availabilityMeta(id).color}` }}>
                  {id}
                </button>
              ))}
            </>
          );
        })()}
      </div>

      <div className="flex gap-1 p-1 rounded-lg mb-3" style={{ background: COLORS.paperDark }}>
        {[{ id: "tickets", label: `My Jobs (${myTickets.length})`, icon: ClipboardList }, { id: "history", label: "History", icon: Clock }, { id: "shifts", label: "Shifts", icon: CalendarDays }, { id: "cash", label: "Cash", icon: Wallet }].map((t) => {
          const Icon = t.icon;
          return (
            <button key={t.id} onClick={() => setTab(t.id)}
              className="flex-1 disp py-1.5 rounded-md text-sm font-semibold flex items-center justify-center gap-1.5 tracking-wide cursor-pointer"
              style={{ background: tab === t.id ? "#fff" : "transparent", color: tab === t.id ? COLORS.steel : COLORS.steelLight }}>
              <Icon size={14} /> {t.label.toUpperCase()}
            </button>
          );
        })}
      </div>

      {tab === "tickets" && (
        <div className="grid gap-3">
          {myTickets.length === 0 && <EmptyState text="No jobs assigned to you right now." />}
          {myTickets.map((j) => {
            const vehicle = vehicles.find((v) => v.id === j.vehicleId);
            const isInCharge = j.teamLeadId === me.id;
            const oneWay = Number(j.avgOneWayKm) || 0;
            const roundTrip = oneWay * 2;
            const trips = Number(j.trips) > 0 ? Number(j.trips) : 1;

            return (
              <div key={j.id} className="ticket p-4">
                <div className="flex items-start justify-between mb-1.5">
                  <div className="flex items-center gap-2">
                    <div className="mono text-[11px] font-bold" style={{ color: COLORS.steel }}>#{j.jobOrderNo}</div>
                    {isInCharge && (
                      <span className="text-[10px] font-bold px-1.5 py-0.5 rounded flex items-center gap-1" style={{ background: COLORS.safety, color: COLORS.steelDark }} title="You are the designated in-charge supervisor for this job">
                        <ShieldCheck size={11} /> IN-CHARGE
                      </span>
                    )}
                  </div>
                  <PriorityStamp priority={j.priority} />
                </div>
                <div className="disp text-base font-bold leading-tight mb-1">{j.clientName}</div>
                <div className="flex items-center gap-1.5 text-[12px] mb-2" style={{ color: "#5C665C" }}>
                  <MapPin size={12} /> {j.area}, {j.emirates}
                </div>
                <div className="text-[12.5px] mb-3">{j.scope}</div>
                {vehicle && (
                  <div className="flex items-center gap-1.5 text-[12px] font-semibold mb-3 p-2 rounded" style={{ background: "#FBF0DD", color: COLORS.steelDark, border: `1px solid ${COLORS.amber}` }}>
                    <Truck size={13} color={COLORS.amber} />
                    <span>{vehicle.name}{j.avgOneWayKm ? ` · ${j.avgOneWayKm} km one-way (${roundTrip} km round trip)` : ""} · {trips} trip{trips === 1 ? "" : "s"}</span>
                  </div>
                )}
                {j.status === "On Hold" && (
                  <div className="my-2 p-2 rounded text-xs font-semibold flex items-center gap-1.5" style={{ background: "#FEF3C7", color: "#92400E", border: "1px solid #F59E0B" }}>
                    <PauseCircle size={14} color="#D97706" />
                    <span><strong>ON HOLD:</strong> {j.onHoldReason || "Work paused"}</span>
                  </div>
                )}
                <div className="perf pt-3 flex items-center gap-2 flex-wrap">
                  <StatusPill status={j.status} />
                  {j.estimatedDays && (
                    <span className="text-[10px] font-semibold px-2 py-0.5 rounded flex items-center gap-1" style={{ background: COLORS.paperDark, color: COLORS.steel }}>
                      <Calendar size={11} /> {j.estimatedDays} Day{Number(j.estimatedDays) > 1 ? "s" : ""} Work
                    </span>
                  )}
                  <div className="ml-auto flex items-center gap-1.5 flex-wrap">
                    {j.status === "On Hold" ? (
                      <button onClick={() => onUpdateJob(j.id, { status: "In Progress" })}
                        className="disp flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-bold tracking-wide cursor-pointer"
                        style={{ background: COLORS.go, color: "#fff" }}>
                        <PlayCircle size={13} /> RESUME WORK
                      </button>
                    ) : j.status !== "Completed" && (
                      <>
                        <button onClick={() => setWrapUpTarget({ job: j, action: "hold" })}
                          className="disp flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-bold tracking-wide cursor-pointer"
                          style={{ background: "#FEF3C7", color: "#D97706", border: "1.5px solid #F59E0B" }}>
                          <PauseCircle size={13} /> HOLD WORK
                        </button>
                        <button onClick={() => setWrapUpTarget({ job: j, action: "complete" })}
                          className="disp flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-bold tracking-wide cursor-pointer"
                          style={{ background: COLORS.go, color: "#fff" }}>
                          <Check size={13} /> COMPLETE
                        </button>
                      </>
                    )}
                    {isInCharge && (
                      <button onClick={() => setSupervisorEditJob(j)}
                        className="disp flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-bold tracking-wide cursor-pointer"
                        style={{ background: COLORS.paperDark, color: COLORS.steel, border: `1.5px solid ${COLORS.steel}` }}>
                        <Settings2 size={13} /> EDIT TRIPS &amp; VEHICLE
                      </button>
                    )}
                    {isInCharge && j.workerIds.length > 1 && (
                      <button onClick={() => setLogCrewJob(j)}
                        className="disp flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-bold tracking-wide cursor-pointer"
                        style={{ background: COLORS.steel, color: "#fff" }}>
                        <Users size={13} /> MANAGE CREW LOGS
                      </button>
                    )}
                    <button onClick={() => setLogJob(j)}
                      className="disp flex items-center gap-1 px-2.5 py-1.5 rounded-md text-xs font-bold tracking-wide cursor-pointer"
                      style={{ background: COLORS.safety, color: COLORS.steelDark }}>
                      <Clock size={13} /> {isInCharge && j.workerIds.length > 1 ? "LOG MY TIME" : "LOG TIME"}
                    </button>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {tab === "history" && (
        <div className="grid gap-2">
          {myHistory.length === 0 && <EmptyState text="No entries logged yet." />}
          {myHistory.map((e) => {
            const job = jobOrders.find((j) => j.id === e.jobId);
            return (
              <div key={e.id} className="p-3 rounded-lg flex items-center justify-between" style={{ background: "#fff", border: `1.5px solid ${COLORS.line}` }}>
                <div>
                  <div className="text-sm font-semibold">{job?.clientName || "—"} <span className="mono text-[11px] opacity-60">#{job?.jobOrderNo}</span></div>
                  <div className="text-[11px] mono" style={{ color: "#8A8F84" }}>{e.date} · {e.timeIn}–{e.timeOut} · {e.hours.toFixed(2)}h</div>
                </div>
                <div className="mono text-sm font-bold">{fmtMoney(e.cost)}</div>
              </div>
            );
          })}
        </div>
      )}

      {tab === "shifts" && <MyShiftsPanel worker={me} attendance={attendance} entries={entries} />}

      {tab === "cash" && (
        <WorkerCashPanel worker={me} workers={workers} jobOrders={jobOrders} cash={cash}
          onAddCashEntry={onAddCashEntry} onAddTransfer={onAddTransfer} onUpdateCashEntry={onUpdateCashEntry} />
      )}

      {logJob && (
        <LogEntryModal job={logJob} worker={me} categories={categories}
          onClose={() => setLogJob(null)}
          onSubmit={(entry) => { onAddEntry(entry); setLogJob(null); }} />
      )}
      {logCrewJob && (
        <LogCrewTimeModal job={logCrewJob} workers={workers.filter((w) => logCrewJob.workerIds.includes(w.id))} categories={categories} entries={entries}
          onClose={() => setLogCrewJob(null)}
          onSubmit={(newEntries) => { onAddEntries(newEntries); setLogCrewJob(null); }} />
      )}
      {supervisorEditJob && (
        <SupervisorJobModal job={supervisorEditJob} vehicles={vehicles}
          onClose={() => setSupervisorEditJob(null)}
          onSave={(patch) => { onUpdateJob(supervisorEditJob.id, patch); setSupervisorEditJob(null); }} />
      )}
      {wrapUpTarget && (
        <JobWrapUpModal action={wrapUpTarget.action} job={wrapUpTarget.job} workers={workers} vehicles={vehicles} jobOrders={jobOrders}
          onClose={() => setWrapUpTarget(null)}
          onSubmit={(updates) => {
            onUpdateJob(wrapUpTarget.job.id, { ...updates, [updates.status === "On Hold" ? "onHoldAt" : "completedAt"]: todayISO() });
            setWrapUpTarget(null);
          }} />
      )}
    </div>
  );
}

function FieldLogin({ workers, onLogin }) {
  const [selected, setSelected] = useState(workers[0]?.id || "");
  const [pin, setPin] = useState("");
  const [error, setError] = useState("");

  const submit = () => {
    const w = workers.find((x) => x.id === selected);
    if (!w) return;
    if (!w.pin) { onLogin(w.id); return; } // no PIN set yet — allow through, dispatcher hasn't configured one
    if (pin.trim() === String(w.pin)) {
      setError(""); onLogin(w.id);
    } else {
      setError("Wrong PIN. Check with your dispatcher.");
    }
  };

  return (
    <div className="p-4 max-w-sm mx-auto pt-10">
      <div className="text-center mb-6">
        <div className="w-14 h-14 rounded-full mx-auto mb-3 flex items-center justify-center" style={{ background: COLORS.steelDark }}>
          <User size={24} color={COLORS.safety} />
        </div>
        <div className="disp text-xl font-bold tracking-wide" style={{ color: COLORS.steel }}>FIELD SIGN-IN</div>
        <div className="text-[12px]" style={{ color: "#8A8F84" }}>Select your name and enter your PIN</div>
      </div>

      <div className="rounded-lg p-4" style={{ background: "#fff", border: `1.5px solid ${COLORS.line}` }}>
        <Field label="Worker">
          <select className={inputCls} style={inputStyle} value={selected} onChange={(e) => { setSelected(e.target.value); setError(""); }}>
            {workers.map((w) => <option key={w.id} value={w.id}>{w.name}</option>)}
          </select>
        </Field>
        <Field label="PIN">
          <input
            type="password" inputMode="numeric" maxLength={6} value={pin}
            onChange={(e) => setPin(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") submit(); }}
            className={inputCls} style={{ ...inputStyle, letterSpacing: "0.3em", textAlign: "center", fontSize: 18 }}
            placeholder="••••"

function LogEntryModal({ job, worker, categories, onClose, onSubmit }) {
  const [date, setDate] = useState(todayISO());
  const [timeIn, setTimeIn] = useState(nowHHMM());
  const [timeOut, setTimeOut] = useState(nowHHMM());
  const [note, setNote] = useState("");

  const hours = hoursBetween(timeIn, timeOut);
  const days = hours / 8;
  const cost = worker.rate * days;

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" style={{ background: "rgba(20,25,20,0.5)" }}>
      <div className="w-full sm:max-w-md rounded-t-xl sm:rounded-xl overflow-hidden" style={{ background: COLORS.paper }}>
        <div className="px-5 py-4 flex items-center justify-between" style={{ background: COLORS.steelDark }}>
          <div className="disp text-white font-bold tracking-wide flex items-center gap-2"><Stamp size={16} color={COLORS.safety} /> LOG TIME — #{job.jobOrderNo}</div>
          <button onClick={onClose}><X size={18} color="#fff" /></button>
        </div>
        <div className="p-5">
          <Field label="Date"><input type="date" className={inputCls} style={inputStyle} value={date} onChange={(e) => setDate(e.target.value)} /></Field>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Time In"><input type="time" className={inputCls} style={inputStyle} value={timeIn} onChange={(e) => setTimeIn(e.target.value)} /></Field>
            <Field label="Time Out"><input type="time" className={inputCls} style={inputStyle} value={timeOut} onChange={(e) => setTimeOut(e.target.value)} /></Field>
          </div>
          <Field label="Work Note"><textarea className={inputCls} style={{ ...inputStyle, minHeight: 60 }} value={note} onChange={(e) => setNote(e.target.value)} placeholder={job.scope} /></Field>

          <div className="rounded-lg p-3 mb-4 flex items-center justify-between" style={{ background: "#fff", border: `1.5px solid ${COLORS.line}` }}>
            <div className="text-[11px]" style={{ color: "#8A8F84" }}>
              <div className="mono">{hours.toFixed(2)} hrs · {days.toFixed(3)} days</div>
              <div>{catLabel(categories, worker.category)} rate {fmtMoney(worker.rate)}/day</div>
            </div>
            <div className="disp text-xl font-bold" style={{ color: COLORS.steel }}>{fmtMoney(cost)}</div>
          </div>

          <div className="flex gap-2">
            <button onClick={onClose} className="flex-1 py-2 rounded-md text-sm font-semibold" style={{ background: COLORS.paperDark, color: COLORS.steel }}>Cancel</button>
            <button
              onClick={() => onSubmit({
                id: genId("e"), jobId: job.id, workerId: worker.id, workerName: worker.name, category: worker.category,
                date, timeIn, timeOut, hours, days, cost, note, createdAt: Date.now(),
              })}
              disabled={hours <= 0}
              className="flex-1 py-2 rounded-md text-sm font-bold disp tracking-wide"
              style={{ background: hours > 0 ? COLORS.safety : "#D8DACB", color: COLORS.steelDark }}>
              SUBMIT ENTRY
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}
