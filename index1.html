/* ---------------------------------------------------------------------
   ATTENDANCE — date-wise & person-wise attendance register & leave log.
--------------------------------------------------------------------- */
function AttendancePanel({ workers, attendance, entries, categories, jobOrders, onClockIn, onClockOut, onAddAttendanceRecord, onDeleteEntry }) {
  const [selectedWorkerId, setSelectedWorkerId] = useState("all");
  const [dateMode, setDateMode] = useState("range");
  const [dateFrom, setDateFrom] = useState(todayISO());
  const [dateTo, setDateTo] = useState(todayISO());
  const [statusFilter, setStatusFilter] = useState("all");

  // Record Login Modal State
  const [showLoginModal, setShowLoginModal] = useState(false);
  const [modalWorkerId, setModalWorkerId] = useState(workers[0]?.id || "");
  const [modalDate, setModalDate] = useState(todayISO());
  const [modalLoginTime, setModalLoginTime] = useState(nowHHMM());
  const [modalLogoutTime, setModalLogoutTime] = useState("");
  const [modalIsOpenShift, setModalIsOpenShift] = useState(true);

  const handleSaveLoginModal = (e) => {
    e.preventDefault();
    if (!modalWorkerId) return;
    let hrs = null;
    let status = "open";
    if (!modalIsOpenShift && modalLogoutTime) {
      hrs = hoursBetween(modalLoginTime, modalLogoutTime);
      status = "closed";
    }
    if (onAddAttendanceRecord) {
      onAddAttendanceRecord({
        workerId: modalWorkerId,
        clockInDate: modalDate || todayISO(),
        clockInTime: modalLoginTime || "08:00",
        clockOutDate: !modalIsOpenShift ? (modalDate || todayISO()) : null,
        clockOutTime: !modalIsOpenShift ? modalLogoutTime : null,
        hours: hrs,
        status: status,
      });
    }
    setShowLoginModal(false);
  };

  const setPreset = (preset) => {
    const today = new Date();
    if (preset === "today") {
      const iso = todayISO();
      setDateMode("single");
      setDateFrom(iso);
      setDateTo(iso);
    } else if (preset === "yesterday") {
      const y = new Date(today);
      y.setDate(y.getDate() - 1);
      const iso = toLocalDateStr(y);
      setDateMode("single");
      setDateFrom(iso);
      setDateTo(iso);
    } else if (preset === "7days") {
      const past = new Date(today);
      past.setDate(past.getDate() - 6);
      setDateMode("range");
      setDateFrom(toLocalDateStr(past));
      setDateTo(todayISO());
    } else if (preset === "month") {
      const first = new Date(today.getFullYear(), today.getMonth(), 1);
      setDateMode("range");
      setDateFrom(toLocalDateStr(first));
      setDateTo(todayISO());
    }
  };

  const matrix = useMemo(() => {
    const parseLocalYMD = (s) => {
      if (!s) return new Date();
      const p = s.split("-");
      return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    };

    const effectiveTo = dateMode === "single" ? dateFrom : dateTo;
    const dates = [];
    let curr = parseLocalYMD(dateFrom || todayISO());
    const end = parseLocalYMD(effectiveTo || todayISO());

    if (isNaN(curr.getTime()) || isNaN(end.getTime()) || curr > end) {
      dates.push(dateFrom || todayISO());
    } else {
      while (curr <= end) {
        dates.push(toLocalDateStr(curr));
        curr.setDate(curr.getDate() + 1);
      }
    }

    const targetWorkers = selectedWorkerId === "all"
      ? workers
      : workers.filter((w) => w.id === selectedWorkerId);

    const rows = [];

    [...dates].reverse().forEach((date) => {
      targetWorkers.forEach((w) => {
        const att = (attendance.entries || []).find((a) => a.workerId === w.id && (a.clockInDate === date || (a.status === "open" && date === todayISO())));
        const jobLog = !att ? (entries || []).find((e) => e.workerId === w.id && e.date === date) : null;
        const assignedJob = (jobOrders || []).find((j) => j.workerIds.includes(w.id) && j.status !== "Completed")
          || (jobOrders || []).find((j) => j.workerIds.includes(w.id));

        let loginTime = "—";
        let logoutTime = "—";
        let hours = 0;
        let status = "Leave";
        let attId = att ? att.id : null;

        if (att) {
          loginTime = att.clockInTime || "—";
          logoutTime = att.clockOutTime ? `${att.clockOutDate !== att.clockInDate ? att.clockOutDate + " " : ""}${att.clockOutTime}` : "—";
          hours = att.hours != null ? att.hours : 0;
          status = att.status === "open" ? "On Shift" : "Present";
        } else if (jobLog) {
          loginTime = jobLog.timeIn || "—";
          logoutTime = jobLog.timeOut || "—";
          hours = jobLog.hours || 0;
          status = "Present (Job Logged)";
        } else if (w.availability === "On Leave") {
          status = "Leave (Approved)";
        }

        if (statusFilter === "present" && (status === "Leave" || status === "Leave (Approved)")) return;
        if (statusFilter === "on_shift" && status !== "On Shift") return;
        if (statusFilter === "leave" && status !== "Leave" && status !== "Leave (Approved)") return;

        rows.push({
          date,
          workerId: w.id,
          workerName: w.name,
          category: catLabel(categories, w.category),
          loginTime,
          logoutTime,
          hours,
          status,
          attId,
          hasLogin: !!(att || jobLog),
          assignedJob,
        });
      });
    });

    return rows;
  }, [workers, attendance.entries, entries, categories, jobOrders, selectedWorkerId, dateMode, dateFrom, dateTo, statusFilter]);

  const totalEvaluated = matrix.length;
  const presentCount = matrix.filter((m) => m.hasLogin).length;
  const onShiftCount = matrix.filter((m) => m.status === "On Shift").length;
  const leaveCount = matrix.filter((m) => !m.hasLogin).length;
  const totalHours = matrix.reduce((s, m) => s + m.hours, 0);

  const handleExport = () => {
    const wb = XLSX.utils.book_new();
    const exportRows = matrix.map((m) => ({
      "Date": m.date,
      "Worker Name": m.workerName,
      "Category": m.category,
      "Login Time": m.loginTime,
      "Logout Time": m.logoutTime,
      "Working Hours": Number(m.hours.toFixed(2)),
      "Attendance Status": m.status,
      "Assigned Service Request": m.assignedJob ? `#${m.assignedJob.jobOrderNo} - ${m.assignedJob.clientName}` : "None",
      "SR Status": m.assignedJob ? m.assignedJob.status : "—",
      "Scope & Area": m.assignedJob ? `${m.assignedJob.area}, ${m.assignedJob.emirates} · ${m.assignedJob.scope}` : "—",
    }));
    const ws1 = XLSX.utils.json_to_sheet(exportRows);
    XLSX.utils.book_append_sheet(wb, ws1, "Attendance Log");

    const summaryMap = {};
    workers.forEach((w) => {
      const wRows = matrix.filter((m) => m.workerId === w.id);
      const wPresent = wRows.filter((m) => m.hasLogin).length;
      const wLeave = wRows.filter((m) => !m.hasLogin).length;
      const wHrs = wRows.reduce((s, m) => s + m.hours, 0);
      summaryMap[w.name] = {
        "Worker Name": w.name,
        "Category": catLabel(categories, w.category),
        "Days Present": wPresent,
        "Days Leave (0 Login)": wLeave,
        "Total Hours": Number(wHrs.toFixed(2)),
      };
    });
    const ws2 = XLSX.utils.json_to_sheet(Object.values(summaryMap));
    XLSX.utils.book_append_sheet(wb, ws2, "Worker Summary");

    downloadWorkbook(wb, `attendance-matrix-${dateFrom}-to-${dateTo || dateFrom}.xlsx`);
  };

  return (
    <div>
      {/* FILTER CONTROLS BAR */}
      <div className="rounded-lg p-3.5 mb-4" style={{ background: COLORS.paperDark, border: `1.5px solid ${COLORS.line}` }}>
        <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
          <div className="disp text-sm font-bold tracking-wide flex items-center gap-1.5" style={{ color: COLORS.steel }}>
            <CalendarDays size={16} color={COLORS.steelLight} /> DATE-WISE ATTENDANCE & WORK SERVICE REQUEST REGISTER
          </div>
          <div className="flex items-center gap-1.5 flex-wrap">
            <button onClick={() => { setShowLoginModal(true); setModalWorkerId(workers[0]?.id || ""); setModalDate(dateFrom || todayISO()); setModalLoginTime(nowHHMM()); setModalIsOpenShift(true); setModalLogoutTime(""); }}
              className="disp flex items-center gap-1.5 px-3 py-1 rounded-md text-xs font-bold tracking-wide shadow-sm hover:opacity-90 cursor-pointer"
              style={{ background: COLORS.go, color: "#fff" }}>
              <UserCheck size={14} /> + RECORD LOGIN / CLOCK IN
            </button>
            <button onClick={() => { setPreset("today"); setSelectedWorkerId("all"); setStatusFilter("all"); }}
              className="disp flex items-center gap-1.5 px-3 py-1 rounded-md text-xs font-bold tracking-wide shadow-sm hover:opacity-90 cursor-pointer"
              style={{ background: COLORS.steel, color: "#fff" }}>
              <Clock size={13} color={COLORS.safety} /> TODAY'S WORK STATUS
            </button>
            {["yesterday", "7days", "month"].map((p) => (
              <button key={p} onClick={() => setPreset(p)}
                className="text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded bg-white hover:bg-gray-50 cursor-pointer"
                style={{ border: `1px solid ${COLORS.line}`, color: COLORS.steel }}>
                {p === "7days" ? "Last 7 Days" : p === "month" ? "This Month" : p}
              </button>
            ))}
            <button onClick={handleExport}
              className="disp flex items-center gap-1 px-3 py-1 rounded-md text-xs font-bold tracking-wide ml-1 hover:opacity-90 cursor-pointer"
              style={{ background: COLORS.safety, color: COLORS.steelDark }}>
              <Receipt size={13} /> EXPORT ATTENDANCE
            </button>
          </div>
        </div>

        <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
          {/* Per Person Filter */}
          <div>
            <label className="block text-[10px] font-bold uppercase tracking-wider mb-1" style={{ color: COLORS.steelLight }}>Filter Staff / Person</label>
            <select value={selectedWorkerId} onChange={(e) => setSelectedWorkerId(e.target.value)}
              className="w-full text-xs rounded px-2.5 py-1.5 bg-white font-medium" style={{ border: `1.5px solid ${COLORS.line}`, color: COLORS.ink }}>
              <option value="all">All Staff Members ({workers.length})</option>
              {workers.map((w) => <option key={w.id} value={w.id}>{w.name} ({catLabel(categories, w.category)})</option>)}
            </select>
          </div>

          {/* Date Filter Mode & Pickers */}
          <div>
            <div className="flex items-center justify-between mb-1">
              <label className="text-[10px] font-bold uppercase tracking-wider" style={{ color: COLORS.steelLight }}>Date Filter Mode</label>
              <div className="flex items-center gap-2">
                <button type="button" onClick={() => setDateMode("single")} className={`text-[10px] font-bold uppercase ${dateMode === "single" ? "text-blue-600 font-bold underline" : "text-gray-500"}`}>Single</button>
                <button type="button" onClick={() => setDateMode("range")} className={`text-[10px] font-bold uppercase ${dateMode === "range" ? "text-blue-600 font-bold underline" : "text-gray-500"}`}>Range</button>
              </div>
            </div>
            {dateMode === "single" ? (
              <input type="date" value={dateFrom} onChange={(e) => { setDateFrom(e.target.value); setDateTo(e.target.value); }}
                className="w-full text-xs rounded px-2 py-1.5 bg-white font-medium" style={{ border: `1.5px solid ${COLORS.line}`, color: COLORS.ink }} />
            ) : (
              <div className="flex items-center gap-1.5">
                <input type="date" value={dateFrom} onChange={(e) => setDateFrom(e.target.value)}
                  className="w-full text-xs rounded px-1.5 py-1.5 bg-white font-medium" style={{ border: `1.5px solid ${COLORS.line}`, color: COLORS.ink }} />
                <span className="text-xs" style={{ color: "#8A8F84" }}>to</span>
                <input type="date" value={dateTo} onChange={(e) => setDateTo(e.target.value)}
                  className="w-full text-xs rounded px-1.5 py-1.5 bg-white font-medium" style={{ border: `1.5px solid ${COLORS.line}`, color: COLORS.ink }} />
              </div>
            )}
          </div>

          {/* Status Filter */}
          <div>
            <label className="block text-[10px] font-bold uppercase tracking-wider mb-1" style={{ color: COLORS.steelLight }}>Status Filter</label>
            <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)}
              className="w-full text-xs rounded px-2.5 py-1.5 bg-white font-medium" style={{ border: `1.5px solid ${COLORS.line}`, color: COLORS.ink }}>
              <option value="all">All Statuses (Present & Leave)</option>
              <option value="present">Present Only (Logins & Job Logs)</option>
              <option value="on_shift">On Shift Only (Active Now)</option>
              <option value="leave">On Leave Only (0 Login)</option>
            </select>
          </div>

          {/* Reset Filters */}
          <div className="flex items-end">
            <button onClick={() => { setSelectedWorkerId("all"); setDateMode("range"); setDateFrom(todayISO()); setDateTo(todayISO()); setStatusFilter("all"); }}
              className="w-full text-xs font-semibold py-1.5 rounded-md text-center hover:bg-white cursor-pointer" style={{ background: COLORS.paper, border: `1.5px solid ${COLORS.line}`, color: COLORS.steel }}>
              Reset Filters
            </button>
          </div>
        </div>
      </div>

      {/* KPI METRICS STRIP */}
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-4">
        <div className="rounded-lg p-3 text-center" style={{ background: "#fff", border: `1.5px solid ${COLORS.line}` }}>
          <div className="text-[10px] font-bold uppercase tracking-wider text-gray-500">Evaluated Records</div>
          <div className="disp text-2xl font-bold" style={{ color: COLORS.steel }}>{totalEvaluated}</div>
          <div className="text-[10px]" style={{ color: "#8A8F84" }}>{matrix.length} date-person rows</div>
        </div>
        <div className="rounded-lg p-3 text-center" style={{ background: "#fff", border: `1.5px solid ${COLORS.go}` }}>
          <div className="text-[10px] font-bold uppercase tracking-wider" style={{ color: COLORS.go }}>Present / Logged In</div>
          <div className="disp text-2xl font-bold" style={{ color: COLORS.go }}>{presentCount}</div>
          <div className="text-[10px]" style={{ color: COLORS.go }}>{onShiftCount > 0 ? `${onShiftCount} active on shift` : "Valid logins"}</div>
        </div>
        <div className="rounded-lg p-3 text-center" style={{ background: "#fff", border: `1.5px solid ${COLORS.urgent}` }}>
          <div className="text-[10px] font-bold uppercase tracking-wider" style={{ color: COLORS.urgent }}>On Leave (0 Login)</div>
          <div className="disp text-2xl font-bold" style={{ color: COLORS.urgent }}>{leaveCount}</div>
          <div className="text-[10px]" style={{ color: COLORS.urgent }}>No login activity</div>
        </div>
        <div className="rounded-lg p-3 text-center" style={{ background: "#fff", border: `1.5px solid ${COLORS.line}` }}>
          <div className="text-[10px] font-bold uppercase tracking-wider text-gray-500">Total Shift Hours</div>
          <div className="disp text-2xl font-bold mono" style={{ color: COLORS.steel }}>{totalHours.toFixed(1)}h</div>
          <div className="text-[10px]" style={{ color: "#8A8F84" }}>Logged in period</div>
        </div>
      </div>

      {/* ATTENDANCE TABLE */}
      <div className="rounded-lg overflow-hidden mb-6" style={{ border: `1.5px solid ${COLORS.line}` }}>
        <div className="overflow-x-auto">
          <table className="w-full text-xs">
            <thead>
              <tr style={{ background: COLORS.steelDark, color: "#fff" }} className="disp tracking-wide">
                <th className="text-left px-3 py-2.5 font-semibold">DATE</th>
                <th className="text-left px-3 py-2.5 font-semibold">WORKER / STAFF</th>
                <th className="text-left px-3 py-2.5 font-semibold">CATEGORY</th>
                <th className="text-left px-3 py-2.5 font-semibold">LOGIN TIME</th>
                <th className="text-left px-3 py-2.5 font-semibold">LOGOUT TIME</th>
                <th className="text-left px-3 py-2.5 font-semibold">HOURS</th>
                <th className="text-left px-3 py-2.5 font-semibold">ATTENDANCE STATUS</th>
                <th className="text-left px-3 py-2.5 font-semibold">ASSIGNED SERVICE REQUEST / WORK STATUS</th>
                <th className="text-right px-3 py-2.5 font-semibold">ACTION</th>
              </tr>
            </thead>
            <tbody>
              {matrix.length === 0 && (
                <tr>
                  <td colSpan={9} className="text-center py-8" style={{ color: "#8A8F84" }}>
                    No attendance records match the selected person and date range.
                  </td>
                </tr>
              )}
              {matrix.map((m, i) => (
                <tr key={`${m.workerId}-${m.date}`} style={{ background: i % 2 ? "#fff" : COLORS.paper, borderTop: `1px solid ${COLORS.line}` }}>
                  <td className="px-3 py-2.5 font-bold mono whitespace-nowrap">{m.date}</td>
                  <td className="px-3 py-2.5 font-semibold text-sm">{m.workerName}</td>
                  <td className="px-3 py-2.5 text-gray-500 font-medium">{m.category}</td>
                  <td className="px-3 py-2.5 mono font-semibold">{m.loginTime}</td>
                  <td className="px-3 py-2.5 mono font-semibold">{m.logoutTime}</td>
                  <td className="px-3 py-2.5 mono font-bold text-sm" style={{ color: m.hours > 0 ? COLORS.steel : "#8A8F84" }}>
                    {m.hours > 0 ? `${m.hours.toFixed(2)} h` : "0.0 h"}
                  </td>
                  <td className="px-3 py-2.5 whitespace-nowrap">
                    {m.status === "On Shift" && (
                      <span className="inline-flex items-center gap-1.5 text-[11px] font-bold px-2.5 py-0.5 rounded-full" style={{ background: "#E4F1E9", color: COLORS.go }}>
                        <span className="w-2 h-2 rounded-full animate-pulse" style={{ background: COLORS.go }} /> On Shift
                      </span>
                    )}
                    {m.status === "Present" && (
                      <span className="inline-flex items-center gap-1 text-[11px] font-bold px-2.5 py-0.5 rounded-full" style={{ background: "#E4F1E9", color: COLORS.go }}>
                        <Check size={12} /> Present
                      </span>
                    )}
                    {m.status === "Present (Job Logged)" && (
                      <span className="inline-flex items-center gap-1 text-[11px] font-bold px-2.5 py-0.5 rounded-full" style={{ background: "#FBF0DD", color: COLORS.amber }}>
                        <Clock size={12} /> Present (Job Log)
                      </span>
                    )}
                    {(m.status === "Leave" || m.status === "Leave (Approved)") && (
                      <span className="inline-flex items-center gap-1 text-[11px] font-bold px-2.5 py-0.5 rounded-full" style={{ background: "#FBEAEA", color: COLORS.urgent }}>
                        <X size={12} /> Leave (0 Login)
                      </span>
                    )}
                  </td>
                  <td className="px-3 py-2.5">
                    {m.assignedJob && m.hasLogin ? (
                      <div>
                        <div className="font-bold text-[12px] flex items-center gap-1.5 whitespace-nowrap" style={{ color: COLORS.steel }}>
                          <span>#{m.assignedJob.jobOrderNo}</span>
                          <span>—</span>
                          <span>{m.assignedJob.clientName}</span>
                          <span className="text-[10px] font-semibold px-1.5 py-0.2 rounded" style={{
                            color: m.assignedJob.status === "In Progress" ? COLORS.amber : m.assignedJob.status === "Completed" ? COLORS.go : COLORS.steel,
                            background: m.assignedJob.status === "In Progress" ? "#FBF0DD" : m.assignedJob.status === "Completed" ? "#E4F1E9" : "#E7ECEF"
                          }}>
                            {m.assignedJob.status}
                          </span>
                        </div>
                        <div className="text-[10px] truncate max-w-[240px]" style={{ color: "#8A8F84" }}>
                          {m.assignedJob.area}, {m.assignedJob.emirates} · {m.assignedJob.scope}
                        </div>
                      </div>
                    ) : (
                      <span className="text-[11px] italic" style={{ color: "#8A8F84" }}>
                        {m.hasLogin ? "No active SR assigned" : "No SR (On Leave)"}
                      </span>
                    )}
                  </td>
                  <td className="px-3 py-2.5 text-right whitespace-nowrap">
                    <div className="flex items-center justify-end gap-1.5">
                      {m.status === "On Shift" && (
                        <button
                          onClick={() => {
                            const worker = workers.find((w) => w.id === m.workerId);
                            if (worker && onClockOut) onClockOut(worker);
                          }}
                          className="disp flex items-center gap-1 px-2.5 py-1 rounded text-[11px] font-bold shadow-xs transition-all hover:opacity-90 cursor-pointer"
                          style={{ background: COLORS.urgent, color: "#fff" }}
                          title="Clock out technician from active shift"
                        >
                          <LogOut size={12} /> Clock Out
                        </button>
                      )}
                      {(m.status === "Leave" || m.status === "Leave (Approved)") && (
                        <button
                          onClick={() => {
                            const worker = workers.find((w) => w.id === m.workerId);
                            if (worker && onClockIn) onClockIn(worker);
                          }}
                          className="disp flex items-center gap-1 px-2.5 py-1 rounded text-[11px] font-bold shadow-xs transition-all hover:opacity-90 cursor-pointer"
                          style={{ background: COLORS.go, color: "#fff" }}
                          title="Clock in technician now"
                        >
                          <LogIn size={12} /> Clock In
                        </button>
                      )}
                      {m.attId && (
                        <button
                          onClick={() => {
                            if (window.confirm(`Delete clock entry for ${m.workerName} on ${m.date}?`)) onDeleteEntry(m.attId);
                          }}
                          className="p-1 rounded text-red-600 hover:bg-red-50 cursor-pointer"
                          title="Delete clock entry"
                        >
                          <X size={14} />
                        </button>
                      )}
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {/* RECORD LOGIN / CLOCK IN MODAL */}
      {showLoginModal && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-xs">
          <div className="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden" style={{ border: `2px solid ${COLORS.steel}` }}>
            <div className="px-5 py-3.5 flex items-center justify-between" style={{ background: COLORS.steelDark, color: "#fff" }}>
              <div className="disp font-bold text-sm tracking-wide flex items-center gap-2">
                <UserCheck size={18} color={COLORS.safety} /> RECORD STAFF LOGIN / CLOCK IN
              </div>
              <button onClick={() => setShowLoginModal(false)} className="text-gray-300 hover:text-white cursor-pointer">
                <X size={18} />
              </button>
            </div>

            <form onSubmit={handleSaveLoginModal} className="p-5 space-y-4 text-xs">
              <div>
                <label className="block font-bold uppercase tracking-wider text-[10px] mb-1" style={{ color: COLORS.steelLight }}>
                  Select Staff / Worker <span className="text-red-500">*</span>
                </label>
                <select
                  value={modalWorkerId}
                  onChange={(e) => setModalWorkerId(e.target.value)}
                  className="w-full text-xs rounded px-3 py-2 bg-white font-semibold"
                  style={{ border: `1.5px solid ${COLORS.line}`, color: COLORS.ink }}
                  required
                >
                  {workers.map((w) => (
                    <option key={w.id} value={w.id}>
                      {w.name} — {catLabel(categories, w.category)}
                    </option>
                  ))}
                </select>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block font-bold uppercase tracking-wider text-[10px] mb-1" style={{ color: COLORS.steelLight }}>
                    Login Date
                  </label>
                  <input
                    type="date"
                    value={modalDate}
                    onChange={(e) => setModalDate(e.target.value)}
                    className="w-full text-xs rounded px-2.5 py-2 font-medium"
                    style={{ border: `1.5px solid ${COLORS.line}`, color: COLORS.ink }}
                    required
                  />
                </div>
                <div>
                  <label className="block font-bold uppercase tracking-wider text-[10px] mb-1" style={{ color: COLORS.steelLight }}>
                    Login Time (Clock In)
                  </label>
                  <input
                    type="time"
                    value={modalLoginTime}
                    onChange={(e) => setModalLoginTime(e.target.value)}
                    className="w-full text-xs rounded px-2.5 py-2 font-mono font-semibold"
                    style={{ border: `1.5px solid ${COLORS.line}`, color: COLORS.ink }}
                    required
                  />
                </div>
              </div>

              {/* Shift Status Options */}
              <div className="p-3 rounded-lg bg-gray-50" style={{ border: `1px solid ${COLORS.line}` }}>
                <label className="block font-bold uppercase tracking-wider text-[10px] mb-2" style={{ color: COLORS.steelLight }}>
                  Shift Mode
                </label>
                <div className="flex items-center gap-4">
                  <label className="flex items-center gap-1.5 font-semibold text-xs cursor-pointer">
                    <input
                      type="radio"
                      name="shiftType"
                      checked={modalIsOpenShift}
                      onChange={() => setModalIsOpenShift(true)}
                    />
                    <span className="text-emerald-700 font-bold">Currently On Shift (Open Login)</span>
                  </label>
                  <label className="flex items-center gap-1.5 font-semibold text-xs cursor-pointer">
                    <input
                      type="radio"
                      name="shiftType"
                      checked={!modalIsOpenShift}
                      onChange={() => setModalIsOpenShift(false)}
                    />
                    <span>Completed Shift (Clock Out)</span>
                  </label>
                </div>

                {!modalIsOpenShift && (
                  <div className="mt-3 pt-3 border-t border-gray-200">
                    <label className="block font-bold uppercase tracking-wider text-[10px] mb-1" style={{ color: COLORS.steelLight }}>
                      Logout Time (Clock Out)
                    </label>
                    <input
                      type="time"
                      value={modalLogoutTime}
                      onChange={(e) => setModalLogoutTime(e.target.value)}
                      className="w-full text-xs rounded px-2.5 py-1.5 font-mono font-semibold"
                      style={{ border: `1.5px solid ${COLORS.line}`, color: COLORS.ink }}
                      required={!modalIsOpenShift}
                    />
                  </div>
                )}
              </div>

              <div className="pt-2 flex items-center justify-end gap-2">
                <button
                  type="button"
                  onClick={() => setShowLoginModal(false)}
                  className="px-4 py-2 rounded-md font-semibold text-xs cursor-pointer"
                  style={{ background: COLORS.paper, border: `1.5px solid ${COLORS.line}`, color: COLORS.steel }}
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  className="disp px-5 py-2 rounded-md font-bold text-xs shadow-sm flex items-center gap-1.5 cursor-pointer"
                  style={{ background: COLORS.go, color: "#fff" }}
                >
                  <UserCheck size={15} /> SAVE LOGIN ENTRY
                </button>
              </div>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}

function StaffPanel({ workers, categories, vehicles, jobOrders, onUpdateWorker, onUpdateVehicle }) {
  const counts = AVAILABILITY.reduce((acc, a) => { acc[a.id] = 0; return acc; }, {});
  workers.forEach((w) => { const s = computeWorkerStatus(w, jobOrders); counts[s] = (counts[s] || 0) + 1; });
  const vCounts = VEHICLE_STATUS.reduce((acc, s) => { acc[s.id] = 0; return acc; }, {});
  vehicles.forEach((v) => { const s = computeVehicleStatus(v, jobOrders); vCounts[s] = (vCounts[s] || 0) + 1; });

  return (
    <div>
      <div className="flex items-center justify-between mb-1">
        <div className="disp text-sm font-bold tracking-wide flex items-center gap-1.5" style={{ color: COLORS.steelLight }}><User size={14} /> STAFF</div>
        <button onClick={() => exportAvailabilityReport(workers, vehicles, categories, jobOrders)}
          className="disp flex items-center gap-1.5 px-3 py-1.5 rounded-md text-sm font-bold tracking-wide"
          style={{ background: COLORS.safety, color: COLORS.steelDark }}>
          <Receipt size={14} /> EXPORT AVAILABILITY
        </button>
      </div>
      <div className="text-[11px] mb-2" style={{ color: "#8A8F84" }}>"Available" / "On Job" are automatic, based on active job cards. Set Busy / On Leave / Unavailable by hand when it's not job-related.</div>
      <div className="flex flex-wrap gap-2 mb-4">
        {AVAILABILITY.map((a) => (
          <span key={a.id} className="text-[11px] font-semibold px-2.5 py-1 rounded-full flex items-center gap-1.5" style={{ background: "#fff", border: `1.5px solid ${a.color}`, color: a.color }}>
            <span className="w-1.5 h-1.5 rounded-full" style={{ background: a.color }} /> {counts[a.id] || 0} {a.id}
          </span>
        ))}
      </div>
      <div className="grid gap-2 mb-6" style={{ gridTemplateColumns: "repeat(auto-fill, minmax(250px, 1fr))" }}>
        {workers.length === 0 && <EmptyState text="No workers in the roster yet." />}
        {workers.map((w) => {
          const status = computeWorkerStatus(w, jobOrders);
          const isOverride = w.availability && WORKER_OVERRIDES.includes(w.availability);
          const inactive = w.active === false;
          return (
            <div key={w.id} className="rounded-lg p-3" style={{ background: "#fff", border: `1.5px solid ${COLORS.line}`, opacity: inactive ? 0.55 : 1 }}>
              <div className="flex items-center justify-between mb-2">
                <div>
                  <div className="text-sm font-semibold">{w.name}{inactive && <span className="text-[10px] font-semibold ml-1.5 px-1.5 py-0.5 rounded" style={{ color: COLORS.urgent, background: "#F3E3E3" }}>Inactive</span>}</div>
                  <div className="text-[11px]" style={{ color: "#8A8F84" }}>{catLabel(categories, w.category)}</div>
                </div>
                <span className="text-[10px] font-semibold px-2 py-0.5 rounded-full flex items-center gap-1" style={{ color: availabilityMeta(status).color, background: `${availabilityMeta(status).color}1A` }}>
                  <span className="w-1.5 h-1.5 rounded-full" style={{ background: availabilityMeta(status).color }} /> {status}
                </span>
              </div>
              <div className="flex flex-wrap gap-1">
                <button onClick={() => onUpdateWorker(w.id, { availability: null })}
                  className="text-[10px] font-semibold px-2 py-1 rounded-md"
                  style={{ background: !isOverride ? COLORS.steel : COLORS.paper, color: !isOverride ? "#fff" : "#5C665C" }}>
                  Auto
                </button>
                {WORKER_OVERRIDES.map((id) => (
                  <button key={id} onClick={() => onUpdateWorker(w.id, { availability: id })}
                    className="text-[10px] font-semibold px-2 py-1 rounded-md"
                    style={{ background: w.availability === id ? availabilityMeta(id).color : COLORS.paper, color: w.availability === id ? "#fff" : "#5C665C" }}>
                    {id}
                  </button>
                ))}
              </div>
            </div>
          );
        })}
      </div>

      <div className="disp text-sm font-bold tracking-wide mb-1 flex items-center gap-1.5" style={{ color: COLORS.steelLight }}><Truck size={14} /> FLEET</div>
      <div className="text-[11px] mb-2" style={{ color: "#8A8F84" }}>"Scheduled" / "In Use" are automatic, based on the job card a vehicle is assigned to. Set Maintenance / Out of Service by hand.</div>
      <div className="flex flex-wrap gap-2 mb-4">
        {VEHICLE_STATUS.map((s) => (
          <span key={s.id} className="text-[11px] font-semibold px-2.5 py-1 rounded-full flex items-center gap-1.5" style={{ background: "#fff", border: `1.5px solid ${s.color}`, color: s.color }}>
            <span className="w-1.5 h-1.5 rounded-full" style={{ background: s.color }} /> {vCounts[s.id] || 0} {s.id}
          </span>
        ))}
      </div>
      <div className="grid gap-2" style={{ gridTemplateColumns: "repeat(auto-fill, minmax(250px, 1fr))" }}>
        {vehicles.length === 0 && <EmptyState text="No vehicles in the roster yet." />}
        {vehicles.map((v) => {
          const status = computeVehicleStatus(v, jobOrders);
          const isOverride = v.status && VEHICLE_OVERRIDES.includes(v.status);
          const job = jobOrders.find((j) => j.vehicleId === v.id && j.status !== "Completed");
          const inactive = v.active === false;
          return (
            <div key={v.id} className="rounded-lg p-3" style={{ background: "#fff", border: `1.5px solid ${COLORS.line}`, opacity: inactive ? 0.55 : 1 }}>
              <div className="flex items-center justify-between mb-1">
                <div className="text-sm font-semibold flex items-center gap-1.5">
                  <Truck size={13} color={COLORS.steelLight} /> {v.name}
                  {inactive && <span className="text-[10px] font-semibold px-1.5 py-0.5 rounded" style={{ color: COLORS.urgent, background: "#F3E3E3" }}>Inactive</span>}
                </div>
                <span className="text-[10px] font-semibold px-2 py-0.5 rounded-full flex items-center gap-1" style={{ color: vehicleStatusMeta(status).color, background: `${vehicleStatusMeta(status).color}1A` }}>
                  <span className="w-1.5 h-1.5 rounded-full" style={{ background: vehicleStatusMeta(status).color }} /> {status}
                </span>
              </div>
              {job && <div className="text-[11px] mb-2" style={{ color: "#8A8F84" }}>#{job.jobOrderNo} — {job.clientName}</div>}
              <div className="flex flex-wrap gap-1">
                <button onClick={() => onUpdateVehicle(v.id, { status: null })}
                  className="text-[10px] font-semibold px-2 py-1 rounded-md"
                  style={{ background: !isOverride ? COLORS.steel : COLORS.paper, color: !isOverride ? "#fff" : "#5C665C" }}>
                  Auto
                </button>
                {VEHICLE_OVERRIDES.map((id) => (
                  <button key={id} onClick={() => onUpdateVehicle(v.id, { status: id })}
                    className="text-[10px] font-semibold px-2 py-1 rounded-md"
                    style={{ background: v.status === id ? vehicleStatusMeta(id).color : COLORS.paper, color: v.status === id ? "#fff" : "#5C665C" }}>
                    {id}
                  </button>
                ))}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------
   AMC MASTER PANEL
--------------------------------------------------------------------- */
function AmcMasterPanel({ amcContracts, jobOrders, onAddContract, onUpdateContract }) {
  const [modal, setModal] = useState(null); // "new" or amc object
  const [search, setSearch] = useState("");

  const filtered = amcContracts.filter((a) =>
    a.refNo.toLowerCase().includes(search.toLowerCase()) ||
    a.clientName.toLowerCase().includes(search.toLowerCase())
  );

  return (
    <div>
      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
        <div className="relative max-w-xs w-full flex-1">
          <div className="absolute left-3 top-1/2 -translate-y-1/2 opacity-50"><Search size={14} /></div>
          <input type="text" placeholder="Search AMC contracts..." value={search} onChange={(e) => setSearch(e.target.value)}
            className="w-full pl-9 pr-4 py-2 rounded-lg text-sm bg-white shadow-sm" style={{ border: `1.5px solid ${COLORS.line}` }} />
        </div>
        <button onClick={() => setModal("new")} className="disp flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-bold tracking-wide shadow-sm text-white" style={{ background: COLORS.go }}>
          <Plus size={16} /> ADD AMC
        </button>
      </div>

      <div className="grid gap-3">
        {filtered.length === 0 && <EmptyState text="No AMC contracts found." />}
        {filtered.map((amc) => {
          // Count SRs
          const srs = jobOrders.filter((j) => j.amcRefNo === amc.refNo || (j.amc && j.projectNo === amc.refNo));
          const completed = srs.filter((j) => j.status === "Completed").length;
          const pendingAlloc = srs.filter((j) => j.status === "Pending Allocation" || (j.workerIds.length === 0 && j.status !== "Completed")).length;
          const assigned = srs.length - completed - pendingAlloc;

          return (
            <div key={amc.id} className="p-4 rounded-xl shadow-sm bg-white relative group" style={{ border: `1.5px solid ${COLORS.line}` }}>
              <div className="flex justify-between items-start mb-2">
                <div>
                  <div className="text-[11px] font-bold tracking-wider" style={{ color: COLORS.steel }}>{amc.refNo}</div>
                  <div className="text-lg font-bold disp leading-tight">{amc.clientName}</div>
                </div>
                <button onClick={() => setModal(amc)} className="opacity-0 group-hover:opacity-100 transition-opacity p-1.5 rounded bg-gray-100 text-gray-600 hover:bg-gray-200">
                  <Settings2 size={14} />
                </button>
              </div>

              <div className="flex flex-wrap gap-4 text-sm mt-3 pb-3 border-b" style={{ borderColor: COLORS.line }}>
                <div><span className="text-[10px] uppercase font-bold text-gray-500 block">Period</span>
                  {amc.startDate} to {amc.endDate}
                </div>
                <div><span className="text-[10px] uppercase font-bold text-gray-500 block">Inv Freq</span>
                  {amc.invoiceFrequency}
                </div>
                <div><span className="text-[10px] uppercase font-bold text-gray-500 block">Services/Yr</span>
                  {amc.servicesPerYear}
                </div>
                <div><span className="text-[10px] uppercase font-bold text-gray-500 block">Per Indoor/Outdoor</span>
                  {amc.servicesPerIndoorUnit} / {amc.servicesPerOutdoorUnit}
                </div>
              </div>

              <div className="flex gap-4 pt-3 text-[11px] font-semibold text-gray-600">
                <div className="flex items-center gap-1"><Ticket size={13} color={COLORS.steel} /> {srs.length} Total SRs</div>
                <div className="flex items-center gap-1"><Check size={13} color={COLORS.go} /> {completed} Completed</div>
                <div className="flex items-center gap-1"><User size={13} color={COLORS.safety} /> {assigned} Assigned</div>
                <div className="flex items-center gap-1"><AlertCircle size={13} color={pendingAlloc > 0 ? COLORS.urgent : COLORS.steelLight} /> {pendingAlloc} Pending Allocation</div>
              </div>
            </div>
          );
        })}
      </div>

      {modal && (
        <AmcModal
          amc={modal === "new" ? null : modal}
          onClose={() => setModal(null)}
          onSave={(data) => {
            if (modal === "new") onAddContract({ id: genId("amc"), ...data });
            else onUpdateContract(modal.id, data);
            setModal(null);
          }}
        />
      )}
    </div>
  );
}

function AmcModal({ amc, onClose, onSave }) {
  const [form, setForm] = useState(amc || {
    refNo: "", clientName: "", startDate: todayISO(), endDate: "",
    servicesPerYear: "4", servicesPerIndoorUnit: "4", servicesPerOutdoorUnit: "2",
    invoiceFrequency: "Quarterly"
  });
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));

  const inputCls = "w-full rounded px-2.5 py-1.5 text-sm";
  const inputStyle = { border: `1.5px solid ${COLORS.line}`, background: "#fff", color: COLORS.steelDark };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(20,25,20,0.5)" }}>
      <div className="w-full max-w-md rounded-xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]" style={{ background: COLORS.paper }}>
        <div className="px-5 py-4 flex items-center justify-between flex-shrink-0" style={{ background: COLORS.steelDark }}>
          <div className="disp text-white font-bold text-base tracking-wide flex items-center gap-2">
            <Briefcase size={18} color={COLORS.safety} /> {amc ? "EDIT AMC" : "NEW AMC CONTRACT"}
          </div>
          <button onClick={onClose}><X size={18} color="#fff" /></button>
        </div>
        <div className="p-5 overflow-y-auto">
          <Field label="AMC Ref No"><input type="text" className={inputCls} style={inputStyle} value={form.refNo} onChange={(e) => set("refNo", e.target.value)} placeholder="AMC-2026-001" /></Field>
          <Field label="Client Name"><input type="text" className={inputCls} style={inputStyle} value={form.clientName} onChange={(e) => set("clientName", e.target.value)} /></Field>
          <div className="grid grid-cols-2 gap-4">
            <Field label="Start Date"><input type="date" className={inputCls} style={inputStyle} value={form.startDate} onChange={(e) => set("startDate", e.target.value)} /></Field>
            <Field label="End Date"><input type="date" className={inputCls} style={inputStyle} value={form.endDate} onChange={(e) => set("endDate", e.target.value)} /></Field>
          </div>
          <div className="grid grid-cols-2 gap-4">
            <Field label="Services Per Year"><input type="number" min="1" className={inputCls} style={inputStyle} value={form.servicesPerYear} onChange={(e) => set("servicesPerYear", e.target.value)} /></Field>
            <Field label="Invoice Freq">
              <select className={inputCls} style={inputStyle} value={form.invoiceFrequency} onChange={(e) => set("invoiceFrequency", e.target.value)}>
                <option value="Monthly">Monthly</option>
                <option value="Quarterly">Quarterly</option>
                <option value="Semi-Annually">Semi-Annually</option>
                <option value="Annually">Annually</option>
              </select>
            </Field>
          </div>
          <div className="grid grid-cols-2 gap-4">
            <Field label="Serv. / Indoor Unit"><input type="number" min="1" className={inputCls} style={inputStyle} value={form.servicesPerIndoorUnit} onChange={(e) => set("servicesPerIndoorUnit", e.target.value)} /></Field>
            <Field label="Serv. / Outdoor Unit"><input type="number" min="1" className={inputCls} style={inputStyle} value={form.servicesPerOutdoorUnit} onChange={(e) => set("servicesPerOutdoorUnit", e.target.value)} /></Field>
          </div>
          
          <div className="flex gap-2 pt-3 mt-2 border-t" style={{ borderColor: COLORS.line }}>
            <button onClick={onClose} className="flex-1 py-2 rounded-lg text-sm font-semibold" style={{ background: COLORS.paperDark, color: COLORS.steel }}>Cancel</button>
            <button onClick={() => form.refNo && onSave(form)} className="flex-1 py-2 rounded-lg text-sm font-bold disp tracking-wide shadow-sm" style={{ background: COLORS.safety, color: COLORS.steelDark, opacity: form.refNo ? 1 : 0.5 }}>SAVE</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------
   PETTY CASH
--------------------------------------------------------------------- */
function PettyCashPanel({ workers, categories, jobOrders, cash, onAddCashEntry, onAddTransfer, onUpdateCashEntry, onDeleteCashEntry }) {
  const [expandedId, setExpandedId] = useState(null);
  const [modal, setModal] = useState(null); // { type, workerId }
  const [editEntry, setEditEntry] = useState(null);
  const [dateFrom, setDateFrom] = useState("");
  const [dateTo, setDateTo] = useState("");
  const [postedFilter, setPostedFilter] = useState("all"); // all | tally posted | not posted
  const dateFilterActive = !!dateFrom || !!dateTo || postedFilter !== "all";

  const totalBalance = workers.reduce((s, w) => s + workerCashBalance(w.id, cash.entries), 0);
  const sumByType = (type) => cash.entries.filter((e) => e.type === type).reduce((s, e) => s + Number(e.amount || 0), 0);
  const totalTopups = sumByType("topup");
  const totalIncome = sumByType("income");
  const totalExpenses = sumByType("expense");

  const passesFilter = (e) => {
    if (dateFrom && (e.date || "") < dateFrom) return false;
    if (dateTo && (e.date || "") > dateTo) return false;
    if (postedFilter === "tally posted" && !e.postedToFinance) return false;
    if (postedFilter === "not posted" && e.postedToFinance) return false;
    return true;
  };
  const filteredEntries = cash.entries.filter(passesFilter);

  return (
    <div>
      {/* filter bar — also drives what "Download Report" exports */}
      <div className="flex flex-wrap items-center gap-2 mb-4 p-2.5 rounded-lg" style={{ background: COLORS.paperDark }}>
        <span className="text-[10px] font-semibold uppercase tracking-wide mr-1" style={{ color: COLORS.steelLight }}>Filter:</span>
        <input type="date" value={dateFrom} onChange={(e) => setDateFrom(e.target.value)}
          className="text-[11px] rounded px-2 py-1" style={{ border: `1.5px solid ${COLORS.line}`, color: COLORS.steel, background: "#fff" }} />
        <span className="text-[11px]" style={{ color: "#8A8F84" }}>to</span>
        <input type="date" value={dateTo} onChange={(e) => setDateTo(e.target.value)}
          className="text-[11px] rounded px-2 py-1" style={{ border: `1.5px solid ${COLORS.line}`, color: COLORS.steel, background: "#fff" }} />
        {["all", "tally posted", "not posted"].map((f) => (
          <button key={f} onClick={() => setPostedFilter(f)}
            className="text-[11px] font-semibold px-2.5 py-1 rounded-full capitalize"
            style={{ background: postedFilter === f ? COLORS.steel : "#fff", color: postedFilter === f ? "#fff" : COLORS.steel, border: `1.5px solid ${COLORS.steel}` }}>
            {f}
          </button>
        ))}
        {dateFilterActive && (
          <button onClick={() => { setDateFrom(""); setDateTo(""); setPostedFilter("all"); }}
            className="text-[11px] font-semibold px-2.5 py-1 rounded-full" style={{ color: COLORS.urgent, border: `1.5px solid ${COLORS.urgent}` }}>
            Clear
          </button>
        )}
        <span className="text-[11px] ml-auto" style={{ color: "#8A8F84" }}>{filteredEntries.length} of {cash.entries.length} entries</span>
        <button onClick={() => exportPettyCashReport(workers, cash, dateFilterActive ? filteredEntries : undefined)}
          className="disp flex items-center gap-1.5 px-3 py-1.5 rounded-md text-sm font-bold tracking-wide"
          style={{ background: COLORS.safety, color: COLORS.steelDark }}>
          <Receipt size={14} /> DOWNLOAD REPORT
        </button>
      </div>

      {workers.length === 0 && <EmptyState text="No workers in the roster yet." />}

      {/* company-wide total, same balance-card treatment as each individual gets in Field */}
      <div className="rounded-lg p-4 mb-4" style={{ background: COLORS.steelDark }}>
        <div className="text-center mb-3">
          <div className="text-[11px] uppercase tracking-widest text-white/50 mb-1">Total Petty Cash Held (All Workers)</div>
          <div className="disp text-3xl font-bold" style={{ color: totalBalance < 0 ? COLORS.urgent : COLORS.safety }}>{fmtMoney(totalBalance)}</div>
        </div>
        <div className="grid grid-cols-3 gap-2 pt-3" style={{ borderTop: "1px solid rgba(255,255,255,0.15)" }}>
          <div className="text-center">
            <div className="mono text-sm font-bold" style={{ color: COLORS.go }}>+{fmtMoney(totalTopups)}</div>
            <div className="text-[10px] text-white/50 uppercase tracking-wide">Top-ups</div>
          </div>
          <div className="text-center">
            <div className="mono text-sm font-bold" style={{ color: COLORS.go }}>+{fmtMoney(totalIncome)}</div>
            <div className="text-[10px] text-white/50 uppercase tracking-wide">Income</div>
          </div>
          <div className="text-center">
            <div className="mono text-sm font-bold" style={{ color: COLORS.urgent }}>−{fmtMoney(totalExpenses)}</div>
            <div className="text-[10px] text-white/50 uppercase tracking-wide">Expenses</div>
          </div>
        </div>
      </div>

      <div className="grid gap-2">
        {workers.map((w) => {
          const balance = workerCashBalance(w.id, cash.entries); // always the TRUE balance, never affected by the filter above
          const myEntries = filteredEntries.filter((e) => e.workerId === w.id).sort((a, b) => b.createdAt - a.createdAt);
          const open = expandedId === w.id;
          return (
            <div key={w.id} className="rounded-lg" style={{ background: "#fff", border: `1.5px solid ${COLORS.line}` }}>
              <button onClick={() => setExpandedId(open ? null : w.id)} className="w-full flex items-center justify-between p-3">
                <div className="text-left">
                  <div className="text-sm font-semibold">{w.name} <span className="text-[11px] font-normal" style={{ color: "#8A8F84" }}>{catLabel(categories, w.category)}</span></div>
                  <div className="text-[11px]" style={{ color: "#8A8F84" }}>{myEntries.length} shown{dateFilterActive ? ` (filtered)` : ""}</div>
                </div>
                <div className="flex items-center gap-3">
                  <span className="mono text-sm font-bold" style={{ color: balance < 0 ? COLORS.urgent : COLORS.ink }}>{fmtMoney(balance)}</span>
                  <ChevronRight size={14} style={{ transform: open ? "rotate(90deg)" : "none", transition: "transform 0.15s" }} />
                </div>
              </button>
              {open && (
                <div className="px-3 pb-3">
                  <div className="grid gap-1.5 mb-2">
                    {myEntries.length === 0 && <div className="text-[12px] py-2" style={{ color: "#8A8F84" }}>No transactions match this filter.</div>}
                    {myEntries.map((e) => {
                      const meta = CASH_TYPES[e.type];
                      return (
                        <div key={e.id} className="flex items-center justify-between gap-2 text-[12px] py-2 flex-wrap perf">
                          <div className="min-w-[130px]">
                            <div>
                              <span className="mono opacity-60 mr-1.5">{e.ref}</span>
                              {meta.label}{e.projectNo ? ` · ${e.projectNo}` : ""}
                              {e.receipt && <Paperclip size={10} className="inline ml-1 -mt-0.5" color={COLORS.steel} />}
                            </div>
                            <div className="text-[10px]" style={{ color: "#8A8F84" }}>{e.date}</div>
                          </div>
                          <Switch checked={!!e.postedToFinance} onChange={(v) => onUpdateCashEntry(e.id, { postedToFinance: v })} label={e.postedToFinance ? "Tally Posted" : "Not Posted"} />
                          <span className="mono font-semibold" style={{ color: meta.sign > 0 ? COLORS.go : COLORS.urgent }}>
                            {meta.sign > 0 ? "+" : "−"}{fmtMoney(e.amount)}
                          </span>
                          {/* Admin-only — this panel only renders on the Dispatch side */}
                          <div className="flex items-center gap-2">
                            <button onClick={() => setEditEntry(e)} title="Edit entry"><Settings2 size={13} color={COLORS.steel} /></button>
                            <button onClick={() => { if (window.confirm(`Delete entry ${e.ref}? This can't be undone.`)) onDeleteCashEntry(e.id); }} title="Delete entry"><X size={13} color={COLORS.urgent} /></button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                  <div className="flex flex-wrap gap-1.5">
                    <button onClick={() => setModal({ type: "topup", workerId: w.id })} className="text-[11px] font-semibold px-2.5 py-1 rounded-md" style={{ background: COLORS.paperDark, color: COLORS.steel }}>+ Top-up</button>
                    <button onClick={() => setModal({ type: "income", workerId: w.id })} className="text-[11px] font-semibold px-2.5 py-1 rounded-md" style={{ background: COLORS.paperDark, color: COLORS.steel }}>+ Income</button>
                    <button onClick={() => setModal({ type: "expense", workerId: w.id })} className="text-[11px] font-semibold px-2.5 py-1 rounded-md" style={{ background: COLORS.paperDark, color: COLORS.steel }}>+ Expense</button>
                    <button onClick={() => setModal({ type: "transfer", workerId: w.id })} className="text-[11px] font-semibold px-2.5 py-1 rounded-md" style={{ background: COLORS.paperDark, color: COLORS.steel }}>+ Transfer</button>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {modal && (
        <CashActionModal
          type={modal.type}
          worker={workers.find((w) => w.id === modal.workerId) || workers[0]}
          workers={workers} jobOrders={jobOrders}
          onWorkerChange={(id) => setModal((m) => ({ ...m, workerId: id }))}
          onClose={() => setModal(null)}
          onSubmitEntry={(entry) => onAddCashEntry(entry)}
          onSubmitTransfer={(t) => onAddTransfer(t)}
        />
      )}
      {editEntry && (
        <EditCashEntryModal entry={editEntry} jobOrders={jobOrders}
          onClose={() => setEditEntry(null)}
          onSave={(patch) => { onUpdateCashEntry(editEntry.id, patch); setEditEntry(null); }} />
      )}
    </div>
  );
}

function EditCashEntryModal({ entry, jobOrders, onClose, onSave }) {
  const meta = CASH_TYPES[entry.type];
  const [amount, setAmount] = useState(entry.amount);
  const [description, setDescription] = useState(entry.description || "");
  const [date, setDate] = useState(entry.date || todayISO());
  const [projectNo, setProjectNo] = useState(entry.projectNo || "");
  const [postedToFinance, setPostedToFinance] = useState(!!entry.postedToFinance);
  const [receipt, setReceipt] = useState(entry.receipt || null);
  const [receiptName, setReceiptName] = useState(entry.receiptName || "");
  const [uploading, setUploading] = useState(false);
  const showProject = entry.type === "expense" || entry.type === "income";
  const isTransfer = entry.type === "transfer_out" || entry.type === "transfer_in";

  const handleFile = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (file.size > 3 * 1024 * 1024) { alert("Please choose a file under 3MB."); return; }
    setUploading(true);
    try {
      const dataUrl = await fileToDataUrl(file);
      setReceipt(dataUrl); setReceiptName(file.name);
    } finally { setUploading(false); }
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" style={{ background: "rgba(20,25,20,0.5)" }}>
      <div className="w-full sm:max-w-sm rounded-t-xl sm:rounded-xl overflow-hidden" style={{ background: COLORS.paper }}>
        <div className="px-5 py-4 flex items-center justify-between" style={{ background: COLORS.steelDark }}>
          <div className="disp text-white font-bold tracking-wide flex items-center gap-2"><Settings2 size={16} color={COLORS.safety} /> EDIT ENTRY — {entry.ref}</div>
          <button onClick={onClose}><X size={18} color="#fff" /></button>
        </div>
        <div className="p-5">
          <div className="text-[11px] mb-3" style={{ color: "#8A8F84" }}>
            {meta.label}{isTransfer ? " — editing the amount updates both sides of this transfer." : ""}
          </div>
          <Field label="Amount (AED)"><input type="number" step="0.01" className={inputCls} style={inputStyle} value={amount} onChange={(e) => setAmount(e.target.value)} /></Field>
          {showProject && (
            <Field label="Project No">
              <select className={inputCls} style={inputStyle} value={projectNo} onChange={(e) => setProjectNo(e.target.value)}>
                <option value="">No specific project</option>
                {jobOrders.map((j) => <option key={j.id} value={j.projectNo || j.jobOrderNo}>{j.projectNo || j.jobOrderNo} — {j.clientName}</option>)}
              </select>
            </Field>
          )}
          <Field label="Date"><input type="date" className={inputCls} style={inputStyle} value={date} onChange={(e) => setDate(e.target.value)} /></Field>
          <Field label="Note"><textarea className={inputCls} style={{ ...inputStyle, minHeight: 50 }} value={description} onChange={(e) => setDescription(e.target.value)} /></Field>
          {entry.type === "expense" && (
            <Field label="Receipt / Invoice (optional)">
              <input type="file" accept="image/*,.pdf" onChange={handleFile} className="text-xs" />
              {uploading && <div className="text-[11px] mt-1" style={{ color: "#8A8F84" }}>Reading file…</div>}
              {receipt && receipt.startsWith("data:image") && (
                <img src={receipt} alt="receipt" className="mt-2 rounded-md max-h-32 border" style={{ borderColor: COLORS.line }} />
              )}
              {receipt && !receipt.startsWith("data:image") && (
                <div className="text-[11px] mt-1 flex items-center gap-1" style={{ color: COLORS.steel }}><Paperclip size={11} /> {receiptName}</div>
              )}
            </Field>
          )}
          <div className="flex items-center justify-between mb-3 mt-1">
            <span className="text-[11px] font-semibold uppercase tracking-wide" style={{ color: COLORS.steelLight }}>Tally Posted</span>
            <Switch checked={postedToFinance} onChange={setPostedToFinance} />
          </div>
          <div className="flex gap-2">
            <button onClick={onClose} className="flex-1 py-2 rounded-md text-sm font-semibold" style={{ background: COLORS.paperDark, color: COLORS.steel }}>Cancel</button>
            <button
              onClick={() => onSave({ amount: Number(amount), description, date, projectNo: showProject ? (projectNo || null) : entry.projectNo, postedToFinance, receipt: receipt || null, receiptName: receiptName || null })}
              className="flex-1 py-2 rounded-md text-sm font-bold disp tracking-wide" style={{ background: COLORS.safety, color: COLORS.steelDark }}>
              SAVE
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function CashActionModal({ type, worker, workers, jobOrders, onWorkerChange, onClose, onSubmitEntry, onSubmitTransfer }) {
  const [amount, setAmount] = useState("");
  const [projectNo, setProjectNo] = useState("");
  const [description, setDescription] = useState("");
  const [date, setDate] = useState(todayISO());
  const [receipt, setReceipt] = useState(null);
  const [receiptName, setReceiptName] = useState("");
  const [uploading, setUploading] = useState(false);
  const [toWorkerId, setToWorkerId] = useState(workers.find((w) => w.id !== worker.id)?.id || "");

  useEffect(() => {
    setToWorkerId(workers.find((w) => w.id !== worker.id)?.id || "");
  }, [worker.id]); // eslint-disable-line react-hooks/exhaustive-deps

  const META = {
    expense: { title: "Log Expense", icon: Receipt, color: COLORS.urgent },
    income: { title: "Income Collected", icon: Banknote, color: COLORS.go },
    topup: { title: "Bank Top-up", icon: Landmark, color: COLORS.steel },
    transfer: { title: "Transfer Petty Cash", icon: ArrowLeftRight, color: COLORS.amber },
  };
  const meta = META[type];
  const Icon = meta.icon;

  const handleFile = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (file.size > 3 * 1024 * 1024) { alert("Please choose a file under 3MB."); return; }
    setUploading(true);
    try {
      const dataUrl = await fileToDataUrl(file);
      setReceipt(dataUrl); setReceiptName(file.name);
    } finally { setUploading(false); }
  };

  const canSubmit = Number(amount) > 0
    && (type !== "expense" || projectNo.trim())
    && (type !== "transfer" || (toWorkerId && toWorkerId !== worker.id));

  const submit = () => {
    if (!canSubmit) return;
    if (type === "transfer") {
      onSubmitTransfer({ fromWorkerId: worker.id, toWorkerId, amount: Number(amount), description, date });
    } else {
      onSubmitEntry({
        type, workerId: worker.id, workerName: worker.name, amount: Number(amount),
        projectNo: projectNo || null, description, date, receipt: receipt || null, receiptName: receiptName || null,
      });
    }
    onClose();
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" style={{ background: "rgba(20,25,20,0.5)" }}>
      <div className="w-full sm:max-w-md rounded-t-xl sm:rounded-xl overflow-hidden max-h-[92vh] overflow-y-auto" style={{ background: COLORS.paper }}>
        <div className="px-5 py-4 flex items-center justify-between" style={{ background: COLORS.steelDark }}>
          <div className="disp text-white font-bold tracking-wide flex items-center gap-2"><Icon size={16} color={COLORS.safety} /> {meta.title.toUpperCase()}</div>
          <button onClick={onClose}><X size={18} color="#fff" /></button>
        </div>
        <div className="p-5">
          {onWorkerChange && (
            <Field label={type === "transfer" ? "Transfer From" : "For Worker"}>
              <select className={inputCls} style={inputStyle} value={worker.id} onChange={(e) => onWorkerChange(e.target.value)}>
                {workers.map((w) => <option key={w.id} value={w.id}>{w.name}</option>)}
              </select>
            </Field>
          )}
          <Field label="Amount (AED)">
            <input type="number" min="0" step="0.01" className={inputCls} style={inputStyle} value={amount} onChange={(e) => setAmount(e.target.value)} placeholder="0.00" />
          </Field>
          {type === "expense" && (
            <Field label="Project No" hint="Which job this expense belongs to">
              <select className={inputCls} style={inputStyle} value={projectNo} onChange={(e) => setProjectNo(e.target.value)}>
                <option value="">Select project…</option>
                {jobOrders.map((j) => <option key={j.id} value={j.projectNo || j.jobOrderNo}>{j.projectNo || j.jobOrderNo} — {j.clientName}</option>)}
              </select>
            </Field>
          )}
          {type === "income" && (
            <Field label="Project No (optional)">
              <select className={inputCls} style={inputStyle} value={projectNo} onChange={(e) => setProjectNo(e.target.value)}>
                <option value="">No specific project</option>
                {jobOrders.map((j) => <option key={j.id} value={j.projectNo || j.jobOrderNo}>{j.projectNo || j.jobOrderNo} — {j.clientName}</option>)}
              </select>
            </Field>
          )}
          {type === "transfer" && (
            <Field label="Transfer To">
              <select className={inputCls} style={inputStyle} value={toWorkerId} onChange={(e) => setToWorkerId(e.target.value)}>
                {workers.filter((w) => w.id !== worker.id).map((w) => <option key={w.id} value={w.id}>{w.name}</option>)}
              </select>
            </Field>
          )}
          <Field label="Date"><input type="date" className={inputCls} style={inputStyle} value={date} onChange={(e) => setDate(e.target.value)} /></Field>
          <Field label="Note"><textarea className={inputCls} style={{ ...inputStyle, minHeight: 50 }} value={description} onChange={(e) => setDescription(e.target.value)} placeholder="What's this for?" /></Field>

          {type === "expense" && (
            <Field label="Receipt / Invoice (optional)">
              <input type="file" accept="image/*,.pdf" onChange={handleFile} className="text-xs" />
              {uploading && <div className="text-[11px] mt-1" style={{ color: "#8A8F84" }}>Reading file…</div>}
              {receipt && receipt.startsWith("data:image") && (
                <img src={receipt} alt="receipt" className="mt-2 rounded-md max-h-32 border" style={{ borderColor: COLORS.line }} />
              )}
              {receipt && !receipt.startsWith("data:image") && (
                <div className="text-[11px] mt-1 flex items-center gap-1" style={{ color: COLORS.steel }}><Paperclip size={11} /> {receiptName}</div>
              )}
            </Field>
          )}

          <div className="flex gap-2 mt-2">
            <button onClick={onClose} className="flex-1 py-2 rounded-md text-sm font-semibold" style={{ background: COLORS.paperDark, color: COLORS.steel }}>Cancel</button>
            <button onClick={submit} disabled={!canSubmit}
              className="flex-1 py-2 rounded-md text-sm font-bold disp tracking-wide"
              style={{ background: canSubmit ? COLORS.safety : "#D8DACB", color: COLORS.steelDark }}>
              SUBMIT
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function WorkerCashPanel({ worker, workers, jobOrders, cash, onAddCashEntry, onAddTransfer, onUpdateCashEntry }) {
  const [modalType, setModalType] = useState(null);
  const [attachEntry, setAttachEntry] = useState(null);
  const myEntries = cash.entries.filter((e) => e.workerId === worker.id).sort((a, b) => b.createdAt - a.createdAt);
  const balance = workerCashBalance(worker.id, cash.entries);

  const actions = [
    { type: "expense", label: "Log Expense", icon: Receipt, color: COLORS.urgent },
    { type: "income", label: "Income Collected", icon: Banknote, color: COLORS.go },
    { type: "topup", label: "Bank Top-up", icon: Landmark, color: COLORS.steel },
    { type: "transfer", label: "Transfer", icon: ArrowLeftRight, color: COLORS.amber },
  ];

  return (
    <div>
      <div className="rounded-lg p-4 mb-4 text-center" style={{ background: COLORS.steelDark }}>
        <div className="text-[11px] uppercase tracking-widest text-white/50 mb-1">Petty Cash Balance</div>
        <div className="disp text-3xl font-bold" style={{ color: balance < 0 ? COLORS.urgent : COLORS.safety }}>{fmtMoney(balance)}</div>
      </div>

      <div className="grid grid-cols-2 gap-2 mb-4">
        {actions.map((a) => {
          const Icon = a.icon;
          return (
            <button key={a.type} onClick={() => setModalType(a.type)}
              className="flex items-center justify-center gap-1.5 py-2.5 rounded-md text-sm font-semibold"
              style={{ border: `1.5px solid ${a.color}`, color: a.color, background: "#fff" }}>
              <Icon size={14} /> {a.label}
            </button>
          );
        })}
      </div>

      <div className="grid gap-2">
        {myEntries.length === 0 && <EmptyState text="No petty cash transactions yet." />}
        {myEntries.map((e) => {
          const meta = CASH_TYPES[e.type];
          const counterpart = e.counterpartWorkerId ? workers.find((w) => w.id === e.counterpartWorkerId) : null;
          return (
            <div key={e.id} className="p-3 rounded-lg" style={{ background: "#fff", border: `1.5px solid ${COLORS.line}` }}>
              <div className="flex items-center justify-between">
                <div>
                  <div className="text-sm font-semibold flex items-center gap-1.5">
                    {meta.label}
                    <span className="mono text-[10px] font-normal px-1.5 py-0.5 rounded" style={{ background: COLORS.paper, color: "#8A8F84" }}>{e.ref}</span>
                    {e.receipt && <Paperclip size={11} color={COLORS.steel} />}
                  </div>
                  <div className="text-[11px]" style={{ color: "#8A8F84" }}>
                    {e.date}{e.projectNo ? ` · Project ${e.projectNo}` : ""}{counterpart ? ` · ${e.type === "transfer_out" ? "to" : "from"} ${counterpart.name}` : ""}
                  </div>
                  {e.description && <div className="text-[11px] mt-0.5">{e.description}</div>}
                </div>
                <div className="mono text-sm font-bold" style={{ color: meta.sign > 0 ? COLORS.go : COLORS.urgent }}>
                  {meta.sign > 0 ? "+" : "−"}{fmtMoney(e.amount)}
                </div>
              </div>
              {e.type === "expense" && (
                <div className="flex items-center gap-2 mt-2 pt-2" style={{ borderTop: `1px solid ${COLORS.paper}` }}>
                  {e.receipt && e.receipt.startsWith("data:image") && (
                    <img src={e.receipt} alt="receipt" className="rounded-md" style={{ height: 32, width: 32, objectFit: "cover", border: `1px solid ${COLORS.line}` }} />
                  )}
                  <button onClick={() => setAttachEntry(e)} className="text-[11px] font-semibold flex items-center gap-1" style={{ color: COLORS.steel }}>
                    <Paperclip size={11} /> {e.receipt ? "Replace attachment" : "Add attachment"}
                  </button>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {modalType && (
        <CashActionModal
          type={modalType} worker={worker} workers={workers} jobOrders={jobOrders}
          onClose={() => setModalType(null)}
          onSubmitEntry={(entry) => onAddCashEntry(entry)}
          onSubmitTransfer={(t) => onAddTransfer(t)}
        />
      )}
      {attachEntry && (
        <EditAttachmentModal entry={attachEntry}
          onClose={() => setAttachEntry(null)}
          onSave={(patch) => { onUpdateCashEntry(attachEntry.id, patch); setAttachEntry(null); }} />
      )}
    </div>
  );
}

// Field-side, worker-scoped: the only thing an employee can change on their own
// petty cash entry is the receipt image — amount/date/description stay
// admin-only (see EditCashEntryModal, Dispatch-only).
function EditAttachmentModal({ entry, onClose, onSave }) {
  const [receipt, setReceipt] = useState(entry.receipt || null);
  const [receiptName, setReceiptName] = useState(entry.receiptName || "");
  const [uploading, setUploading] = useState(false);

  const handleFile = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (file.size > 3 * 1024 * 1024) { alert("Please choose a file under 3MB."); return; }
    setUploading(true);
    try {
      const dataUrl = await fileToDataUrl(file);
      setReceipt(dataUrl); setReceiptName(file.name);
    } finally { setUploading(false); }
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" style={{ background: "rgba(20,25,20,0.5)" }}>
      <div className="w-full sm:max-w-sm rounded-t-xl sm:rounded-xl overflow-hidden" style={{ background: COLORS.paper }}>
        <div className="px-5 py-4 flex items-center justify-between" style={{ background: COLORS.steelDark }}>
          <div className="disp text-white font-bold tracking-wide flex items-center gap-2"><Paperclip size={16} color={COLORS.safety} /> {entry.ref} ATTACHMENT</div>
          <button onClick={onClose}><X size={18} color="#fff" /></button>
        </div>
        <div className="p-5">
          <div className="text-[11px] mb-3" style={{ color: "#8A8F84" }}>You can update the receipt photo for this expense. The amount, date, and note can only be changed by your dispatcher.</div>
          <Field label="Receipt / Invoice">
            <input type="file" accept="image/*,.pdf" onChange={handleFile} className="text-xs" />
            {uploading && <div className="text-[11px] mt-1" style={{ color: "#8A8F84" }}>Reading file…</div>}
            {receipt && receipt.startsWith("data:image") && (
              <img src={receipt} alt="receipt" className="mt-2 rounded-md max-h-40 border" style={{ borderColor: COLORS.line }} />
            )}
            {receipt && !receipt.startsWith("data:image") && (
              <div className="text-[11px] mt-1 flex items-center gap-1" style={{ color: COLORS.steel }}><Paperclip size={11} /> {receiptName}</div>
            )}
          </Field>
          <div className="flex gap-2 mt-2">
            <button onClick={onClose} className="flex-1 py-2 rounded-md text-sm font-semibold" style={{ background: COLORS.paperDark, color: COLORS.steel }}>Cancel</button>
            <button onClick={() => onSave({ receipt, receiptName })} disabled={uploading}
              className="flex-1 py-2 rounded-md text-sm font-bold disp tracking-wide" style={{ background: COLORS.safety, color: COLORS.steelDark }}>
              SAVE
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}
