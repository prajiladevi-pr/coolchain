// Daily start/end-of-day clock, independent of which job is worked. Stores
// both the clock-in AND clock-out calendar date explicitly, so a night shift
// (clock in 10pm, clock out 6am the next day) gets a correct duration instead
// of guessing at a same-day wraparound.
function ClockCard({ worker, attendance, onClockIn, onClockOut }) {
  const openShift = attendance.entries.find((a) => a.workerId === worker.id && a.status === "open");
  const isNightSoFar = openShift && openShift.clockInDate !== todayISO();

  return (
    <div className="mb-4 rounded-lg p-3 flex items-center justify-between" style={{ background: openShift ? COLORS.go : COLORS.steelDark }}>
      <div>
        <div className="text-[10px] uppercase tracking-widest text-white/60">
          {openShift ? `Clocked in ${openShift.clockInTime}${isNightSoFar ? ` · ${openShift.clockInDate}` : ""}` : "Not clocked in"}
        </div>
        <div className="disp text-lg font-bold text-white">{openShift ? "ON SHIFT" : "OFF SHIFT"}</div>
      </div>
      <button onClick={() => (openShift ? onClockOut(worker) : onClockIn(worker))}
        className="disp px-4 py-2 rounded-md text-sm font-bold tracking-wide flex items-center gap-1.5"
        style={{ background: COLORS.safety, color: COLORS.steelDark }}>
        <Clock size={14} /> {openShift ? "CLOCK OUT" : "CLOCK IN"}
      </button>
    </div>
  );
}

function ShiftStat({ label, value, target }) {
  const short = value < target;
  return (
    <div className="rounded-lg p-2.5 text-center" style={{ background: "#fff", border: `1.5px solid ${short ? COLORS.urgent : COLORS.line}` }}>
      <div className="text-[10px] uppercase" style={{ color: "#8A8F84" }}>{label}</div>
      <div className="mono text-base font-bold" style={{ color: short ? COLORS.urgent : COLORS.ink }}>{value.toFixed(1)}h</div>
      <div className="text-[9px]" style={{ color: "#8A8F84" }}>of {target}h target</div>
    </div>
  );
}

function MyShiftsPanel({ worker, attendance, entries }) {
  const myShifts = attendance.entries.filter((a) => a.workerId === worker.id).sort((a, b) => b.createdAt - a.createdAt);
  const targets = attendance.targets || { daily: 8, weekly: 48, monthly: 200 };
  const today = todayISO();
  const day = periodRange("day", today), week = periodRange("week", today), month = periodRange("month", today);
  const todayHours = hoursInPeriod(worker.id, attendance.entries, entries, day.start, day.end);
  const weekHours = hoursInPeriod(worker.id, attendance.entries, entries, week.start, week.end);
  const monthHours = hoursInPeriod(worker.id, attendance.entries, entries, month.start, month.end);

  return (
    <div>
      <div className="text-[11px] mb-3" style={{ color: "#8A8F84" }}>Totals include logged job time on any day you forgot to clock in/out.</div>
      <div className="grid grid-cols-3 gap-2 mb-4">
        <ShiftStat label="Today" value={todayHours} target={targets.daily} />
        <ShiftStat label="This Week" value={weekHours} target={targets.weekly} />
        <ShiftStat label="This Month" value={monthHours} target={targets.monthly} />
      </div>
      <div className="grid gap-2">
        {myShifts.length === 0 && <EmptyState text="No shifts recorded yet — clock in above to start one." />}
        {myShifts.map((a) => (
          <div key={a.id} className="p-3 rounded-lg flex items-center justify-between" style={{ background: "#fff", border: `1.5px solid ${COLORS.line}` }}>
            <div>
              <div className="text-sm font-semibold mono">
                {a.clockInDate} {a.clockInTime}
                {a.clockOutTime ? ` → ${a.clockOutDate !== a.clockInDate ? `${a.clockOutDate} ` : ""}${a.clockOutTime}` : ""}
              </div>
              <div className="text-[11px]" style={{ color: "#8A8F84" }}>{a.status === "open" ? "In progress" : `${a.hours.toFixed(2)}h shift`}</div>
            </div>
            {a.status === "open" && (
              <span className="text-[11px] font-semibold flex items-center gap-1" style={{ color: COLORS.go }}>
                <span className="w-1.5 h-1.5 rounded-full" style={{ background: COLORS.go }} /> ON SHIFT
              </span>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

// Lets the designated team lead log the same date/time in-out for every
// crew member on a job in one action, instead of each person doing it
// individually. Each worker's cost is still computed off their own rate.
function LogCrewTimeModal({ job, workers, onClose, onSubmit }) {
  const [date, setDate] = useState(todayISO());
  const [timeIn, setTimeIn] = useState(nowHHMM());
  const [timeOut, setTimeOut] = useState(nowHHMM());
  const [note, setNote] = useState("");
  const [selected, setSelected] = useState(workers.map((w) => w.id));

  const hours = hoursBetween(timeIn, timeOut);
  const days = hours / 8;
  const toggle = (id) => setSelected((s) => (s.includes(id) ? s.filter((x) => x !== id) : [...s, id]));
  const selectedWorkers = workers.filter((w) => selected.includes(w.id));
  const totalCost = selectedWorkers.reduce((s, w) => s + w.rate * days, 0);

  const submit = () => {
    if (hours <= 0 || selectedWorkers.length === 0) return;
    const newEntries = selectedWorkers.map((w) => ({
      id: genId("e"), jobId: job.id, workerId: w.id, workerName: w.name, category: w.category,
      date, timeIn, timeOut, hours, days, cost: w.rate * days, note, createdAt: Date.now(),
    }));
    onSubmit(newEntries);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" style={{ background: "rgba(20,25,20,0.5)" }}>
      <div className="w-full sm:max-w-md rounded-t-xl sm:rounded-xl overflow-hidden max-h-[92vh] overflow-y-auto" style={{ background: COLORS.paper }}>
        <div className="px-5 py-4 flex items-center justify-between" style={{ background: COLORS.steelDark }}>
          <div className="disp text-white font-bold tracking-wide flex items-center gap-2"><Users size={16} color={COLORS.safety} /> LOG CREW TIME — #{job.jobOrderNo}</div>
          <button onClick={onClose}><X size={18} color="#fff" /></button>
        </div>
        <div className="p-5">
          <div className="text-[11px] mb-3" style={{ color: "#8A8F84" }}>Applies the same date and time to everyone selected below. Each person's cost still uses their own rate.</div>
          <Field label="Date"><input type="date" className={inputCls} style={inputStyle} value={date} onChange={(e) => setDate(e.target.value)} /></Field>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Time In"><input type="time" className={inputCls} style={inputStyle} value={timeIn} onChange={(e) => setTimeIn(e.target.value)} /></Field>
            <Field label="Time Out"><input type="time" className={inputCls} style={inputStyle} value={timeOut} onChange={(e) => setTimeOut(e.target.value)} /></Field>
          </div>
          <Field label="Work Note"><textarea className={inputCls} style={{ ...inputStyle, minHeight: 50 }} value={note} onChange={(e) => setNote(e.target.value)} placeholder={job.scope} /></Field>

          <div className="text-[10px] font-semibold uppercase tracking-wide mb-1" style={{ color: COLORS.steelLight }}>Crew ({selectedWorkers.length} of {workers.length})</div>
          <div className="grid gap-1 max-h-40 overflow-y-auto p-1 rounded-md mb-3" style={{ border: `1.5px solid ${COLORS.line}` }}>
            {workers.map((w) => (
              <button key={w.id} type="button" onClick={() => toggle(w.id)}
                className="flex items-center justify-between px-2 py-1.5 rounded text-xs font-medium"
                style={{ background: selected.includes(w.id) ? "#E7ECEF" : "transparent", color: COLORS.ink }}>
                <span>{w.name} <span className="mono opacity-50">({fmtMoney(w.rate)}/day)</span></span>
                {selected.includes(w.id) && <Check size={13} color={COLORS.steel} />}
              </button>
            ))}
          </div>

          <div className="rounded-lg p-3 mb-4 flex items-center justify-between" style={{ background: "#fff", border: `1.5px solid ${COLORS.line}` }}>
            <div className="text-[11px]" style={{ color: "#8A8F84" }}>
              <div className="mono">{hours.toFixed(2)} hrs · {days.toFixed(3)} days each</div>
              <div>{selectedWorkers.length} crew member{selectedWorkers.length === 1 ? "" : "s"}</div>
            </div>
            <div className="disp text-xl font-bold" style={{ color: COLORS.steel }}>{fmtMoney(totalCost)}</div>
          </div>

          <div className="flex gap-2">
            <button onClick={onClose} className="flex-1 py-2 rounded-md text-sm font-semibold" style={{ background: COLORS.paperDark, color: COLORS.steel }}>Cancel</button>
            <button onClick={submit} disabled={hours <= 0 || selectedWorkers.length === 0}
              className="flex-1 py-2 rounded-md text-sm font-bold disp tracking-wide"
              style={{ background: (hours > 0 && selectedWorkers.length > 0) ? COLORS.safety : "#D8DACB", color: COLORS.steelDark }}>
              SUBMIT FOR {selectedWorkers.length} PEOPLE
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function FieldView({ workers, vehicles, categories, jobOrders, entries, cash, attendance, onUpdateJob, onAddEntry, onAddEntries, onUpdateWorker, onAddCashEntry, onAddTransfer, onUpdateCashEntry, onClockIn, onClockOut }) {
  const [workerId, setWorkerId] = useState(null); // authenticated worker id, session-only
  const [tab, setTab] = useState("tickets");
  const [logJob, setLogJob] = useState(null);
  const [logCrewJob, setLogCrewJob] = useState(null);

  const me = workers.find((w) => w.id === workerId);
  const order = { High: 0, Medium: 1, Low: 2 };
  const myTickets = workerId ? jobOrders
    .filter((j) => j.workerIds.includes(workerId))
    .sort((a, b) => {
      const aDone = a.status === "Completed" ? 1 : 0;
      const bDone = b.status === "Completed" ? 1 : 0;
      if (aDone !== bDone) return aDone - bDone; // active jobs first, completed sink to the bottom
      return order[a.priority] - order[b.priority];
    }) : [];
  const myHistory = workerId ? entries.filter((e) => e.workerId === workerId).sort((a, b) => b.createdAt - a.createdAt) : [];

  if (workers.length === 0) return <div className="p-5 text-sm" style={{ color: "#8A8F84" }}>No workers in the roster yet — add one from the Dispatch → Roster tab.</div>;

  if (!me) {
    return <FieldLogin workers={workers} onLogin={(id) => { setWorkerId(id); setTab("tickets"); }} />;
  }

  return (
    <div className="p-4 max-w-lg mx-auto">
      {/* signed-in strip */}
      <div className="mb-4 p-3 rounded-lg flex items-center gap-3" style={{ background: COLORS.steelDark }}>
        <div className="w-10 h-10 rounded-full flex items-center justify-center disp font-bold text-lg" style={{ background: COLORS.safety, color: COLORS.steelDark }}>
          {me.name[0]}
        </div>
        <div className="flex-1">
          <div className="disp text-white font-bold text-base tracking-wide">{me.name}</div>
          <div className="text-[11px] text-white/50">{catLabel(categories, me.category)} · {fmtMoney(me.rate)}/day</div>
        </div>
        <button onClick={() => setWorkerId(null)} className="text-[11px] font-semibold px-2.5 py-1 rounded-md" style={{ background: "rgba(255,255,255,0.12)", color: "#fff" }}>
          Sign out
        </button>
      </div>

      <ClockCard worker={me} attendance={attendance} onClockIn={onClockIn} onClockOut={onClockOut} />

      {/* self-reported availability — "On Job" is automatic from active assignments;
          these buttons only set the manual overrides */}
      <div className="mb-1 flex items-center gap-1.5">
        <span className="text-[11px]" style={{ color: "#8A8F84" }}>Status:</span>
        <span className="text-[11px] font-semibold px-2 py-0.5 rounded-full flex items-center gap-1" style={{ color: availabilityMeta(computeWorkerStatus(me, jobOrders)).color, background: `${availabilityMeta(computeWorkerStatus(me, jobOrders)).color}1A` }}>
          <span className="w-1.5 h-1.5 rounded-full" style={{ background: availabilityMeta(computeWorkerStatus(me, jobOrders)).color }} /> {computeWorkerStatus(me, jobOrders)}
        </span>
      </div>
      <div className="mb-4 flex flex-wrap gap-1.5">
        {(() => {
          const isOverride = me.availability && WORKER_OVERRIDES.includes(me.availability);
          return (
            <>
              <button onClick={() => onUpdateWorker(me.id, { availability: null })}
                className="text-[11px] font-semibold px-2.5 py-1 rounded-full"
                style={{ background: !isOverride ? COLORS.steel : "#fff", color: !isOverride ? "#fff" : COLORS.steel, border: `1.5px solid ${COLORS.steel}` }}>
                Auto
              </button>
              {WORKER_OVERRIDES.map((id) => (
                <button key={id} onClick={() => onUpdateWorker(me.id, { availability: id })}
                  className="text-[11px] font-semibold px-2.5 py-1 rounded-full"
                  style={{ background: me.availability === id ? availabilityMeta(id).color : "#fff", color: me.availability === id ? "#fff" : availabilityMeta(id).color, border: `1.5px solid ${availabilityMeta(id).color}` }}>
                  {id}
                </button>
              ))}
            </>
          );
        })()}
      </div>

      <div className="flex gap-1 p-1 rounded-lg mb-3" style={{ background: COLORS.paperDark }}>
        {[{ id: "tickets", label: `My Jobs (${myTickets.length})`, icon: ClipboardList }, { id: "history", label: "History", icon: Clock }, { id: "shifts", label: "Shifts", icon: CalendarDays }, { id: "cash", label: "Cash", icon: Wallet }].map((t) => {
          const Icon = t.icon;
          return (
            <button key={t.id} onClick={() => setTab(t.id)}
              className="flex-1 disp py-1.5 rounded-md text-sm font-semibold flex items-center justify-center gap-1.5 tracking-wide"
              style={{ background: tab === t.id ? "#fff" : "transparent", color: tab === t.id ? COLORS.steel : COLORS.steelLight }}>
              <Icon size={14} /> {t.label.toUpperCase()}
            </button>
          );
        })}
      </div>

      {tab === "tickets" && (
        <div className="grid gap-3">
          {myTickets.length === 0 && <EmptyState text="No jobs assigned to you right now." />}
          {myTickets.map((j) => {
            const vehicle = vehicles.find((v) => v.id === j.vehicleId);
            return (
              <div key={j.id} className="ticket p-4">
                <div className="flex items-start justify-between mb-1.5">
                  <div className="mono text-[11px] font-bold" style={{ color: COLORS.steel }}>#{j.jobOrderNo}</div>
                  <PriorityStamp priority={j.priority} />
                </div>
                <div className="disp text-base font-bold leading-tight mb-1">{j.clientName}</div>
                <div className="flex items-center gap-1.5 text-[12px] mb-2" style={{ color: "#5C665C" }}>
                  <MapPin size={12} /> {j.area}, {j.emirates}
                </div>
                <div className="text-[12.5px] mb-3">{j.scope}</div>
                {vehicle && (
                  <div className="flex items-center gap-1.5 text-[12px] font-semibold mb-3" style={{ color: COLORS.amber }}>
                    <Truck size={13} /> Take vehicle {vehicle.name}{j.avgOneWayKm ? ` · ~${(Number(j.avgOneWayKm) * 2).toFixed(0)} km round trip` : ""}
                  </div>
                )}
                <div className="perf pt-3 flex items-center gap-2 flex-wrap">
                  <StatusPill status={j.status} />
                  <div className="ml-auto flex gap-2">
                    {j.teamLeadId === me.id && j.workerIds.length > 1 && (
                      <button onClick={() => setLogCrewJob(j)}
                        className="disp flex items-center gap-1 px-3 py-1.5 rounded-md text-sm font-bold tracking-wide"
                        style={{ background: COLORS.steel, color: "#fff" }}>
                        <Users size={14} /> LOG CREW TIME
                      </button>
                    )}
                    <button onClick={() => setLogJob(j)}
                      className="disp flex items-center gap-1 px-3 py-1.5 rounded-md text-sm font-bold tracking-wide"
                      style={{ background: COLORS.safety, color: COLORS.steelDark }}>
                      <Clock size={14} /> {j.teamLeadId === me.id && j.workerIds.length > 1 ? "LOG MY TIME" : "LOG TIME"}
                    </button>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {tab === "history" && (
        <div className="grid gap-2">
          {myHistory.length === 0 && <EmptyState text="No entries logged yet." />}
          {myHistory.map((e) => {
            const job = jobOrders.find((j) => j.id === e.jobId);
            return (
              <div key={e.id} className="p-3 rounded-lg flex items-center justify-between" style={{ background: "#fff", border: `1.5px solid ${COLORS.line}` }}>
                <div>
                  <div className="text-sm font-semibold">{job?.clientName || "—"} <span className="mono text-[11px] opacity-60">#{job?.jobOrderNo}</span></div>
                  <div className="text-[11px] mono" style={{ color: "#8A8F84" }}>{e.date} · {e.timeIn}–{e.timeOut} · {e.hours.toFixed(2)}h</div>
                </div>
                <div className="mono text-sm font-bold">{fmtMoney(e.cost)}</div>
              </div>
            );
          })}
        </div>
      )}

      {tab === "shifts" && <MyShiftsPanel worker={me} attendance={attendance} entries={entries} />}

      {tab === "cash" && (
        <WorkerCashPanel worker={me} workers={workers} jobOrders={jobOrders} cash={cash}
          onAddCashEntry={onAddCashEntry} onAddTransfer={onAddTransfer} onUpdateCashEntry={onUpdateCashEntry} />
      )}

      {logJob && (
        <LogEntryModal job={logJob} worker={me} categories={categories}
          onClose={() => setLogJob(null)}
          onSubmit={(entry) => { onAddEntry(entry); setLogJob(null); }} />
      )}
      {logCrewJob && (
        <LogCrewTimeModal job={logCrewJob} workers={workers.filter((w) => logCrewJob.workerIds.includes(w.id))}
          onClose={() => setLogCrewJob(null)}
          onSubmit={(newEntries) => { onAddEntries(newEntries); setLogCrewJob(null); }} />
      )}
    </div>
  );
}

function FieldLogin({ workers, onLogin }) {
  const [selected, setSelected] = useState(workers[0]?.id || "");
  const [pin, setPin] = useState("");
  const [error, setError] = useState("");

  const submit = () => {
    const w = workers.find((x) => x.id === selected);
    if (!w) return;
    if (!w.pin) { onLogin(w.id); return; } // no PIN set yet — allow through, dispatcher hasn't configured one
    if (pin.trim() === String(w.pin)) {
      setError(""); onLogin(w.id);
    } else {
      setError("Wrong PIN. Check with your dispatcher.");
    }
  };

  return (
    <div className="p-4 max-w-sm mx-auto pt-10">
      <div className="text-center mb-6">
        <div className="w-14 h-14 rounded-full mx-auto mb-3 flex items-center justify-center" style={{ background: COLORS.steelDark }}>
          <User size={24} color={COLORS.safety} />
        </div>
        <div className="disp text-xl font-bold tracking-wide" style={{ color: COLORS.steel }}>FIELD SIGN-IN</div>
        <div className="text-[12px]" style={{ color: "#8A8F84" }}>Select your name and enter your PIN</div>
      </div>

      <div className="rounded-lg p-4" style={{ background: "#fff", border: `1.5px solid ${COLORS.line}` }}>
        <Field label="Worker">
          <select className={inputCls} style={inputStyle} value={selected} onChange={(e) => { setSelected(e.target.value); setError(""); }}>
            {workers.map((w) => <option key={w.id} value={w.id}>{w.name}</option>)}
          </select>
        </Field>
        <Field label="PIN">
          <input
            type="password" inputMode="numeric" maxLength={6} value={pin}
            onChange={(e) => setPin(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") submit(); }}
            className={inputCls} style={{ ...inputStyle, letterSpacing: "0.3em", textAlign: "center", fontSize: 18 }}
            placeholder="••••"
          />
        </Field>
        {error && <div className="text-[12px] font-medium mb-3" style={{ color: COLORS.urgent }}>{error}</div>}
        <button onClick={submit} className="w-full py-2 rounded-md text-sm font-bold disp tracking-wide" style={{ background: COLORS.safety, color: COLORS.steelDark }}>
          SIGN IN
        </button>
      </div>
    </div>
  );
}

function LogEntryModal({ job, worker, categories, onClose, onSubmit }) {
  const [date, setDate] = useState(todayISO());
  const [timeIn, setTimeIn] = useState(nowHHMM());
  const [timeOut, setTimeOut] = useState(nowHHMM());
  const [note, setNote] = useState("");

  const hours = hoursBetween(timeIn, timeOut);
  const days = hours / 8;
  const cost = worker.rate * days;

  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" style={{ background: "rgba(20,25,20,0.5)" }}>
      <div className="w-full sm:max-w-md rounded-t-xl sm:rounded-xl overflow-hidden" style={{ background: COLORS.paper }}>
        <div className="px-5 py-4 flex items-center justify-between" style={{ background: COLORS.steelDark }}>
          <div className="disp text-white font-bold tracking-wide flex items-center gap-2"><Stamp size={16} color={COLORS.safety} /> LOG TIME — #{job.jobOrderNo}</div>
          <button onClick={onClose}><X size={18} color="#fff" /></button>
        </div>
        <div className="p-5">
          <Field label="Date"><input type="date" className={inputCls} style={inputStyle} value={date} onChange={(e) => setDate(e.target.value)} /></Field>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Time In"><input type="time" className={inputCls} style={inputStyle} value={timeIn} onChange={(e) => setTimeIn(e.target.value)} /></Field>
            <Field label="Time Out"><input type="time" className={inputCls} style={inputStyle} value={timeOut} onChange={(e) => setTimeOut(e.target.value)} /></Field>
          </div>
          <Field label="Work Note"><textarea className={inputCls} style={{ ...inputStyle, minHeight: 60 }} value={note} onChange={(e) => setNote(e.target.value)} placeholder={job.scope} /></Field>

          <div className="rounded-lg p-3 mb-4 flex items-center justify-between" style={{ background: "#fff", border: `1.5px solid ${COLORS.line}` }}>
            <div className="text-[11px]" style={{ color: "#8A8F84" }}>
              <div className="mono">{hours.toFixed(2)} hrs · {days.toFixed(3)} days</div>
              <div>{catLabel(categories, worker.category)} rate {fmtMoney(worker.rate)}/day</div>
            </div>
            <div className="disp text-xl font-bold" style={{ color: COLORS.steel }}>{fmtMoney(cost)}</div>
          </div>

          <div className="flex gap-2">
            <button onClick={onClose} className="flex-1 py-2 rounded-md text-sm font-semibold" style={{ background: COLORS.paperDark, color: COLORS.steel }}>Cancel</button>
            <button
              onClick={() => onSubmit({
                id: genId("e"), jobId: job.id, workerId: worker.id, workerName: worker.name, category: worker.category,
                date, timeIn, timeOut, hours, days, cost, note, createdAt: Date.now(),
              })}
              disabled={hours <= 0}
              className="flex-1 py-2 rounded-md text-sm font-bold disp tracking-wide"
              style={{ background: hours > 0 ? COLORS.safety : "#D8DACB", color: COLORS.steelDark }}>
              SUBMIT ENTRY
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
